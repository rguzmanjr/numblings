        return `<div class="w-item shop-item${on ? ' on' : ''}"><span class="w-thumb">${avatarSVG(G.look, { ...G.outfit, [it.slot]: it.id }, 'down')}</span><span class="w-name">${esc(tx(itemName(it)))}</span>
          ${own ? (on ? `<span class="small"><b>${tx(L('Wearing', 'Puesto'))}</b></span>` : `<button class="btn small" data-act="shop-wear" data-id="${it.id}">${tx(L('Wear', 'Ponerme'))}</button>`)
            : `<button class="btn small${afford ? ' primary' : ''}" data-act="shop-buy" data-id="${it.id}" ${afford ? '' : 'aria-disabled="true"'}>🪙 ${it.src.shop}</button>`}</div>`; }).join('')}</div></div>
  </div>`;
}
function shopBuy(id) {
  const it = OUTFIT[id]; if (!it || !it.src.shop || G.bought.has(id)) return;

<script>/* ===== teacher.js ===== */
/* Numlings: the teacher dashboard. Everything runs in this browser; no student data is sent anywhere. */
'use strict';
const T_KEY = 'numlings-teacher-v1';
const CODE_RE = /NL1\.[0-9a-z]+\.[A-Za-z0-9_-]+/;
const ZONE_OF_TOPIC = Object.fromEntries(Object.values(ZONES).map(z => [z.topic, z.name]));
const TIER_NAME = ['', 'Warm-up', 'On level', 'Challenge'];
let CLASS = [], SKIPPED = [], NOCODE = 0;
const TV = { period: 'all', topic: 'all', sort: 'name', group: null, detail: null, reward: null, picked: new Set(), codes: null };

/* ---------- mastery (same rules as the game) ---------- */
function kMastery(k) { if (!k || !k.r) return null; const rec = k.r.slice(-10); let s = 0; for (const ch of rec) s += ch === '2' ? 1 : ch === '1' ? 0.5 : 0; return s / rec.length; }
function kStatus(k) {
  const m = kMastery(k);
  if (m == null) return { label: 'Not tried', cls: 'new', m: null };
  if (k.r.length < 4) return { label: 'Getting started', cls: 'start', m };
  if (m >= 0.8 && k.r.length >= 5) return { label: 'Mastered', cls: 'mastered', m };
  if (m >= 0.5) return { label: 'Practicing', cls: 'practicing', m };
  return { label: 'Learning', cls: 'learning', m };
}
function summarize(st) {
  let a = 0, c = 0, h = 0, mastered = 0, tried = 0, mSum = 0;
  for (const sk of SKILLS) {
    const k = st.skills[sk.id]; if (!k) continue;
    a += k.a; c += k.c; h += k.h; tried++;
    const s = kStatus(k); if (s.cls === 'mastered') mastered++; if (s.m != null) mSum += s.m;
  }
  return { attempts: a, firstTry: a ? c / a : null, hintRate: a ? h / a : null, withHelp: a ? (c + h) / a : null, mastered, tried, avgMastery: tried ? mSum / tried : null };
}

/* ---------- reading pasted codes or Google Form rows ---------- */
function splitCells(line) {
  if (line.includes('\t')) return line.split('\t');
  const out = []; let cur = '', q = false;
  for (const ch of line) { if (ch === '"') q = !q; else if (ch === ',' && !q) { out.push(cur); cur = ''; } else cur += ch; }
  out.push(cur); return out;
}
const isTime = c => (/\d{1,4}[\/-]\d{1,2}[\/-]\d{1,4}/.test(c) && /\d:\d\d/.test(c)) || /^\d{1,2}:\d\d(:\d\d)?\s*(am|pm)?$/i.test(c);
const isPeriod = c => /^(period|per\.?|p|pd\.?)?\s*\d{1,2}(st|nd|rd|th)?(\s*period)?$/i.test(c.trim());
function parseClass(text) {
  const byKey = new Map(); SKIPPED = []; NOCODE = 0;
  text.split(/\r?\n/).forEach((line, i) => {
    if (!line.trim()) return;
    const m = line.match(CODE_RE);
    if (!m) { if (/NL1/.test(line)) SKIPPED.push({ line: i + 1, why: 'The code is cut off or damaged.' }); else NOCODE++; return; }
    let st; try { st = decodeSave(m[0]); } catch (e) { SKIPPED.push({ line: i + 1, why: e.message }); return; }
    const cells = splitCells(line.replace(m[0], '')).map(c => c.replace(/^"|"$/g, '').trim()).filter(Boolean);
    const email = cells.find(c => /@/.test(c));
    const periodCell = cells.find(isPeriod);
    const nameCell = cells.find(c => !isTime(c) && !isPeriod(c) && !/@/.test(c) && /[a-z]/i.test(c));
    const name = nameCell || (email ? email.split('@')[0] : st.trainer);
    const period = periodCell ? periodCell.replace(/\D/g, '') : '';
    const key = (email || name).toLowerCase() + '|' + period;
    const row = { key, name, period, email: email || '', trainer: st.trainer, st, sum: summarize(st), line: i + 1 };
    const prev = byKey.get(key);
    if (!prev || (st.lastPlayed || 0) >= (prev.st.lastPlayed || 0)) byKey.set(key, row);
  });
  CLASS = [...byKey.values()];
}

/* ---------- mistakes ----------
   The game files each recognized mistake under a short key. To show the words, the dashboard generates a few hundred
   problems per skill once and matches their mistake messages to the same keys. */
let MISTAKE_CAT = null;
function mistakeCatalog() {
  if (MISTAKE_CAT) return MISTAKE_CAT;
  MISTAKE_CAT = {};
  for (const sk of SKILLS) for (let i = 0; i < 250; i++) {
    const q = makeQuestion(sk.topic, sk.tier, sk.id);
    const msgs = [...q.mistakes.map(m => m.msg), ...(q.options || []).filter(o => o.msg).map(o => o.msg), ...(q.ineq ? [q.ineq.flip, q.ineq.strict, q.ineq.value] : [])];
    for (const m of msgs) { const k = mistakeKey(m); if (!MISTAKE_CAT[k]) MISTAKE_CAT[k] = { full: mistakeTemplate(m), skill: sk.id }; }
  }
  for (const v of Object.values(MISTAKE_CAT)) { const parts = v.full.split(/(?<=[.!?:])\s+/); v.short = (parts[0].length < 18 && parts[1] ? parts[0] + ' ' + parts[1] : parts[0]).replace(/:$/, '.'); }
  return MISTAKE_CAT;
}
const mistakeText = k => (mistakeCatalog()[k] || { short: 'Another mistake the game spotted', full: '' });
function mistakeStats(list, skillId = null) {
  const out = {};
  for (const s of list) for (const [sid, k] of Object.entries(s.st.skills || {})) {
    if (!k.m || (skillId && sid !== skillId)) continue;
    for (const [mk, n] of Object.entries(k.m)) {
      const e = out[mk] || (out[mk] = { key: mk, skills: {}, who: new Set(), times: 0 });
      e.who.add(s); e.times += n; e.skills[sid] = (e.skills[sid] || 0) + n;
    }
  }
  return Object.values(out).map(e => ({ ...e, students: [...e.who], skill: Object.entries(e.skills).sort((a, b) => b[1] - a[1])[0][0], many: Object.keys(e.skills).length > 1 }))
    .sort((a, b) => b.students.length - a.students.length || b.times - a.times);
}
/* ---------- Challenge Towers ---------- */
const towerLv = st => Object.values(st.tower || {}).reduce((a, r) => a + (r.best || 0), 0);
const towerGuards = st => Object.values(st.tower || {}).reduce((a, r) => a + (r.g || []).length, 0);
const towerBest = (st, z) => (st.tower && st.tower[z] ? st.tower[z].best : 0);
function renderTowers(list) {
  if (!list.length) return '';
  const zs = Object.keys(ZONES), climbers = list.filter(s => towerLv(s.st) > 0);
  const top = [...climbers].sort((a, b) => towerLv(b.st) - towerLv(a.st) || towerGuards(b.st) - towerGuards(a.st)).slice(0, 10);
  const median = a => { const b = [...a].sort((x, y) => x - y); return b.length ? b[Math.floor(b.length / 2)] : 0; };
  const per = zs.map(z => { const floors = list.map(s => towerBest(s.st, z)), best = Math.max(0, ...floors), who = list.find(s => towerBest(s.st, z) === best && best > 0);
    const g = [10, 20, 30, 40, 50].map(f => list.filter(s => s.st.tower && s.st.tower[z] && s.st.tower[z].g.includes(f)).length);
    return `<div class="t-tw"><b>${esc(ZONES[z].name)} Tower</b><span class="small muted">TEKS ${ZONES[z].teks}</span>
      <span>Class best: <b>${best}</b>${who ? ` (${esc(who.st.trainer)})` : ''} · median ${median(floors)}</span>
      <span class="small">Guardians beaten: ${g.map((n, i) => `F${(i + 1) * 10}: ${n}`).join(' · ')}</span></div>`; }).join('');
  const goalZone = TV.twZone && ZONES[TV.twZone] ? TV.twZone : zs[0], goal = +TV.twGoal || 20;
  const behind = sortedStudents(list).filter(s => towerBest(s.st, goalZone) < goal);
  return `<div class="panel"><h3>Challenge Towers</h3><p class="small muted">Each area has a 50-floor tower of STAAR-style questions on its TEKS. Tower Level is a student’s best floors added across all towers (up to ${zs.length * 50}).</p>
    <div class="t-power"><div><h4>Top climbers</h4>${top.length ? `<ol class="t-lb">${top.map((s, i) => `<li><span class="t-rank">${i + 1}</span><b>${esc(s.st.trainer)}</b> <span class="small muted">(${esc(s.name)})</span><span class="t-pw" style="--pc:#7E57E8">🗼 ${towerLv(s.st)}</span></li>`).join('')}</ol>` : '<p class="small muted">No one has climbed yet.</p>'}
      <button class="btn small" data-t="board-publish" style="margin-top:8px">📣 Show leaderboards in the game</button></div>
      <div><h4>Each tower</h4><div class="t-tws">${per}</div></div></div>
    <h4 style="margin-top:14px">Assignment helper</h4><div class="t-filters" style="margin:0">
      <label>Tower <select class="text-in t-sel" data-tc="twZone">${zs.map(z => `<option value="${z}" ${z === goalZone ? 'selected' : ''}>${esc(ZONES[z].name)}</option>`).join('')}</select></label>
      <label>Goal floor <select class="text-in t-sel" data-tc="twGoal">${[10, 20, 30, 40, 50].map(f => `<option value="${f}" ${f === goal ? 'selected' : ''}>${f}</option>`).join('')}</select></label></div>
    <p class="small">${behind.length ? `<b>${behind.length}</b> student${behind.length === 1 ? ' hasn’t' : 's haven’t'} reached floor ${goal} in the ${esc(ZONES[goalZone].name)} Tower yet:` : `Everyone has reached floor ${goal} in the ${esc(ZONES[goalZone].name)} Tower!`}</p>
    ${behind.length ? `<p>${behind.map(s => `${esc(s.name)} <span class="small muted">(${towerBest(s.st, goalZone)})</span>`).join(', ')}</p><button class="btn ghost small" data-t="copy" data-names="${esc(behind.map(s => s.name).join(', '))}">Copy names</button>` : ''}</div>`;
}
// the leaderboards that go into the game: trainer nicknames only
function buildBoard(list) {
  const nick = s => String(s.st.trainer || '').slice(0, 18);
  const tower = list.filter(s => towerLv(s.st) > 0).sort((a, b) => towerLv(b.st) - towerLv(a.st)).slice(0, 10).map(s => [nick(s), towerLv(s.st)]);
  const power = [...list].sort((a, b) => powerScore(b.st) - powerScore(a.st)).slice(0, 10).map(s => [nick(s), powerScore(s.st)]);
  return { d: new Date().toISOString().slice(0, 10), per: TV.period && TV.period !== 'all' ? String(TV.period) : '', t: tower, p: power };
}

/* ---------- Power leaderboard ---------- */
function renderPower(list) {
  if (!list.length) return '';
  const rows = list.map(s => { const p = powerScore(s.st), wk = s.st.pw && s.st.pw.wk === weekKey() ? p - s.st.pw.start : null; return { s, p, gain: wk, rank: powerRank(p) }; });
  const top = [...rows].sort((a, b) => b.p - a.p).slice(0, 10), up = rows.filter(r => r.gain > 0).sort((a, b) => b.gain - a.gain).slice(0, 5);
  const row = (r, i, val) => `<li><span class="t-rank">${i + 1}</span><b>${esc(r.s.st.trainer)}</b> <span class="small muted">(${esc(r.s.name)})</span><span class="t-pw" style="--pc:${r.rank.color}">${val}</span></li>`;
  return `<div class="panel"><h3>Power leaderboard</h3><p class="small muted">Power Score adds up each student’s three strongest Numlings, plus badges, special moves, and bosses beaten. Levels only come from correct answers, so it tracks practice. Trainer nicknames are shown, so this is safe to project.</p>
    <div class="t-power"><div><h4>Top 10</h4><ol class="t-lb">${top.map((r, i) => row(r, i, `⚡ ${r.p} ${r.rank.en}`)).join('')}</ol></div>
    <div><h4>Most improved this week</h4>${up.length ? `<ol class="t-lb">${up.map((r, i) => row(r, i, `+${r.gain}`)).join('')}</ol>` : '<p class="small muted">Shows up once students have played this week and turned in a new code.</p>'}</div></div></div>`;
}
function renderMistakes(list) {
  const top = mistakeStats(list).slice(0, 8);
  if (!top.length) return `<div class="panel"><h3>Most common mistakes</h3><p class="muted">No mistakes recorded yet. As students play, the game notes each mistake it recognizes (like forgetting to flip an inequality sign) and they show up here.</p></div>`;
  return `<div class="panel"><h3>Most common mistakes</h3><p class="small muted">Mistakes the game recognized as students answered, counted across the class. Tap one to see that skill’s small groups, including who made it.</p>
    <div class="t-mistakes">${top.map(m => { const t = mistakeText(m.key); return `<button class="t-mistake" data-t="group" data-s="${m.skill}" title="${esc(t.full)}">
      <b>${esc(t.short)}</b><span class="small">${m.many ? `In several skills, most often ${esc(SKILL[m.skill].label.toLowerCase())}` : `${esc(SKILL[m.skill].label)} (${SKILL[m.skill].teks})`}</span>
      <span class="t-mcount"><b>${m.students.length}</b> student${m.students.length === 1 ? '' : 's'} · ${m.times} time${m.times === 1 ? '' : 's'}</span></button>`; }).join('')}</div></div>`;
}

/* ---------- views ---------- */
const pct = x => (x == null ? '' : Math.round(x * 100) + '%');
const ago = t => { if (!t) return 'Unknown'; const d = Math.floor((Date.now() - t) / 86400000); return d <= 0 ? 'Today' : d === 1 ? 'Yesterday' : `${d} days ago`; };
const shown = () => CLASS.filter(s => TV.period === 'all' || s.period === TV.period);
const shownSkills = () => SKILLS.filter(k => TV.topic === 'all' || k.topic === TV.topic);
function skillClassStats(sk, list) {
  const st = { tried: 0, mastered: 0, practicing: 0, learning: 0, start: 0, notTried: 0, mSum: 0, mN: 0, a: 0, c: 0, h: 0 };
  for (const s of list) {
    const k = s.st.skills[sk.id], ks = kStatus(k);
    if (ks.cls === 'new') { st.notTried++; continue; }
    st.tried++; st[ks.cls]++; st.a += k.a; st.c += k.c; st.h += k.h;
    if (k.r.length >= 3) { st.mSum += ks.m; st.mN++; }
  }
  st.avg = st.mN ? st.mSum / st.mN : null; st.firstTry = st.a ? st.c / st.a : null; st.hint = st.a ? st.h / st.a : null;
  return st;
}
function sortedStudents(list) {
  const by = { name: (a, b) => a.name.localeCompare(b.name), mastery: (a, b) => (a.sum.avgMastery ?? -1) - (b.sum.avgMastery ?? -1),
    activity: (a, b) => b.st.stats.answered - a.st.stats.answered, recent: (a, b) => (a.st.lastPlayed || 0) - (b.st.lastPlayed || 0) }[TV.sort];
  return [...list].sort(by);
}
/* ---------- online mode: the class comes straight from the Google Sheet ---------- */
const T_CLOUD = !!(window.google && google.script && google.script.run);
const TC = { busy: false, at: 0, err: '', backups: [] };
function tCloudLoad() {
  if (!T_CLOUD || TC.busy) return;
  TC.busy = true; TC.err = ''; renderDash();
  google.script.run.withSuccessHandler(rows => {
    TC.busy = false; TC.at = Date.now();
    const day = t => { const d = new Date(t || Date.now()); return `${d.getMonth() + 1}/${d.getDate()}/${d.getFullYear()} ${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}:00`; };
    TC.backups = rows.filter(r => r.backup).map(r => ({ name: r.name, code: r.backup }));
    loadText(rows.map(r => `${day(r.saved)}\t${r.name}\t${r.period}\t${r.code}`).join('\n'));
  }).withFailureHandler(e => { TC.busy = false; TC.err = String((e && e.message) || e); renderDash(); }).getClass();
}
function renderCloudLoad() {
  return `<div class="panel t-load"><h2>Your class (online)</h2>
    <p>Student games save to your Google Sheet automatically. ${TC.at ? `Loaded ${CLASS.length} students at ${new Date(TC.at).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}.` : ''}</p>
    ${TC.err ? `<p class="t-warn">Couldn’t load the class: ${esc(TC.err)}</p>` : ''}
    <div class="btn-row"><button class="btn primary" data-t="cloud-load" ${TC.busy ? 'disabled' : ''}>${TC.busy ? 'Loading…' : '↻ Refresh from the Sheet'}</button></div>
    <p class="small muted">To show real names and periods, add a tab named <b>Roster</b> to the Sheet with columns Email, Name, Period. Otherwise students show by their email name.</p>
    ${TC.backups.length ? `<details><summary>${TC.backups.length} backup game${TC.backups.length === 1 ? '' : 's'} (from students who started over)</summary><p class="small">To restore one, give the student the code. They choose <b>I have a save code</b> on the title screen.</p>
      ${TC.backups.map(b => `<div class="t-backup"><b>${esc(b.name)}</b><button class="btn ghost small" data-t="copy" data-names="${esc(b.code)}">Copy backup code</button></div>`).join('')}</details>` : ''}</div>`;
}
function renderLoad() {
  if (T_CLOUD) return renderCloudLoad();
  return `<div class="panel t-load">
    <h2>Load your class</h2>
    <p>Paste save codes, one per line, or copy rows straight from your Google Form responses sheet (names, periods, and timestamps are fine). If a student turned in more than once, only their newest code is used.</p>
    <textarea id="t-in" class="codebox t-in" placeholder="Paste here. Each line just needs a code that starts with NL1." aria-label="Save codes or Form responses">${esc(TV.input || '')}</textarea>
    <div class="btn-row"><button class="btn primary" data-t="load">Load class</button>
      <label class="btn">Open a CSV file<input type="file" id="t-file" accept=".csv,.tsv,.txt" hidden></label>
      <button class="btn" data-t="sample">Try a sample class</button>
      ${CLASS.length ? '<button class="btn danger" data-t="forget">Forget this class data</button>' : ''}</div>
    <p class="small muted">Everything stays in this browser. Codes are decoded right here and never sent anywhere. The class you load is remembered on this computer until you choose Forget.</p>
    ${SKIPPED.length || NOCODE ? `<p class="small">${CLASS.length} student${CLASS.length === 1 ? '' : 's'} loaded.${NOCODE ? ` ${NOCODE} line${NOCODE === 1 ? '' : 's'} had no code (probably headers).` : ''}${SKIPPED.length ? ` <b>${SKIPPED.length} code${SKIPPED.length === 1 ? ' was' : 's were'} skipped:</b> ${SKIPPED.slice(0, 6).map(s => `line ${s.line} (${s.why})`).join('; ')}${SKIPPED.length > 6 ? '…' : ''}` : ''}</p>` : ''}
  </div>`;
}
function renderOverview(list) {
  const n = list.length, sums = list.map(s => s.sum);
  const avg = f => { const v = sums.map(f).filter(x => x != null); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };
  const answered = list.reduce((a, s) => a + s.st.stats.answered, 0);
  const inactive = list.filter(s => s.st.lastPlayed && Date.now() - s.st.lastPlayed > 7 * 86400000).length;
  return `<div class="card-stats t-cards">
    <div><b>${n}</b>students</div><div><b>${answered.toLocaleString()}</b>problems answered</div>
    <div><b>${pct(avg(s => s.firstTry))}</b>right on the first try</div><div><b>${pct(avg(s => s.hintRate))}</b>of answers used a hint</div>
    <div><b>${avg(s => s.mastered) == null ? 0 : avg(s => s.mastered).toFixed(1)}</b>skills mastered on average</div>
    <div><b>${inactive}</b>haven’t played in 7+ days</div></div>`;
}
function renderReteach(list) {
  const rows = shownSkills().map(sk => ({ sk, st: skillClassStats(sk, list) })).filter(r => r.st.mN >= 2);
  const next = [...rows].sort((a, b) => a.st.avg - b.st.avg).slice(0, 5);
  if (!next.length) return `<div class="panel"><h3>Reteach next</h3><p class="muted">Not enough data yet. Once a few students have tried a skill at least 3 times, the weakest skills show up here.</p></div>`;
  return `<div class="panel"><h3>Reteach next</h3><p class="small muted">The skills your class is weakest on, among students who’ve tried them at least 3 times. Tap one to see its small group.</p>
    <div class="t-reteach">${next.map(({ sk, st }) => `<button class="t-skillcard" data-t="group" data-s="${sk.id}">
      <b>${sk.label}</b><span class="small">TEKS ${sk.teks}, ${ZONE_OF_TOPIC[sk.topic]}</span>
      <span class="t-split"><i class="learning" style="flex:${st.learning}"></i><i class="practicing" style="flex:${st.practicing + st.start}"></i><i class="mastered" style="flex:${st.mastered}"></i></span>
      <span class="small">${st.learning} learning, ${st.practicing + st.start} practicing, ${st.mastered} mastered. Class mastery ${pct(st.avg)}.</span>

}

/* ---------- Game settings: change the game without editing code ----------
   Reads index.html (your live game, or a copy you pick), lets you change a few settings, then downloads an updated
   index.html. Only the one TEACHER_SETTINGS line changes, so saves, reward codes, and everything else stay the same. */
const GS = { html: null, from: '', st: null, open: false, needFile: false };
function gsDefaults(ts) {
  const pick = (path, dflt) => { let v = ts; for (const k of path) v = v && v[k]; return v === undefined ? dflt : v; };
  return { url: pick(['turnIn', 'url'], CONFIG.turnIn.url || ''), zones: { ...CONFIG.zones, ...(pick(['zones'], {})) }, focus: [...pick(['focusSkills'], CONFIG.focusSkills || [])],
    pvp: pick(['pvp', 'enabled'], CONFIG.pvp.enabled), homestead: pick(['homestead', 'enabled'], CONFIG.homestead.enabled), hints: pick(['support', 'hints'], CONFIG.support.hints),
    board: !!ts.board || !!GS.wantBoard };
}
function gsUse(text, from) {
  const m = text.match(/\/\*TS\*\/([\s\S]*?)\/\*TS\*\//);
  if (!m || !/Numlings/.test(text)) { alert('That file doesn’t look like the Numlings game (index.html). Pick the index.html you upload to GitHub.'); return; }
  let ts = {}; try { ts = JSON.parse(m[1]); } catch (e) { ts = {}; }
  // a fresh game file (for example, a new version) has no settings yet: bring back the ones saved on this computer
  let restored = false;
  if (!Object.keys(ts).length) { try { const mine = JSON.parse(localStorage.getItem('numlings-game-settings') || 'null'); if (mine && typeof mine === 'object') { ts = mine; restored = true; } } catch (e) {} }
  GS.html = text; GS.from = from; GS.st = gsDefaults(ts); GS.restored = restored; GS.open = true; GS.needFile = false; GS.done = false; renderDash();
}
async function gsLoadLive() {
  try { const r = await fetch('index.html', { cache: 'no-store' }); if (!r.ok) throw new Error(r.status); gsUse(await r.text(), 'your live game'); }
  catch (e) { GS.needFile = true; GS.open = true; GS.st = null; GS.html = null; renderDash(); }
}
function gsDownload() {
  if (!GS.html || !GS.st) return;
  const s = GS.st, url = s.url.trim();
  if (url && (!/^https:\/\/docs\.google\.com\/forms\//.test(url) || !url.includes('CODE'))) { if (!confirm('The turn-in link should be a Google Forms pre-filled link with the word CODE where the save code goes. Download anyway?')) return; }
  const ts = { turnIn: { url }, zones: s.zones, focusSkills: s.focus, pvp: { enabled: !!s.pvp }, homestead: { enabled: !!s.homestead }, support: { hints: !!s.hints } };
  if (s.board && CLASS.length) ts.board = buildBoard(shown());
  const out = GS.html.replace(/\/\*TS\*\/[\s\S]*?\/\*TS\*\//, () => `/*TS*/${JSON.stringify(ts)}/*TS*/`);
  try { localStorage.setItem('numlings-game-settings', JSON.stringify(ts)); } catch (e) {}
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([out], { type: 'text/html' })); a.download = 'index.html'; document.body.append(a); a.click(); a.remove();
  GS.done = true; renderDash();
}

  if (!GS.open) return `<div class="panel t-gs"><h3>Game settings</h3><p class="small muted">Change the turn-in link, which zones are open, this week’s focus skills, and more, without editing any code. You’ll download an updated <b>index.html</b> and upload it to GitHub the same way you do now.</p>
    <button class="btn primary" data-t="gs-load">Open game settings</button></div>`;
  if (!GS.st) return `<div class="panel t-gs"><h3>Game settings</h3><p>Pick your game file. This is the <b>index.html</b> you upload to GitHub (the dashboard couldn’t read it automatically, which happens when it’s opened from your computer).</p>

    ${GS.restored ? '<div class="t-note" style="margin:0 0 10px">This game file had no settings yet (a new version does this), so your last saved settings are filled in below. Download to put them into the new version.</div>' : ''}
    <h4>1. Turn-in link</h4><p class="small">In your Google Form, make questions for Name, Period, and Save code. Choose <b>⋮ → Get pre-filled link</b>, type <b>CODE</b> in the Save code box, click <b>Get link</b>, copy it, and paste it here. Students then get a <b>Turn in my progress</b> button on their Save page.</p>
    <input class="text-in" data-gs="url" value="${esc(s.url)}" placeholder="https://docs.google.com/forms/d/e/…/viewform?usp=pp_url&entry.123=CODE" style="width:100%">
    <h4>2. Zones that are open</h4><div class="t-checks">${zoneBoxes}</div>
    <h4>3. Focus skills this week</h4><p class="small">The game asks these more often everywhere (training, catching, battles). Leave all unchecked for a normal mix.</p><div class="t-gs-skills">${skillBoxes}</div>
    <h4>5. Class leaderboards in the game</h4>
    <label class="t-check"><input type="checkbox" data-gs="board" ${s.board ? 'checked' : ''} ${CLASS.length ? '' : 'disabled'}> <b>Show the top 10 Tower Levels and Power Scores on the World map</b></label>
    <p class="small muted">${CLASS.length ? `Uses the ${shown().length} student codes loaded now${TV.period && TV.period !== 'all' ? ` (period ${esc(TV.period)} only)` : ''}. Only trainer nicknames appear, never real names. Re-download after new turn-ins to update it.` : 'Load your class’s codes above first.'}</p>
    <h4>4. Features</h4><div class="t-checks col">${tog('pvp', 'Live battles', 'Students battle classmates in the Battle Arena.')}${tog('homestead', 'Homestead', 'Building, gardening, and Numling residents.')}${tog('hints', 'Hints', 'A Hint button on practice problems.')}</div>
    <div class="btn-row" style="margin-top:14px"><button class="btn primary" data-t="gs-download">⬇ Download updated index.html</button><button class="btn ghost" data-t="gs-close">Close</button></div>
    ${GS.done ? `<div class="t-note"><b>Downloaded.</b> Now upload it: in your GitHub repo choose <b>Add file → Upload files</b>, drop in the new <b>index.html</b> (delete older copies from Downloads first so it isn’t renamed “index (1).html”), and click <b>Commit changes</b>. Students see the new settings about 2 minutes later, after refreshing.</div>` : ''}</div>`;
}
function renderDash() {
  const app = document.getElementById('t-app');
  const periods = [...new Set(CLASS.map(s => s.period).filter(Boolean))].sort((a, b) => a - b);
  if (TV.period !== 'all' && !periods.includes(TV.period)) TV.period = 'all';
  const list = shown();
  if (TV.detail) { const s = CLASS.find(x => x.key === TV.detail); if (s) { app.innerHTML = renderDetail(s); window.scrollTo(0, 0); return; } TV.detail = null; }
  app.innerHTML = `${renderLoad()}${renderGameSettings()}
    ${CLASS.length ? `<div class="t-filters">
      ${periods.length ? `<label>Period <select class="text-in t-sel" data-tc="period"><option value="all">All periods</option>${periods.map(p => `<option value="${p}" ${TV.period === p ? 'selected' : ''}>Period ${p}</option>`).join('')}</select></label>` : ''}
      <label>Skills <select class="text-in t-sel" data-tc="topic"><option value="all">All skills</option>${Object.entries(ZONE_OF_TOPIC).map(([t, z]) => `<option value="${t}" ${TV.topic === t ? 'selected' : ''}>${z} skills</option>`).join('')}</select></label>
      <button class="btn" data-t="csv">Download CSV</button><button class="btn" data-t="print">Print</button></div>
      ${renderOverview(list)}${renderReteach(list)}${renderMistakes(list)}${renderPower(list)}${renderTowers(list)}${renderHeatmap(list)}${renderGroups(list)}${renderRewards(list)}` : `${renderRewards([])}<div class="panel"><h3>Setting up turn-ins (one time)</h3><ol class="t-steps">
        <li>Make a Google Form with a short-answer question like “Name” (and “Period” if you teach several), plus one called “Save code.”</li>
        <li>In the Form menu, choose <b>Get pre-filled link</b>, type <b>CODE</b> in the Save code question, and copy the link.</li>
        <li>Paste that link into <code>turnIn: { url: '…' }</code> in <code>config.js</code>. Students now get a <b>Turn in my progress</b> button on the Save page that fills in their code for them.</li>
        <li>When you want data, open the Form’s responses in Google Sheets, select the rows, copy, and paste them above.</li></ol></div>`}`;
}

function loadText(text, remember = true) {
  TV.input = text;
  parseClass(text);
  if (remember) { try { if (CLASS.length) localStorage.setItem(T_KEY, text); } catch (e) {} }
  TV.detail = null; renderDash();
}
function csvExport() {
  const sks = SKILLS, q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const topMistake = s => { const all = []; for (const [sid, k] of Object.entries(s.st.skills || {})) for (const [mk, n] of Object.entries(k.m || {})) all.push([mk, n, sid]); all.sort((a, b) => b[1] - a[1]);
    return all[0] ? `${mistakeText(all[0][0]).short} (${SKILL[all[0][2]].label}, ${all[0][1]}x)` : ''; };
  const head = ['Name', 'Period', 'Email', 'Trainer nickname', 'Last played', 'Problems answered', 'First-try %', 'Hint %', 'Skills mastered', 'Most common mistake', 'Tower Level', ...Object.keys(ZONES).map(z => `${ZONES[z].name} Tower best floor`), 'Tower Guardians beaten', 'Power Score',
    ...sks.flatMap(k => [`${k.label} (${k.teks}) mastery %`, `${k.label} status`])];
  const lines = sortedStudents(shown()).map(s => [s.name, s.period, s.email, s.trainer, s.st.lastPlayed ? new Date(s.st.lastPlayed).toLocaleDateString() : '',
    s.st.stats.answered, s.sum.firstTry == null ? '' : Math.round(s.sum.firstTry * 100), s.sum.hintRate == null ? '' : Math.round(s.sum.hintRate * 100), s.sum.mastered, topMistake(s), towerLv(s.st), ...Object.keys(ZONES).map(z => towerBest(s.st, z)), towerGuards(s.st), powerScore(s.st),
    ...sks.flatMap(k => { const ks = kStatus(s.st.skills[k.id]); return [ks.m == null ? '' : Math.round(ks.m * 100), ks.label]; })].map(q).join(','));
  const blob = new Blob([[head.map(q).join(','), ...lines].join('\r\n')], { type: 'text/csv' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `numlings-class-${new Date().toISOString().slice(0, 10)}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
}
function sampleClass() {
  const names = ['Ana G.', 'Luis M.', 'Sofia R.', 'Diego P.', 'Valeria T.', 'Mateo L.', 'Camila H.', 'Santiago C.', 'Isabella V.', 'Emiliano S.', 'Ximena O.', 'Adrian F.',
    'Renata D.', 'Joaquin B.', 'Mia A.', 'Gael N.', 'Victoria E.', 'Sebastian Q.', 'Natalia K.', 'Daniel J.', 'Regina W.', 'Andres Y.', 'Paula Z.', 'Leo U.'];
  const rows = ['Timestamp\tName\tPeriod\tSave code'];
  names.forEach((nm, i) => {
    const st = freshState(nm.split(' ')[0]); st.creatures.push({ uid: 1, n: 1 + (i % 3), lv: 5 + (i % 9), xp: 0 }); st.party = [1]; st.caught.add(st.creatures[0].n);
    const skill = 0.35 + (i % 7) * 0.09 + Math.random() * 0.1;
    const G0 = G; G = st;
    for (const sk of SKILLS) {
      if (sk.tier === 3 && Math.random() < 0.5 - skill * 0.3) continue;
      const tries = ri(0, 12);
      const p = Math.max(0.05, Math.min(0.97, skill - (sk.tier - 1) * 0.12 + (sk.id === 'percent-change' || sk.id === 'frac-addsub' ? -0.25 : 0)));
      for (let t = 0; t < tries; t++) { const r = Math.random(); const res = r < p ? 'correct' : r < p + 0.15 ? 'assisted' : 'wrong'; recordAnswer(sk.topic, res, sk.id);
        if (res !== 'correct' && Math.random() < 0.7) { const q = makeQuestion(sk.topic, sk.tier, sk.id); const ms = [...q.mistakes.map(m => m.msg), ...(q.options || []).filter(o => o.msg).map(o => o.msg), ...(q.ineq ? [q.ineq.flip, q.ineq.flip, q.ineq.strict] : [])]; if (ms.length) recordMistake(sk.id, ms[Math.floor(Math.random() * Math.min(2, ms.length))]); } }
    }
    G = G0; st.lastPlayed = Date.now() - ri(0, 10) * 86400000;
    // some tower progress, so the Challenge Towers panel has something to show
    for (const z of Object.keys(ZONES)) if (Math.random() < 0.7) { const best = ri(0, 3) ? ri(1, 28) : ri(29, 50); st.tower[z] = { best, g: [10, 20, 30, 40, 50].filter(f => f <= best) }; }
    rows.push(`10/${ri(1, 15)}/2026 ${ri(8, 15)}:${String(ri(0, 59)).padStart(2, '0')}:00\t${nm}\t${i % 3 === 0 ? 2 : i % 3 === 1 ? 4 : 6}\t${encodeSave(st)}`);
  });
  document.getElementById('t-in').value = rows.join('\n');
  loadText(rows.join('\n'), false);
}
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-t]'); if (!b) return;
  const a = b.dataset.t;
  if (a === 'load') loadText(document.getElementById('t-in').value);
  if (a === 'sample') sampleClass();
  if (a === 'forget') { try { localStorage.removeItem(T_KEY); } catch (e2) {} CLASS = []; SKIPPED = []; NOCODE = 0; renderDash(); }
  if (a === 'detail') { TV.detail = b.dataset.k; renderDash(); }
  if (a === 'close') { TV.detail = null; renderDash(); }
  if (a === 'group') { TV.group = b.dataset.s; renderDash(); document.querySelector('.t-groups')?.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
  if (a === 'copy') { try { await navigator.clipboard.writeText(b.dataset.names); b.textContent = 'Copied'; } catch (e2) { b.textContent = 'Select and copy the names'; } }
  if (a === 'csv') csvExport();
  if (a === 'print') window.print();
  if (a === 'make-codes') makeCodes();
  if (a === 'pick-all') { shown().forEach(s => TV.picked.add(s.key)); renderDash(); }
  if (a === 'pick-none') { TV.picked.clear(); renderDash(); }
  if (a === 'copy-codes' && TV.codes) { const r = (CONFIG.rewards || []).find(x => x.id === TV.codes.reward);
    try { await navigator.clipboard.writeText(TV.codes.list.map(c => `${c.name}\t${c.nick}\t${r.en}\t${c.code}`).join('\n')); b.textContent = 'Copied'; } catch (e2) { b.textContent = 'Select the table to copy'; } }
  if (a === 'print-slips' && TV.codes) printSlips();
  if (a === 'gs-load') gsLoadLive();
  if (a === 'cloud-load') tCloudLoad();
  if (a === 'board-publish') { GS.wantBoard = true; if (GS.st) GS.st.board = true; if (!GS.st) gsLoadLive(); else renderDash(); document.querySelector('.t-gs')?.scrollIntoView({ behavior: 'smooth' }); }
  if (a === 'gs-download') gsDownload();
  if (a === 'gs-close') { GS.open = false; GS.done = false; GS.st = null; GS.html = null; renderDash(); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'gs-file' && e.target.files[0]) { const r = new FileReader(); r.onload = () => gsUse(r.result, e.target.files[0].name); r.readAsText(e.target.files[0]); return; }
  const g = e.target.dataset.gs;
  if (g && GS.st) {
    if (g === 'url') GS.st.url = e.target.value;
    else if (g === 'zone') GS.st.zones[e.target.value] = e.target.checked;
    else if (g === 'focus') { const v = e.target.value; GS.st.focus = e.target.checked ? [...new Set([...GS.st.focus, v])] : GS.st.focus.filter(x => x !== v); }
    else GS.st[g] = e.target.checked;
    GS.done = false; return;
  }
  const k = e.target.dataset.tc;
  if (k === 'pick') { e.target.checked ? TV.picked.add(e.target.value) : TV.picked.delete(e.target.value); return; }
  if (k === 'reward') { TV.reward = e.target.value; TV.codes = null; renderDash(); return; }
  if (k) { TV[k] = e.target.value; renderDash(); return; }
  if (e.target.id === 't-file' && e.target.files[0]) { const r = new FileReader(); r.onload = () => { document.getElementById('t-in').value = r.result; loadText(r.result); }; r.readAsText(e.target.files[0]); }
});
(function boot() {
  let saved = null; try { saved = localStorage.getItem(T_KEY); } catch (e) {}
  if (saved) { TV.input = saved; parseClass(saved); }
  renderDash();
  if (saved && document.getElementById('t-in')) document.getElementById('t-in').value = saved;
  if (T_CLOUD) tCloudLoad();
})();

</script>
