  const pack = dir === 'up' ? `<rect x="10.5" y="15.5" width="11" height="9" rx="2.5" fill="#E5533A" stroke="${ink}" stroke-width="1"/>` : side ? `<rect x="7.5" y="16" width="5" height="8" rx="2" fill="#E5533A" stroke="${ink}" stroke-width="1"/>` : '';
  const crownSvg = crown ? `<path d="M10.5 4.6 L12 0.8 L14.2 3.4 L16 0 L17.8 3.4 L20 0.8 L21.5 4.6 Z" fill="#F2B731" stroke="${ink}" stroke-width=".9" stroke-linejoin="round"/>` : '';
  return `<g${flip}>
    <ellipse cx="16" cy="29.5" rx="8" ry="2.2" fill="#000" opacity=".18"/>
    <rect x="12" y="23" width="3.4" height="6" rx="1.2" fill="#2B3A5C"/><rect x="16.6" y="23" width="3.4" height="6" rx="1.2" fill="#2B3A5C"/>
    <rect x="9.5" y="14.5" width="13" height="10.5" rx="4" fill="${shirt}" stroke="${ink}" stroke-width="1.1"/>
    ${pack}
    <circle cx="16" cy="11.5" r="6.3" fill="${skin}" stroke="${ink}" stroke-width="1.1"/>
    <path d="M9.7 10.6 a6.3 6.3 0 0 1 12.6 0 z" fill="${cap}" stroke="${ink}" stroke-width="1.1"/>
    ${brim}${face}${crownSvg}</g>`;
}
// the player is drawn by the character artist (avatar.js) in whatever they're wearing
function trainerSVG(dir) { return playerAvatar(dir, 'trainer avatar'); }

/* ---------- map screen ---------- */
function renderMap() {
  const name = mapName(W.zone), town = W.kind === 'town', tl = trackedLine();
  return `<div class="map-top">
    <div><h2>${name}</h2><p class="small muted">${bi(town ? L('Walk into doors, gates, the Quest Board, and people to interact. People with a <b>!</b> have a quest for you, and <b>?</b> means you can turn one in.', 'Camina hacia puertas, entradas, el Tablero de misiones y personas para interactuar. La gente con un <b>!</b> tiene una misión para ti, y <b>?</b> significa que puedes entregar una.')
      : L('Arrow keys or WASD to move, or tap a spot to walk there. Tall grass hides Numlings, and sparkles hide rare ones.', 'Usa las flechas o WASD para moverte, o toca un lugar para caminar hasta ahí. La hierba alta esconde Numlings, y los destellos esconden a los raros.'))}</p></div>
    ${town ? `<button class="btn" data-act="world-map">${t('worldMap')}</button>` : `<button class="btn" data-act="leave-zone">${t('backToTown')}</button>`}</div>
  <div class="hud">
    <div class="hud-box"><span class="small">${tx(UI.youreAt)}</span><b id="hud-pos"></b></div>
    <div class="hud-box quest"><span class="small">${tx(UI.cacheAt)}</span><b id="hud-quest"></b></div>
    ${town ? '' : `<div class="hud-box"><span class="small">${tx(UI.sparkles)}</span><b id="hud-spark"></b></div>`}
    ${tl ? `<button class="hud-box hud-track" data-act="nav" data-to="quests"><span class="small">${tx(UI.quest)}</span><b id="hud-track">${esc(tl)}</b></button>` : ''}
  </div>
  <div class="viewport mt-${W.zone}" id="vp" tabindex="0" aria-label="${name} map. Use the arrow keys to move.">
    <div class="layer" id="layer">${mapSVG()}<div id="fx"></div><div id="amb" aria-hidden="true">${ambientHTML(W.zone)}</div>
      <div class="actor follower" id="follower"></div><div class="actor player" id="player"></div></div>
    <div class="say" id="say" hidden role="status"><p id="say-text"></p><div class="say-btns" id="say-btns"></div></div>
    <div class="dpad" aria-label="Move">
      <button data-dir="up" aria-label="Up">▲</button><button data-dir="left" aria-label="Left">◀</button>
      <button data-dir="right" aria-label="Right">▶</button><button data-dir="down" aria-label="Down">▼</button></div>
    <div class="flash" aria-hidden="true"></div>
  </div>`;
}
function setupMap() {
  const vp = $('#vp'); if (!vp || !W) return;
  const t = Math.max(32, Math.min(54, Math.floor(vp.clientWidth / 12)));
  W.t = t;
  const layer = $('#layer');
  layer.style.width = W.w * t + 'px'; layer.style.height = W.h * t + 'px';
  vp.style.setProperty('--t', t + 'px');
  const top = vp.getBoundingClientRect().top + window.scrollY;
  const avail = window.innerHeight - (top - window.scrollY) - 96;
  vp.style.height = Math.max(300, Math.min(avail, W.h * t)) + 'px';
  vp.classList.add('no-anim');
  $('#player').innerHTML = trainerSVG(W.dir);
  const ld = lead(); $('#follower').innerHTML = ld ? artC(ld, { label: false, flip: W.fdir > 0 }) : '';
  placeActors(); drawFx(); updateHUD();
  requestAnimationFrame(() => requestAnimationFrame(() => vp.classList.remove('no-anim')));
}
function placeActors() {
  const t = W.t, vp = $('#vp'); if (!vp) return;
  const p = $('#player'), f = $('#follower');
  p.style.transform = `translate(${W.x * t}px, ${W.y * t - t * 0.18}px)`;
  f.style.transform = `translate(${W.fx * t + t * 0.08}px, ${W.fy * t - t * 0.02}px)`;
  p.classList.toggle('in-grass', T(W.x, W.y) === '"');
  f.classList.toggle('in-grass', T(W.fx, W.fy) === '"');
  const vw = vp.clientWidth, vh = vp.clientHeight;
  const cx = Math.max(0, Math.min(W.w * t - vw, W.x * t + t / 2 - vw / 2));
  const cy = Math.max(0, Math.min(W.h * t - vh, W.y * t + t / 2 - vh / 2));
  $('#layer').style.transform = `translate(${-cx}px, ${-cy}px)`;
}
function drawFx() {
  const fx = $('#fx'); if (!fx) return;
  const t = W.t;
  const objs = questObjects().map(o => `<span class="qobj${o.lit ? ' lit' : ''}" style="left:${o.x * t}px;top:${o.y * t - t * 0.25}px;width:${t}px;height:${t * 1.25}px">${questObjSVG(o)}</span>`).join('');
  fx.innerHTML = [...W.sparkles].map(k => { const [x, y] = k.split(',').map(Number);
    return `<span class="sparkle" style="left:${x * t}px;top:${y * t}px"><i></i><i></i><i></i></span>`; }).join('') + objs;
}
function updateHUD() {
  const p = $('#hud-pos'), q = $('#hud-quest'), sk = $('#hud-spark');
  const avail = sparklesAvailable(W.zone);
  if (W.sparkles.size < avail) { placeSparkles(avail); drawFx(); }  // a sparkle came back while you were exploring
  if (sk) sk.textContent = tx(W.sparkles.size ? L(`${W.sparkles.size} on this map`, `${W.sparkles.size} en este mapa`) : L(`Next in ${nextSparkleMinutes(W.zone)} min`, `Otro en ${nextSparkleMinutes(W.zone)} min`));
  const tk = $('#hud-track'); if (tk) { const tl = trackedLine(); if (tl) tk.textContent = tl; }
  if (p) p.textContent = fmtPt(W.x, W.y);
  if (q) q.textContent = W.quest ? fmtPt(W.quest.x, W.quest.y) : tx(UI.noneRightNow);
}
let sayActions = [];
function say(text, actions = null) {
  const box = $('#say'); if (!box) return;
  $('#say-text').innerHTML = bi(isPair(text) ? L(esc(text.en), esc(text.es)) : esc(text));
  sayActions = actions || [{ label: UI.ok, fn: hideSay }];
  const lab = v => (isPair(v) ? (LANG === 'both' && v.en !== v.es ? `${v.en} / ${v.es}` : tx(v)) : v);
  $('#say-btns').innerHTML = sayActions.map((a, i) => `<button class="btn ${a.primary ? 'primary' : ''}" data-say="${i}">${lab(a.label)}</button>`).join('');
  box.hidden = false;
}
const hideSay = () => { const b = $('#say'); if (b) b.hidden = true; };
function burst(x, y, cls) {
  const fx = $('#fx'); if (!fx) return;
  const el = document.createElement('span'); el.className = cls;
  el.style.left = x * W.t + 'px'; el.style.top = y * W.t + 'px';
  fx.appendChild(el); setTimeout(() => el.remove(), 700);
}

/* ---------- movement ---------- */
const held = [];
function setDir(dir) {
  if (W.dir === dir) return;
  W.dir = dir; const p = $('#player'); if (p) p.innerHTML = trainerSVG(dir);
}
function tryStep(dx, dy) {
  if (!W || W.moving || W.busy) return false;
  setDir(dx < 0 ? 'left' : dx > 0 ? 'right' : dy < 0 ? 'up' : 'down');
  const nx = W.x + dx, ny = W.y + dy, ch = T(nx, ny);
  if (ch === 'S') { W.path = null; readSign(nx, ny); return false; }
  if (ch === 'C') { W.path = null; openChest(nx, ny); return false; }
  if (ch === 'N' || ch === 'K') { W.path = null; talkTrainer(nx, ny); return false; }
  if (ch === 'V') { W.path = null; npcTalk(npcAtXY(nx, ny)); return false; }
  if (ch === 'D') { W.path = null; useDoor(nx, ny); return false; }
  if (ch === 'G') { W.path = null; useGate(nx, ny); return false; }
  if (ch === 'Q') { W.path = null; openBoard(); return false; }
  if (ch === 'M') { W.path = null; go('explore'); return false; }
  const qo = questObjAt(nx, ny);
  if (qo) { W.path = null; useQuestObject(qo); return false; }
  if (!isWalk(nx, ny)) { W.path = null; const p = $('#player'); p.classList.remove('bonk'); void p.offsetWidth; p.classList.add('bonk'); return false; }
  hideSay();
  if (W.x !== W.fx) { W.fdir = W.x > W.fx ? 1 : -1; const ld = lead(); if (ld) $('#follower').innerHTML = artC(ld, { label: false, flip: W.fdir > 0 }); }
  W.fx = W.x; W.fy = W.y; W.x = nx; W.y = ny; W.moving = true;
  { const pl = $('#player'); if (pl) { pl.classList.add('walking'); clearTimeout(W.walkT); W.walkT = setTimeout(() => { if (W && !W.moving) pl.classList.remove('walking'); }, STEP_MS + 90); } }
  placeActors(); updateHUD();
  setTimeout(() => { if (!W) return; W.moving = false; land(); }, STEP_MS);
  return true;
}
function land() {
  if (screen !== 'map' || !W) return;
  const ch = T(W.x, W.y), key = W.x + ',' + W.y;
  W.cool--;
  if (ch === 'E') { leaveZone(); return; }
  if (W.quest && W.x === W.quest.x && W.y === W.quest.y) { digCache(); return; }
  if (W.sparkles.has(key)) {
    W.sparkles.delete(key); (G.sparkleUsed[W.zone] = G.sparkleUsed[W.zone] || []).push(Date.now()); save();
    drawFx(); updateHUD(); startEncounter(true); return;
  }
  if (ch === '"') {
    burst(W.x, W.y, 'rustle');
    if (W.cool <= 0 && Math.random() < CONFIG.encounters.grassRate) { startEncounter(false); return; }
  }
  pump();
}
function pump() {
  if (!W || W.moving || W.busy || screen !== 'map') return;
  const d = held[held.length - 1];
  if (d) { const [dx, dy] = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] }[d]; tryStep(dx, dy); return; }
  if (W.path && W.path.length) {
    const [nx, ny] = W.path.shift();
    if (!tryStep(nx - W.x, ny - W.y)) W.path = null;
  }
}
function findPath(tx, ty) {
  const target = T(tx, ty); if (target === undefined) return null;
  const interact = 'SCNKVDGQM'.includes(target) || !!questObjAt(tx, ty);
  const objs = new Set(questObjects().map(o => o.y * W.w + o.x));
  if (!interact && !isWalk(tx, ty)) return null;
  const k = (x, y) => y * W.w + x, prev = new Map([[k(W.x, W.y), null]]), q = [[W.x, W.y]];
  while (q.length) {
    const [x, y] = q.shift(); if (x === tx && y === ty) break;
    for (const [dx, dy] of DIRS) {
      const nx = x + dx, ny = y + dy, kk = k(nx, ny), isT = nx === tx && ny === ty;
      if (prev.has(kk)) continue;
      if (!((isWalk(nx, ny) && !objs.has(kk)) || (isT && interact))) continue;
      if (T(nx, ny) === 'E' && !isT) continue;
      prev.set(kk, [x, y]); q.push([nx, ny]);
    }
  }
  if (!prev.has(k(tx, ty))) return null;
  const path = []; let cur = [tx, ty];
  while (cur && !(cur[0] === W.x && cur[1] === W.y)) { path.unshift(cur); cur = prev.get(k(cur[0], cur[1])); }
  return path;
}

/* ---------- things on the map ---------- */
function readSign(x, y) {
  const signs = tilesWhere(ch => ch === 'S'), i = signs.findIndex(([a, b]) => a === x && b === y);
  const info = MAP_INFO[W.zone];
  say(info.signs[i] ? L(info.signs[i], (info.signsEs || [])[i] || info.signs[i]) : L('The writing has worn away.', 'Las letras se borraron con el tiempo.'));
}
async function openChest(x, y) {
  const key = x + ',' + y;
  if (W.opened.has(key)) { say(L('This chest is empty. More chests fill up the next time you visit.', 'Este cofre está vacío. Los cofres se vuelven a llenar la próxima vez que vengas.')); return; }
  W.busy = true; held.length = 0;
  const ld = lead(), xp = 12 + ld.lv * 2;
  const res = await askQuestion({ topic: ZONES[W.zone].topic, tier: adaptiveTier(ZONES[W.zone].topic), theme: W.zone, autoMs: 1300, allowSkip: true,
    title: { en: 'Locked chest', es: 'Cofre cerrado' }, sub: { en: `Solve the lock to open it. ${SP[ld.n].name} earns ${xp} XP if you get it.`, es: `Resuelve el candado para abrirlo. ${SP[ld.n].name} gana ${xp} XP si lo logras.` },
    onResult: ok => { if (!ok) return { en: ' The lock stayed shut, but you can try again.', es: ' El candado sigue cerrado, pero puedes intentarlo otra vez.' }; const ups = addXp(ld, xp);
      return { en: ` The chest pops open! ${SP[ld.n].name} earned ${xp} XP.${ups.length ? ` It reached level ${ld.lv}!` : ''}${evoReady(ld, ups)}`,
               es: ` ¡El cofre se abre! ${SP[ld.n].name} ganó ${xp} XP.${ups.length ? ` ¡Llegó al nivel ${ld.lv}!` : ''}${evoReadyEs(ld, ups)}` }; } });
  W.busy = false;
  if (solved(res)) { questEvent('chest', { zone: W.zone }); W.opened.add(key); const g = $(`#ch-${x}-${y}`); if (g) g.classList.add('open'); burst(x, y, 'glint'); save(); }
}
function digCache() {
  const ld = lead(), xp = 10 + ld.lv * 2, spot = fmtPt(W.x, W.y);
  const ups = addXp(ld, xp); W.cachesFound++; save(); questEvent('cache', { zone: W.zone });
  burst(W.x, W.y, 'glint');
  say(L(`You found the math cache at ${spot}! ${SP[ld.n].name} earned ${xp} XP.${ups.length ? ` It reached level ${ld.lv}!` : ''}${evoReady(ld, ups)} A new cache is buried somewhere else.`,
        `¡Encontraste el tesoro matemático en ${spot}! ${SP[ld.n].name} ganó ${xp} XP.${ups.length ? ` ¡Llegó al nivel ${ld.lv}!` : ''}${evoReadyEs(ld, ups)} Hay un nuevo tesoro enterrado en otro lugar.`));
  newQuest(); updateHUD();
}
function talkTrainer(x, y) {
  const tr = trainerAtXY(x, y); if (!tr) return;
  const zname = ZONES[W.zone].name;
  if (tr.champion) {
    const left = TRAINERS[W.zone].filter(t => !G.trainerWins.has(t.id)).length;
    if (left) { say(L(`${tr.name}: Beat every trainer in ${zname} first, then come find me. ${left} to go!`, `${tr.nameEs || tr.name}: Primero vence a todos los entrenadores de ${zname} y luego búscame. ¡Te faltan ${left}!`)); return; }
  }
  const team = trainerTeam(tr), top = Math.max(...team.map(f => f.lv));
  const beaten = G.trainerWins.has(tr.id), line = trL(tr, beaten ? 'again' : 'hi');
  say(L(`${tr.name}: ${line.en} (Team of ${team.length}, up to level ${top})`, `${tr.nameEs || tr.name}: ${line.es} (Equipo de ${team.length}, hasta el nivel ${top})`), [
    { label: UI.battleBang, primary: true, fn: () => startTrainerBattle(tr) },
    { label: UI.notNow, fn: hideSay },
  ]);
}
function startTrainerBattle(tr) {
  hideSay(); W.busy = true; W.path = null; held.length = 0;
  const vp = $('#vp'); vp.classList.add('flashing');
  setTimeout(() => { W.busy = false; startBattle({ zone: W.zone, foes: trainerTeam(tr), trainer: tr }); }, 750);
}
function startEncounter(rare) {
  W.busy = true; W.path = null; held.length = 0;
  const vp = $('#vp'); vp.classList.add('flashing');
  setTimeout(() => {
    const wild = rare ? rollWild(W.zone, 3, CONFIG.encounters.sparkles.weights) : rollWild(W.zone, 1);
    wild.spot = coordOf(W.x, W.y);
    wild.battleLv = scaledLevel(wild.lv, CONFIG.scaling.wild[W.zone], ri(-1, 1) + (SP[wild.n].r >= 4 ? 1 : 0));
    G.seen.add(wild.n); save();
    W.busy = false; W.cool = 4;
    go('encounter', { zone: W.zone, wild, rare, fresh: true });
  }, 750);
}
function leaveZone() {
  const from = W.zone, name = mapName(from);
  held.length = 0; enterTown({ from }); toast(`You left ${name}. Back in Origin Town.`);
}

/* ---------- input ---------- */
const KEYDIR = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', w: 'up', s: 'down', a: 'left', d: 'right', W: 'up', S: 'down', A: 'left', D: 'right' };
document.addEventListener('keydown', e => {
  if (screen !== 'map' || !W || $('#modal-root').children.length) return;
  if (e.target.matches && e.target.matches('input, textarea, select')) return;
  const d = KEYDIR[e.key];
  if (!d) { if ((e.key === 'Enter' || e.key === ' ') && !$('#say').hidden && !e.target.closest('#say')) { e.preventDefault(); (sayActions.find(a => a.primary) || sayActions[0] || { fn: hideSay }).fn(); } return; }
  e.preventDefault(); W.path = null;
  if (!held.includes(d)) held.push(d);
  pump();
});
document.addEventListener('keyup', e => { const d = KEYDIR[e.key]; if (d) { const i = held.indexOf(d); if (i >= 0) held.splice(i, 1); } });
window.addEventListener('blur', () => (held.length = 0));
document.addEventListener('pointerdown', e => {
  const b = e.target.closest('.dpad [data-dir]'); if (!b || screen !== 'map' || !W) return;
  e.preventDefault(); W.path = null; hideSay();
  const d = b.dataset.dir; if (!held.includes(d)) held.push(d);
  b.setPointerCapture?.(e.pointerId);
  pump();
});
const releasePad = e => { const b = e.target.closest && e.target.closest('.dpad [data-dir]'); if (b) { const i = held.indexOf(b.dataset.dir); if (i >= 0) held.splice(i, 1); } };
document.addEventListener('pointerup', releasePad);
document.addEventListener('pointercancel', releasePad);
document.addEventListener('click', e => {
  if (screen !== 'map' || !W) return;
  const sb = e.target.closest('[data-say]');
  if (sb) { const a = sayActions[+sb.dataset.say]; if (a) a.fn(); return; }
  const vp = e.target.closest('#vp');
  if (!vp || e.target.closest('.dpad, .say')) return;
  const r = $('#layer').getBoundingClientRect();
  const tx = Math.floor((e.clientX - r.left) / W.t), ty = Math.floor((e.clientY - r.top) / W.t);
  if (W.busy) return;
  const path = findPath(tx, ty);
  if (!path || !path.length) { burst(tx, ty, 'nope'); return; }
  burst(tx, ty, 'target');
  held.length = 0; W.path = path; hideSay(); pump();
});
window.addEventListener('resize', () => { if (screen === 'map' && W) setupMap(); });

</script>
<script>/* ===== quests.js ===== */
/* Numlings: the quest engine (progress, events, rewards, townspeople, Quest Board, daily jobs, Quests screen) */
'use strict';
const Q_BY_ID = {}; QUESTS.forEach(q => (Q_BY_ID[q.id] = q));
const qState = id => G.quests[id];
const isDone = id => qState(id) && qState(id).st === 'done';
function questAvailable(q) {
  return !qState(q.id) && (q.requires || []).every(isDone);
}
const questsFrom = npc => QUESTS.filter(q => q.giver === npc);
// bilingual text helpers for quest data
const qTitle = q => L(q.title, q.titleEs || q.title);
const stepL = st => L(st.text, st.textEs || st.text);
const npcL = id => (id === 'board' ? L('the Quest Board', 'el Tablero de misiones') : L(NPCS[id].name, NPCS[id].nameEs || NPCS[id].name));
function npcMarker(npc) {
  const mine = questsFrom(npc);
  if (mine.some(q => qState(q.id) && qState(q.id).st === 'ready')) return '?';
  if (mine.some(questAvailable)) return '!';
  return '';
}

/* ---------- daily Board Job ---------- */
function todayKey() { const d = new Date(); return `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`; }
function dailyQuest() {
  const day = todayKey();
  if (!G.daily || G.daily.day !== day) G.daily = { day, st: 'offered', p: 0 };
  let h = 0; for (const ch of day + G.trainer) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  const step = DAILY_POOL[h % DAILY_POOL.length];
  return { id: 'daily', title: 'Board Job', titleEs: 'Trabajo del tablero', giver: 'board', steps: [step], daily: true, rewards: { xp: 40 + 6 * teamLevel() } };
}

/* ---------- progress ---------- */
const DUNGEON_ORDER = ['easy', 'hard', 'chaos'];
function stepNeed(step) { return step.type === 'objects' ? QUEST_OBJECTS[step.set].spots.length : step.type === 'level' ? step.lv : step.type === 'dungeon' ? 1 : step.count || 1; }
function stepHave(step, qs) {
  switch (step.type) {
    case 'species': return G.caught.size;
    case 'master': return SKILLS.filter(k => skillStatus(k.id).cls === 'mastered').length;
    case 'level': return Math.max(0, ...G.creatures.map(c => c.lv));
    case 'dungeon': return DUNGEON_ORDER.slice(DUNGEON_ORDER.indexOf(step.diff)).some(d => G.dungeon[d].clears > 0) ? 1 : 0;
    case 'objects': return (qs.o || []).length;
    default: return qs.p || 0;
  }
}
function questProgress(q, qs = q.daily ? G.daily : qState(q.id)) {
  if (!qs) return null;
  if (qs.st === 'ready' || qs.st === 'done') { const g = npcL(q.giver); return { done: true, text: qs.st === 'ready' ? L(`Return to ${g.en}`, `Regresa con ${g.es}`.replace('con el Tablero', 'al Tablero')) : L('Complete', 'Completada') }; }
  const step = q.steps[qs.s || 0];
  return { step, have: Math.min(stepHave(step, qs), stepNeed(step)), need: stepNeed(step), text: stepL(step) };
}
function matches(step, type, d) {
  if (step.type !== type) return false;
  if (step.zone && step.zone !== d.zone) return false;
  if (type === 'catch') return (!step.element || SP[d.n].type === step.element) && (!step.n || step.n === d.n);
  if (type === 'battle') {
    if (step.champion && !d.champion) return false;
    if (step.trainer === 'any' && !d.trainer) return false;
    if (step.trainer && step.trainer !== 'any' && step.trainer !== d.trainer) return false;
    return true;
  }
  if (type === 'solve') return d.ok && (!step.topic || step.topic === d.topic) && (!step.skill || step.skill === d.skill) && (!step.firstTry || d.result === 'correct');
  if (type === 'talk') return step.npc === d.npc;
  if (type === 'visit') return step.map === d.map;
  return true;
}
function activeQuests() {
  const list = QUESTS.filter(q => qState(q.id) && qState(q.id).st === 'active').map(q => [q, qState(q.id)]);
  if (G.daily && G.daily.day === todayKey() && G.daily.st === 'active') list.push([dailyQuest(), G.daily]);
  return list;
}
function questEvent(type, d = {}) {
  if (!G || !G.quests) return;
  for (const [q, qs] of activeQuests()) {
    const step = q.steps[qs.s || 0];
    if (step && matches(step, type, d)) qs.p = (qs.p || 0) + 1;
  }
  questRefresh();
}
// Moves quests forward when their current step is complete. Quiet when nothing changed.
function questRefresh() {
  if (!G || !G.quests) return;
  for (const [q, qs] of activeQuests()) {
    let moved = false;
    while (qs.st === 'active' && q.steps[qs.s || 0] && stepHave(q.steps[qs.s || 0], qs) >= stepNeed(q.steps[qs.s || 0])) {
      qs.s = (qs.s || 0) + 1; qs.p = 0; moved = true;
      if (qs.s >= q.steps.length) qs.st = 'ready';
    }
    if (!moved) continue;
    if (q.daily && qs.st === 'ready') { completeQuest(q, true); continue; }
    const T = qTitle(q), g = npcL(q.giver), nx = q.steps[qs.s] ? stepL(q.steps[qs.s]) : null;
    if (typeof toast === 'function') toast(tx(qs.st === 'ready' ? L(`Quest ready: ${T.en}. Return to ${g.en}.`, `Misión lista: ${T.es}. Regresa con ${g.es}.`) : L(`Quest updated: ${T.en}. Next: ${nx.en}.`, `Misión actualizada: ${T.es}. Siguiente: ${nx.es}.`)), 3600);
    if (screen === 'map' && typeof refreshMapQuests === 'function') refreshMapQuests();
  }
}

/* ---------- accepting and finishing ---------- */
function acceptQuest(id) {
  if (id === 'daily') { dailyQuest(); G.daily.st = 'active'; G.daily.s = 0; G.daily.p = 0; }
  else G.quests[id] = { st: 'active', s: 0, p: 0, o: [] };
  if (!G.tracked || !qState(G.tracked) || qState(G.tracked).st === 'done') G.tracked = id;
  questRefresh(); save();
}
// Spanish titles students can earn (the English title is what's saved)
const TITLE_ES = { 'Rookie Trainer': 'Entrenador novato', 'Field Researcher': 'Investigador de campo', 'Beacon Keeper': 'Guardián de faros', 'Isles Champion': 'Campeón de las Islas',
  'Bridge Builder': 'Constructor de puentes', 'Rapids Champion': 'Campeón de los Rápidos', 'Fact Fighter': 'Luchador de datos', 'Scholar': 'Erudito', 'Evolution Expert': 'Experto en evolución',
  'Equation Explorer': 'Explorador de ecuaciones', 'Bluffs Champion': 'Campeón de los Riscos', 'Balance Master': 'Maestro del equilibrio' };
const titleL = ti => L(ti, TITLE_ES[ti] || ti);
function rewardText(r) {
  const en = [], es = [];
  if (r.xp) { en.push(`+${r.xp} XP`); es.push(`+${r.xp} XP`); }
  if (r.title) { en.push(`the title “${r.title}”`); es.push(`el título “${titleL(r.title).es}”`); }
  if (r.cap) { en.push('a new cap color'); es.push('un nuevo color de gorra'); }
  if (r.gift) { en.push(`a ${SP[r.gift.n].name}`); es.push(`un ${SP[r.gift.n].name}`); }
  return tx(L(en.join(', '), es.join(', ')));
}
function completeQuest(q, auto = false) {
  const qs = q.daily ? G.daily : qState(q.id), r = q.rewards || {};
  qs.st = 'done';
  const notes = [];
  const ld = lead();
  if (r.xp && ld) { const ups = addXp(ld, r.xp); notes.push(L(`${SP[ld.n].name} earned ${r.xp} XP.${ups.length ? ` It reached level ${ld.lv}!` : ''}${evoReady(ld, ups)}`, `${SP[ld.n].name} ganó ${r.xp} XP.${ups.length ? ` ¡Llegó al nivel ${ld.lv}!` : ''}${evoReadyEs(ld, ups)}`)); }
  if (r.title) { G.titles.add(r.title); if (!G.title) G.title = r.title; notes.push(L(`New title: “${r.title}.” Choose it in Quests.`, `Nuevo título: “${titleL(r.title).es}.” Escógelo en Misiones.`)); }
  if (r.cap) { G.caps.add(r.cap); notes.push(L('New cap unlocked! Wear it from your Wardrobe at Home.', '¡Nueva gorra! Póntela desde tu Ropero en Casa.')); }
  if (r.gift) { addToCollection(r.gift.n, r.gift.lv); notes.push(L(`${SP[r.gift.n].name} joined you!`, `¡${SP[r.gift.n].name} se unió a ti!`)); }
  if (G.tracked === q.id) { const next = activeQuests()[0]; G.tracked = next ? next[0].id : null; }
  save();
  const all = L(notes.map(n => n.en).join(' '), notes.map(n => n.es).join(' '));
  if (auto) toast(tx(L(`Board Job done! ${all.en}`, `¡Trabajo del tablero terminado! ${all.es}`)), 4500);
  return all;
}

/* ---------- townspeople ---------- */
function npcTalk(id) {
  const npc = NPCS[id], nm = npcL(id);
  questEvent('talk', { npc: id });
  const ready = questsFrom(id).find(q => qState(q.id) && qState(q.id).st === 'ready');
  if (ready) {
    const notes = completeQuest(ready);
    refreshMapQuests();
    say(L(`${nm.en}: ${ready.finish} ${notes.en}`, `${nm.es}: ${ready.finishEs || ready.finish} ${notes.es}`));
    return;
  }
  const offer = questsFrom(id).find(questAvailable);
  if (offer) {
    const rw = offer.rewards;
    say(L(`${nm.en}: ${offer.offer} (Reward: ${rewardIn('en', rw)})`, `${nm.es}: ${offer.offerEs || offer.offer} (Premio: ${rewardIn('es', rw)})`), [
      { label: UI.accept, primary: true, fn: () => { acceptQuest(offer.id); refreshMapQuests(); const T = qTitle(offer), p = questProgress(offer).text;
        say(L(`${nm.en}: Great! I’ve added “${T.en}” to your Quests. ${p.en}.`, `${nm.es}: ¡Genial! Agregué “${T.es}” a tus Misiones. ${p.es}.`)); } },
      { label: UI.notNow, fn: hideSay },
    ]);
    return;
  }
  const active = questsFrom(id).find(q => qState(q.id) && qState(q.id).st === 'active');
  if (active) { const p = questProgress(active), T = qTitle(active), n = p.need > 1 ? ` (${p.have}/${p.need})` : '';
    say(L(`${nm.en}: How’s “${T.en}” going? ${p.text.en}${n}.`, `${nm.es}: ¿Cómo va “${T.es}”? ${p.text.es}${n}.`)); return; }
  say(L(`${nm.en}: ${npc.idle}`, `${nm.es}: ${npc.idleEs || npc.idle}`));
}
function rewardIn(lang, r) { const keep = LANG; LANG = lang; const out = rewardText(r); LANG = keep; return out; }
function openBoard() {
  questEvent('board');
  const dq = dailyQuest(), dp = questProgress(dq, G.daily.st === 'offered' ? null : G.daily), job = stepL(dq.steps[0]);
  const avail = QUESTS.filter(questAvailable);
  const T = (en, es) => bi(L(en, es));
  const ov = openModal(`<h2>${T('Quest Board', 'Tablero de misiones')}</h2>
    <div class="board-job"><b>${T('Today’s Board Job', 'Trabajo del tablero de hoy')}</b><p>${T(`${job.en}. Reward: +${dq.rewards.xp} XP. A new job is posted every day.`, `${job.es}. Premio: +${dq.rewards.xp} XP. Cada día hay un trabajo nuevo.`)}</p>
      ${G.daily.st === 'offered' ? `<button class="btn primary" data-b="daily">${tx(L('Take the job', 'Aceptar el trabajo'))}</button>` : G.daily.st === 'done' ? `<p class="small"><b>${T('Done for today.', 'Listo por hoy.')}</b> ${T('Come back tomorrow for a new job.', 'Regresa mañana por un trabajo nuevo.')}</p>` : `<p class="small">${T(`In progress: ${dp.have} of ${dp.need}.`, `En progreso: ${dp.have} de ${dp.need}.`)}</p>`}</div>
    <h3 style="margin-top:14px">${T('Townspeople who need help', 'Gente del pueblo que necesita ayuda')}</h3>
    ${avail.length ? `<ul class="board-list">${avail.map(q => { const qt = qTitle(q), g = npcL(q.giver); return `<li><b>${bi(qt)}</b><span class="small">${T(`Talk to ${g.en}. Reward: ${rewardIn('en', q.rewards)}.`, `Habla con ${g.es}. Premio: ${rewardIn('es', q.rewards)}.`)}</span></li>`; }).join('')}</ul>`
      : `<p class="small muted">${T('Nobody right now. Finish your current quests to unlock more.', 'Nadie por ahora. Termina tus misiones actuales para desbloquear más.')}</p>`}
    <div class="btn-row"><button class="btn" data-b="log">${tx(L('Open my quests', 'Ver mis misiones'))}</button><button class="btn ghost" data-b="close">${tx(L('Close', 'Cerrar'))}</button></div>`);
  ov.addEventListener('click', e => {
    const b = e.target.closest('[data-b]'); if (!b) return;
    if (b.dataset.b === 'daily') { acceptQuest('daily'); closeModal(ov); toast(tx(L(`Board Job taken: ${job.en}.`, `Trabajo aceptado: ${job.es}.`))); refreshMapQuests(); return; }
    closeModal(ov);
    if (b.dataset.b === 'log') go('quests');
  });
}

/* ---------- the Quests screen ---------- */
function questCard(q, qs) {
  const p = questProgress(q, qs), T = (en, es) => bi(L(en, es)), g = npcL(q.giver);
  const steps = q.steps.map((st, i) => `<li class="${i < (qs.s || 0) || qs.st !== 'active' ? 'ok' : i === (qs.s || 0) ? 'now' : ''}">${bi(stepL(st))}${i === (qs.s || 0) && qs.st === 'active' && p.need > 1 ? ` (${p.have}/${p.need})` : ''}</li>`).join('');
  return `<div class="quest-card ${qs.st} ${G.tracked === q.id ? 'tracked' : ''}">
    <div class="quest-top"><b>${bi(qTitle(q))}</b>${qs.st === 'ready' ? `<span class="chip" style="--c:var(--good)">${tx(L('Ready to turn in', 'Lista para entregar'))}</span>` : ''}${G.tracked === q.id ? `<span class="chip" style="--c:var(--tide)">${tx(L('Tracking', 'Siguiendo'))}</span>` : ''}</div>
    <ol class="quest-steps">${steps}${qs.st !== 'done' && !q.daily ? `<li class="${qs.st === 'ready' ? 'now' : ''}">${T(`Return to ${g.en}`, `Regresa con ${g.es}`)}</li>` : ''}</ol>
    ${q.daily ? `<p class="small">${T('Finishes on its own. A new job is posted every day.', 'Se completa sola. Cada día hay un trabajo nuevo.')}</p>` : ''}
    <p class="small muted">${T(`From ${g.en}. Reward: ${rewardIn('en', q.rewards)}.`, `De ${g.es}. Premio: ${rewardIn('es', q.rewards)}.`)}</p>
    ${qs.st === 'active' && G.tracked !== q.id ? `<button class="btn small" data-act="q-track" data-q="${q.id}">${tx(L('Track this quest', 'Seguir esta misión'))}</button>` : ''}</div>`;
}
function renderQuests() {
  const act = activeQuests(), ready = QUESTS.filter(q => qState(q.id) && qState(q.id).st === 'ready');
  const avail = QUESTS.filter(questAvailable), done = QUESTS.filter(q => isDone(q.id));
  const caps = [...CAP_COLORS, ...CAP_UNLOCKS.filter(c => G.caps.has(c))], T = (en, es) => bi(L(en, es));
  return `<div class="page-head"><h2>${tx(L('Quests', 'Misiones'))}</h2><span class="muted">${tx(L(`${done.length} of ${QUESTS.length} quests complete`, `${done.length} de ${QUESTS.length} misiones completadas`))}</span></div>
  <div class="stack">
    ${ready.length ? `<div class="panel"><h3>${T('Ready to turn in', 'Listas para entregar')}</h3><div class="quest-grid">${ready.map(q => questCard(q, qState(q.id))).join('')}</div></div>` : ''}
    <div class="panel"><h3>${T('In progress', 'En progreso')}</h3>${act.length ? `<div class="quest-grid">${act.map(([q, qs]) => questCard(q, qs)).join('')}</div>` : `<p class="muted">${T('No active quests. Talk to people with a <b>!</b> over their heads in Origin Town, or check the Quest Board by the fountain.', 'No tienes misiones activas. Habla con la gente que tiene un <b>!</b> sobre la cabeza en Origin Town, o revisa el Tablero de misiones junto a la fuente.')}</p>`}</div>
    ${avail.length ? `<div class="panel"><h3>${T('Available', 'Disponibles')}</h3><ul class="board-list">${avail.map(q => { const g = npcL(q.giver); return `<li><b>${bi(qTitle(q))}</b><span class="small">${T(`Talk to ${g.en} in Origin Town. Reward: ${rewardIn('en', q.rewards)}.`, `Habla con ${g.es} en Origin Town. Premio: ${rewardIn('es', q.rewards)}.`)}</span></li>`; }).join('')}</ul></div>` : ''}
    <div class="panel"><h3>${T('Your look', 'Tu estilo')}</h3>
      <p class="small muted">${T('Quests unlock new outfits and titles. Your title shows on your trainer card.', 'Las misiones desbloquean ropa y títulos nuevos. Tu título aparece en tu tarjeta de entrenador.')}</p>
      <div class="look-row"><span class="look-av">${playerAvatar('down')}</span><button class="btn" data-act="open-wardrobe">${tx(L('Open wardrobe', 'Abrir ropero'))}</button></div>
      <b class="small">${tx(L('Title', 'Título'))}</b><div class="choice-row" style="margin-top:6px">${G.titles.size ? [...G.titles].map(ti => `<button class="choice" data-act="q-title" data-t="${esc(ti)}" aria-pressed="${G.title === ti}">${esc(tx(titleL(ti)))}</button>`).join('') : `<span class="small muted">${T('Finish a quest to earn your first title.', 'Termina una misión para ganar tu primer título.')}</span>`}</div></div>
    ${done.length ? `<div class="panel"><h3>${T('Completed', 'Completadas')}</h3><ul class="board-list">${done.map(q => `<li><b>${bi(qTitle(q))}</b><span class="small">${rewardText(q.rewards)}</span></li>`).join('')}</ul></div>` : ''}
  </div>`;
}
// Small objective box on the map for the tracked quest.
function trackedLine() {
  if (!G.tracked) { const a = activeQuests()[0]; if (a) G.tracked = a[0].id; }
  const q = G.tracked === 'daily' ? dailyQuest() : Q_BY_ID[G.tracked];
  if (!q) return null;
  const qs = q.daily ? G.daily : qState(q.id); if (!qs || qs.st === 'done') return null;
  const p = questProgress(q, qs);
  return `${tx(qTitle(q))}: ${tx(p.text)}${!p.done && p.need > 1 ? ` (${p.have}/${p.need})` : ''}`;
}

</script>
<script>/* ===== wardrobe.js ===== */
/* Numlings: the wardrobe. What a student owns, how to unlock the rest, teacher reward codes,
   the Wardrobe screen, and the character creator on the new-game screen. */
'use strict';
/* ---------- owning things ---------- */
const CREST_ORDER = ['easy', 'hard', 'chaos'];
function owns(it) {
  const s = it.src || {};
  if (s.start) return true;
  if (s.quest) return typeof isDone === 'function' && isDone(s.quest);
  if (s.badge) return G.badges.has(s.badge);
  if (s.crest) return CREST_ORDER.slice(CREST_ORDER.indexOf(s.crest)).some(d => G.dungeon[d].clears > 0);
  if (s.shiny) return G.shinies.size >= s.shiny;
  if (s.codex) return G.caught.size >= s.codex;
  if (s.cap) return G.caps.has(s.cap);
  if (s.reward) return G.rewards.has(s.reward);
  return false;
}
function unlockText(it) {
  const s = it.src || {};
  if (s.start) return L('Yours from the start.', 'Lo tienes desde el principio.');
  if (s.quest) { const q = Q_BY_ID[s.quest]; return L(`Finish the quest “${q ? q.title : s.quest}.”`, `Termina la misión “${q ? q.titleEs || q.title : s.quest}.”`); }
  if (s.badge) return L(`Beat the ${ZONES[s.badge].name} Champion.`, `Vence al Campeón de ${ZONES[s.badge].name}.`);
  if (s.crest) { const es = { easy: 'Fácil', hard: 'Difícil', chaos: 'Caos' }[s.crest], en = s.crest[0].toUpperCase() + s.crest.slice(1);
    return L(`Clear the Dungeon of Multiplia on ${en}${s.crest === 'chaos' ? '' : ' or harder'}.`, `Supera la Mazmorra de Multiplia en ${es}${s.crest === 'chaos' ? '' : ' o más difícil'}.`); }
  if (s.shiny) return L('Catch a shiny Numling.', 'Atrapa un Numling brillante.');
  if (s.codex) return L(`Have ${s.codex} Numlings in your codex.`, `Ten ${s.codex} Numlings en tu códex.`);
  if (s.cap) { const q = QUESTS.find(q => q.rewards && q.rewards.cap === s.cap); return q ? L(`Finish the quest “${q.title}.”`, `Termina la misión “${q.titleEs || q.title}.”`) : L('A quest reward.', 'Un premio de misión.'); }
  if (s.reward) { const r = (CONFIG.rewards || []).find(r => r.id === s.reward); return L(`A reward from your teacher: ${r ? r.en : s.reward}.`, `Un premio de tu maestro: ${r ? r.es : s.reward}.`); }
  return L('Keep exploring!', '¡Sigue explorando!');
}
const itemName = it => L(it.en, it.es);
// Called after progress is saved: announces outfit pieces the student just unlocked.
function checkUnlocks(quiet = false) {
  if (!G || !G.outfit) return;
  const owned = OUTFITS.filter(owns).map(o => o.id);
  if (!G.seenItems) { G.seenItems = new Set(owned); return; }
  const fresh = owned.filter(id => !G.seenItems.has(id));
  if (!fresh.length) return;
  fresh.forEach(id => G.seenItems.add(id));
  G.newItems = new Set([...(G.newItems || []), ...fresh]);
  if (quiet || typeof toast !== 'function') return;
  const names = fresh.map(id => tx(itemName(OUTFIT[id])));
  const list = names.length > 2 ? `${names.slice(0, 2).join(', ')} +${names.length - 2}` : names.join(LANG === 'es' ? ' y ' : ' and ');
  toast(tx(L(`New outfit unlocked: ${list}! Try it on in your Wardrobe at Home.`, `¡Nueva ropa desbloqueada: ${list}! Pruébala en tu Ropero en Casa.`)), 4200);
}

/* ---------- teacher reward codes ----------
   A code looks like HONORA-4K7Q2P. The letters after the dash come from a hash of the reward, the student's trainer
   nickname, and the game's salt, so a code only works for the student it was made for. */
const normNick = n => String(n || '').trim().toLowerCase().replace(/\s+/g, ' ');
function rewardCode(rewardId, nickname) {
  const r = (CONFIG.rewards || []).find(r => r.id === rewardId); if (!r) return '';
  const h = hash(`${CONFIG.saveSalt}|reward|${r.id}|${normNick(nickname)}`).toUpperCase().slice(-6);
  return `${r.short}-${h}`;
}
function redeemCode(raw) {
  const code = String(raw || '').toUpperCase().replace(/\s+/g, '');
  const [short] = code.split('-');
  const r = (CONFIG.rewards || []).find(r => r.short === short);
  if (!r || rewardCode(r.id, G.trainer) !== code) return { ok: false, msg: L(`That code doesn’t match your trainer nickname (${G.trainer}). Check the letters, or ask your teacher.`, `Ese código no coincide con tu apodo de entrenador (${G.trainer}). Revisa las letras o pregúntale a tu maestro.`) };
  if (G.rewards.has(r.id)) return { ok: false, msg: L(`You already have the ${r.en} reward.`, `Ya tienes el premio ${r.es}.`) };
  const items = OUTFITS.filter(o => o.src && o.src.reward === r.id);
  G.rewards.add(r.id);
  if (!G.newItems) G.newItems = new Set();
  items.forEach(o => { if (G.seenItems) G.seenItems.add(o.id); G.newItems.add(o.id); });   // announced by the message below, not twice
  save();
  const list = (names, and) => (names.length < 2 ? names.join('') : `${names.slice(0, -1).join(', ')}${names.length > 2 && and === 'and' ? ',' : ''} ${and} ${names[names.length - 1]}`);

    const hearts = document.querySelectorAll('.dg-hearts .heart'); if (hearts[r.hearts]) hearts[r.hearts].classList.remove('on');
    const run = $('.dungeon-run'); run.classList.remove('hurt'); void run.offsetWidth; run.classList.add('hurt');
    flash.className = 'dg-flash bad'; flash.textContent = `${ok === null ? 'Too slow! ' : ''}${r.fact.a} × ${r.fact.b} = ${r.fact.ans}`;
    await sleep(1300);
  }
  if (ctx !== here) return;
  flash.textContent = ''; flash.className = 'dg-flash';
  if (r.mode === 'catch') {
    if (r.hearts <= 0) { dgCatchEnd(false); return; }
    if (r.hits >= r.perFloor) { dgCatchEnd(true); return; }
    dgNext(); return;
  }
  if (r.hearts <= 0) { dgEnd(false); return; }
  if (r.hits >= r.perFloor) {
    if (r.floor >= r.floors) { dgEnd(true); return; }
    r.floor++; r.hits = 0; r.guard = dgGuard(r.floor); r.fact = null;
    render();
    const f = $('#dg-fact'); f.textContent = r.floor === r.floors ? 'The Multitaur appears!' : `Floor ${r.floor}`; f.classList.add('banner');

function dgEnd(cleared, quit = false) {
  cancelAnimationFrame(dgTimer);
  const r = ctx.run, D = CONFIG.dungeons.multiplia, rec = G.dungeon[r.diff];

  const avgT = r.correct ? Math.round(r.timeSum / r.correct / 100) : 0;
  if (r.correct > rec.best) { if (rec.best) r.records.push('most facts'); rec.best = r.correct; }
  if (r.bestStreak > rec.streak) { if (rec.streak) r.records.push('longest streak'); rec.streak = r.bestStreak; }
  if (cleared) {
    const secs = Math.round(r.elapsed / 1000);
    r.firstClear = rec.clears === 0; rec.clears++;
    if (!rec.fastest || secs < rec.fastest) { if (rec.fastest) r.records.push('fastest clear'); rec.fastest = secs; }
    if (avgT && (!rec.avg || avgT < rec.avg)) { if (rec.avg) r.records.push('fastest average'); rec.avg = avgT; }
    if (r.diff === 'chaos' && !G.dungeon.taur) {
      G.dungeon.taur = 1;
      const c = addToCollection(68, 30);
      r.rewards.push(`<b>The Multitaur bows to you and joins your ${G.party.includes(c.uid) ? 'team' : 'collection'}!</b> Only trainers who clear Chaos can earn it.`);
    }
  }
  const ld = lead(), xp = r.correct * (r.diff === 'chaos' ? 4 : r.diff === 'hard' ? 3 : 2) + (cleared ? { easy: 40, hard: 70, chaos: 120 }[r.diff] : 0);
  if (ld && xp) { const ups = addXp(ld, xp); r.rewards.push(`${SP[ld.n].name} earned ${xp} XP.${ups.length ? ` It reached level ${ld.lv}!` : ''}${evoReady(ld, ups)}`); }
  // Dungeon residents: one blocks the exit after every clear; perfect runs may summon a shiny too.
  ctx.queue = [];
  if (cleared) {
    ctx.queue.push({ n: dgRollResident(), shiny: false });
    if (r.misses === 0 && Math.random() < D.shinyChance) ctx.queue.push({ n: dgRollResident(), shiny: true });
    ctx.queue.forEach(q => G.seen.add(q.n));
  }
  ctx.catchMsg = null; ctx.main = r;
  questRefresh(); save();
  ctx.phase = 'result'; render(); window.scrollTo(0, 0);
}
function dgRollResident() { const D = CONFIG.dungeons.multiplia; return Math.random() < D.rareChance ? D.rare : pick(D.monsters); }
function startDgCatch() {
  const D = CONFIG.dungeons.multiplia, q = ctx.queue && ctx.queue[0]; if (!q) return;
  const diff = ctx.diff, secs = q.shiny ? D.shinySeconds : D.seconds[diff];
  ctx.phase = 'run';
  ctx.run = { mode: 'catch', diff, shiny: q.shiny, guard: q.n, floor: 1, floors: 1, perFloor: D.catchFacts, maxHearts: D.catchMisses + 1, secs,
    hits: 0, hearts: D.catchMisses + 1, streak: 0, bestStreak: 0, correct: 0, misses: 0, timeSum: 0, used: new Set(), start: performance.now(), fact: null, busy: false };
  render(); window.scrollTo(0, 0); dgNext();
}
function dgCatchEnd(ok) {
  cancelAnimationFrame(dgTimer);
  const D = CONFIG.dungeons.multiplia, cr = ctx.run, q = ctx.queue.shift(), sp = SP[q.n];
  if (ok) {
    if (G.creatures.length >= CONFIG.boxLimit) ctx.catchMsg = `You caught ${sp.name}, but your collection is full. Release a Numling in Team to make room next time.`;
    else {
      const c = addToCollection(q.n, D.catchLevel[cr.diff], q.shiny); G.stats.caught++; questEvent('catch', { zone: 'dungeon', n: q.n });
      ctx.catchMsg = `<b>${q.shiny ? '✦ The shiny ' : ''}${sp.name} joined your ${G.party.includes(c.uid) ? 'team' : 'collection'}!</b>${sp.n === D.rare ? ' That’s the rare one. Only about 1 clear in 10 brings it out.' : ''}`;
    }
  } else ctx.catchMsg = `${q.shiny ? 'The shiny ' : ''}${sp.name} slipped away into the dark. Clear the dungeon again for another chance.`;
  ctx.run = ctx.main; ctx.phase = 'result'; save(); render(); window.scrollTo(0, 0);
}
document.addEventListener('input', e => { if (e.target.id === 'dg-input') dgInput(); });
document.addEventListener('click', e => {

function rollWild(zone, minR = 1, weightsBy = CONFIG.encounters.weights) {
  const E = CONFIG.encounters;

  let pool = SPECIES.filter(s => s.zone === zone && s.r >= minR && !s.evolved && (s.r < 5 || legendaryOpen) && (weightsBy[s.r] || 0) > 0);
  if (!pool.length) pool = SPECIES.filter(s => s.zone === zone && !s.evolved && s.r === 3);
  const counts = {}; pool.forEach(s => (counts[s.r] = (counts[s.r] || 0) + 1));
  const weights = pool.map(s => (weightsBy[s.r] || 0) / counts[s.r]);
  let x = Math.random() * weights.reduce((a, b) => a + b, 0), sp = pool[0];
  for (let i = 0; i < pool.length; i++) { x -= weights[i]; if (x <= 0) { sp = pool[i]; break; } }

}

    <g fill="#F4A6A0" stroke="#C0706A" stroke-width="1"><path d="M352 186 q6 -10 12 0z"/><path d="M28 196 q5 -8 10 0z"/></g></svg>`;
}
function catchRing(c) {
  const R = 46, C = 2 * Math.PI * R, seg = C / c.need, gap = c.need > 1 ? 7 : 0;
  return `<svg class="ring" viewBox="0 0 100 100" aria-hidden="true"><g>${Array.from({ length: c.need }, (_, i) =>
    `<circle cx="50" cy="50" r="${R}" fill="none" stroke="${i < c.got ? '#FFD43B' : 'rgba(255,255,255,.55)'}" stroke-width="5" stroke-linecap="round"
      stroke-dasharray="${seg - gap} ${C}" stroke-dashoffset="${-i * seg}" transform="rotate(-90 50 50)"/>`).join('')}</g></svg>`;
}

/* ========================= encounter / catching ========================= */
function catchPlan(r, shiny = false) {
  const n = RARITY[r].tiers.length, s = CONFIG.catchSeconds[r];
  const misses = CONFIG.catchMissesAllowed + (shiny ? CONFIG.encounters.shinyExtraMiss : 0);
  const time = s >= 120 && s % 60 === 0 ? L(s / 60 + ' minutes', s / 60 + ' minutos') : L(s + ' seconds', s + ' segundos');
  return bi(L(`Solve ${n} problem${n > 1 ? 's' : ''}. ${s ? `You get ${time.en} for each one.` : 'No timer.'} ${misses + 1} misses and it runs away.`,
              `Resuelve ${n} problema${n > 1 ? 's' : ''}. ${s ? `Tienes ${time.es} para cada uno.` : 'Sin tiempo límite.'} Con ${misses + 1} errores se escapa.`));
}
function matchupText(myType, foeType) {
  const m = typeMult(myType, foeType), t = typeMult(foeType, myType);
  if (m > 1) return bi(L('You have the type advantage.', 'Tienes la ventaja de tipo.'));
  if (t > 1) return bi(L('It has the type advantage. Consider switching your lead in Team.', 'Tiene la ventaja de tipo. Considera cambiar a tu líder en Equipo.'));
  return bi(L('Even matchup.', 'Combate parejo.'));
}
const zoneBack = () => tx(W ? L(`Back to ${mapName(W.zone)}`, `Volver a ${mapName(W.zone)}`) : L('Back to zones', 'Volver a las zonas'));
function renderEncounter() {
  const z = ZONES[ctx.zone], w = ctx.wild, s = SP[w.n], ld = lead();
  const enter = ctx.fresh; ctx.fresh = false;
  const owned = G.caught.has(w.n) && ctx.result !== 'caught';
  const full = G.creatures.length >= CONFIG.boxLimit;
  const foeCls = ctx.result === 'caught' ? 'captured' : ctx.result === 'fled' ? 'flee' : 'bob';
  let status = '', actions = '';
  const T = (en, es) => bi(L(en, es)), B = k => t(k);
  if (ctx.result === 'caught') {
    status = `<p class="result-msg">${T(`${w.shiny ? 'A shiny ' : ''}${s.name} joined your collection!`, `¡${s.name}${w.shiny ? ' brillante' : ''} se unió a tu colección!`)}</p>${w.shiny ? `<p>${T('<b>✦ That’s a shiny.</b> It’s marked in your Codex and keeps its colors when it evolves.', '<b>✦ Es brillante.</b> Queda marcado en tu Códex y conserva sus colores cuando evoluciona.')}</p>` : ''}<p>${bi(ctx.joined)}</p>`;
    actions = `<button class="btn primary" data-act="explore-again">${B('keepExploring')}</button><button class="btn" data-act="nav" data-to="team">${B('seeTeam')}</button>`;
  } else if (ctx.result === 'fled') {
    status = `<p class="result-msg">${T(`${s.name} ran off.`, `${s.name} se escapó.`)}</p><p class="muted">${T('No worries. Another one could show up anytime.', 'No te preocupes. Otro puede aparecer en cualquier momento.')}</p>`;
    actions = `<button class="btn primary" data-act="explore-again">${B('keepExploring')}</button>`;
  } else {
    if (ctx.afterBattle) status = `<p class="result-msg">${T(`You won! ${s.name} is still hanging around.`, `¡Ganaste! ${s.name} sigue por aquí.`)}</p>`;
    if (full) status += `<p class="banner">${T(`Your collection is full (${CONFIG.boxLimit}). Release a Numling in Team to make room.`, `Tu colección está llena (${CONFIG.boxLimit}). Libera un Numling en Equipo para hacer espacio.`)}</p>`;
    actions = ctx.catching ? '' : `<button class="btn primary" data-act="try-catch" ${full ? 'disabled' : ''}>${B('catchIt')}</button>
      ${ctx.afterBattle ? '' : `<button class="btn" data-act="start-battle">${B('battle')}</button>`}
      <button class="btn" data-act="explore-again">${ctx.afterBattle ? B('keepExploring') : B('walkAway')}</button>`;
  }
  const card = ctx.result === 'caught' ? `<div class="dexcard"><span class="dexno">No. ${s.n}</span><div class="art-wrap">${artC(w)}</div><b>${w.shiny ? '✦ ' : ''}${s.name}</b>${stars(s.r)}<span class="stamp">${tx(L('Caught', 'Atrapado'))}</span></div>` : '';
  const misses = ctx.catching ? CONFIG.catchMissesAllowed + 1 - ctx.catching.misses : 0;
  return `<div class="enc theme-${ctx.zone}">
    <div class="scene scene-${ctx.zone}${enter ? ' enter' : ''}${s.r >= 3 ? ' shine r' + s.r : ''}${w.shiny ? ' shiny-scene' : ''}">
      ${sceneSVG(ctx.zone)}
      <span class="scene-tag">${tx(L(`${w.shiny && enter ? '✦ A shiny appeared! ' : ''}Spotted at (${num(w.spot[0])}, ${num(w.spot[1])})`, `${w.shiny && enter ? '✦ ¡Apareció uno brillante! ' : ''}Visto en (${num(w.spot[0])}, ${num(w.spot[1])})`))}</span>
      ${ctx.catching ? `<span class="scene-tag right">${tx(L(`${ctx.catching.got} of ${ctx.catching.need} solved. ${misses} ${misses === 1 ? 'miss' : 'misses'} left.`, `${ctx.catching.got} de ${ctx.catching.need} resueltos. Te ${misses === 1 ? 'queda' : 'quedan'} ${misses} ${misses === 1 ? 'error' : 'errores'}.`))}</span>` : ''}
      <div class="stage"><div class="plat"></div><div class="foe ${foeCls}">${artC(w)}</div>${ctx.catching ? catchRing(ctx.catching) : ''}</div>
      ${card}
    </div>
    <div class="panel enc-info">
      <h2 class="enc-name">${w.shiny ? '<span class="shiny-star" aria-hidden="true">✦</span>' : ''}${s.name}</h2>
      <div class="chips" style="margin-top:6px">${typeChip(s.type)}${w.shiny ? shinyChip : ''}<span class="chip" style="--c:var(--none)">${tx(L(`Catch level ${w.lv}`, `Nivel de captura ${w.lv}`))}</span>${rarityTag(s.r)}${owned ? `<span class="small muted">${tx(L('Already in your codex', 'Ya está en tu códex'))}</span>` : ''}</div>
      ${ctx.result || ctx.catching ? '' : `<ul class="facts">
        ${w.shiny ? `<li><b>${tx(L('Shiny!', '¡Brillante!'))}</b><span>${T(`A rare recolor. Only about 1 in ${Math.round(1 / CONFIG.encounters.shinyChance)} wild Numlings is shiny. You get ${CONFIG.encounters.shinyExtraMiss} extra miss to catch it.`, `Un color raro. Solo 1 de cada ${Math.round(1 / CONFIG.encounters.shinyChance)} Numlings salvajes es brillante. Tienes ${CONFIG.encounters.shinyExtraMiss} error extra para atraparlo.`)}</span></li>` : ''}
        <li><b>${tx(L('To catch', 'Para atraparlo'))}</b><span>${catchPlan(s.r, w.shiny)} ${T(`It joins your team at level ${w.lv}.`, `Se une a tu equipo en el nivel ${w.lv}.`)}</span></li>
        ${ctx.afterBattle ? '' : `<li><b>${tx(L('In battle', 'En combate'))}</b><span>${w.battleLv > w.lv ? T(`It powers up to level ${w.battleLv} to match your team.`, `Sube al nivel ${w.battleLv} para igualar a tu equipo.`) : T(`It fights at level ${w.lv}.`, `Combate en el nivel ${w.lv}.`)}</span></li>`}
        <li><b>${tx(L('Your lead', 'Tu líder'))}</b><span>${T(`${SP[ld.n].name} (${TYPE_LABEL[SP[ld.n].type]}), level ${ld.lv}.`, `${SP[ld.n].name} (${TYPE_LABEL[SP[ld.n].type]}), nivel ${ld.lv}.`)} ${matchupText(SP[ld.n].type, s.type)}</span></li></ul>`}
      ${ctx.catching ? `<p class="note">${T(`Each correct answer tightens the ring. Fill it to catch ${s.name}!`, `Cada respuesta correcta cierra el anillo. ¡Llénalo para atrapar a ${s.name}!`)}</p>` : ''}
      ${status}
      <div class="btn-row">${actions}</div>
    </div>
  </div>`;
}
async function tryCatch() {
  const w = ctx.wild, s = SP[w.n], tiers = RARITY[s.r].tiers, topic = ZONES[ctx.zone].topic;
  const allowed = CONFIG.catchMissesAllowed + (w.shiny ? CONFIG.encounters.shinyExtraMiss : 0), here = ctx;
  here.catching = { got: 0, need: tiers.length, misses: 0 }; render();
  while (here.catching.got < tiers.length && here.catching.misses <= allowed) {
    const c = here.catching, left = allowed - c.misses;
    const pips = `<span class="pips" aria-label="${c.got} of ${tiers.length} solved">${tiers.map((_, i) => `<span class="pip ${i < c.got ? 'on' : ''}"></span>`).join('')}</span>`;
    const res = await askQuestion({ topic, tier: tiers[c.got], seconds: CONFIG.catchSeconds[s.r], autoMs: 1000, theme: ctx.zone, side: true,
      title: L(`Catch ${w.shiny ? 'shiny ' : ''}${s.name}`, `Atrapa a ${s.name}${w.shiny ? ' brillante' : ''}`), head: pips, headArt: artC(w, { label: false }),
      sub: L(`Problem ${c.got + 1} of ${tiers.length}. ${left === 0 ? 'One more miss and it runs away.' : `It runs away after ${left + 1} misses.`}`,
             `Problema ${c.got + 1} de ${tiers.length}. ${left === 0 ? 'Un error más y se escapa.' : `Se escapa después de ${left + 1} errores.`}`) });
    if (solved(res)) c.got++; else c.misses++;
    if (ctx !== here) return;
    render();
    await sleep(350);
  }
  const success = here.catching.got >= tiers.length;
  delete here.catching;
  if (success) {
    const c = addToCollection(w.n, w.lv, !!w.shiny);
    G.stats.caught++; questEvent('catch', { zone: here.zone, n: w.n });
    here.result = 'caught';
    here.joined = G.party.includes(c.uid) ? L('It’s on your team now.', 'Ya está en tu equipo.') : L('Your team is full, so it went to your collection. Swap it in from Team anytime.', 'Tu equipo está lleno, así que se fue a tu colección. Cámbialo desde Equipo cuando quieras.');
  } else here.result = 'fled';
  save(); render();
}

// Every backdrop gets the same finishing light: sun rays, haze along the horizon, and a soft vignette.
const SCENE_LIGHT = { isles: ['#FFF4C4', '#BFE6FF'], rapids: ['#FFF0B8', '#CFEBC8'], bluffs: ['#FFFFFF', '#D8E6F2'], dungeon: ['#B9A8FF', '#3B2F66'] };
function sceneSVG(zone) {
  const svg = sceneBase(zone), [sun, haze] = SCENE_LIGHT[zone] || SCENE_LIGHT.isles, id = 'sl' + zone;
  const light = `<defs><radialGradient id="${id}v" cx="50%" cy="45%" r="75%"><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#0B1630" stop-opacity=".28"/></radialGradient>
      <linearGradient id="${id}h" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${haze}" stop-opacity="0"/><stop offset=".5" stop-color="${haze}" stop-opacity=".45"/><stop offset="1" stop-color="${haze}" stop-opacity="0"/></linearGradient></defs>
    <g opacity=".22" fill="${sun}">${[[-30, 260, 40], [40, 300, 26], [110, 340, 34]].map(([a, b, w]) => `<path d="M${a} -10 L${a + w} -10 L${b + w * 1.6} 250 L${b} 250Z"/>`).join('')}</g>
    <rect x="0" y="118" width="400" height="44" fill="url(#${id}h)"/>
    <rect width="400" height="240" fill="url(#${id}v)"/>`;
  return svg.replace(/<\/svg>\s*$/, light + '</svg>');
}

<script>/* ===== battle.js ===== */
/* Numlings: battles against wild Numlings, trainers, and Champions */
'use strict';
/* ========================= battle =========================
   Opponent levels scale with the team's best Numling (see CONFIG.scaling and TRAINERS). */
const MOVE_BUMP = { name: 'Bump', type: 'none', power: 45 };
const movesOf = c => [MOVE_BUMP, { name: SP[c.n].move, type: SP[c.n].type, power: SP[c.n].stage === 3 ? 95 : SP[c.n].stage === 2 ? 80 : 65 }];
function fighter(c) { const st = stats(c); return { c, st, hp: st.hp, max: st.hp }; }
// Battle questions follow the student's own skill level in this zone (not their Numlings' levels).
// Champions ask one tier above what the student is working on.
function battleQ(topic, champ) {
  const tier = adaptiveTier(topic, champ ? 1 : 0);
  return { tier, seconds: CONFIG.battleSeconds[tier] };
}
const foeNameL = (b, f = b.foe) => (b.trainer ? L(`${b.trainer.short}’s ${SP[f.c.n].name}`, `${SP[f.c.n].name} de ${b.trainer.short}`)
  : L(`${f.c.shiny ? 'Shiny wild' : 'Wild'} ${SP[f.c.n].name}`, `${SP[f.c.n].name} ${f.c.shiny ? 'brillante ' : ''}salvaje`));
const foeName = (b, f = b.foe) => tx(foeNameL(b, f));
function startBattle({ zone, foes, wild = null, trainer = null }) {
  const team = G.party.map(byUid).map(fighter);
  const fs = foes.map(f => fighter({ n: f.n, lv: f.lv, shiny: !!f.shiny }));
  const b = { team, ai: 0, foes: fs, fi: 0, foe: fs[0], trainer, used: new Set([team[0].c.uid]),
    log: trainer ? L(`${trainer.name} sends out ${SP[fs[0].c.n].name}!`, `¡${trainer.nameEs || trainer.name} envía a ${SP[fs[0].c.n].name}!`) : L(`A wild ${SP[fs[0].c.n].name} wants to battle!`, `¡Un ${SP[fs[0].c.n].name} salvaje quiere combatir!`),
    busy: false, over: null, anim: null, dmg: null, rewards: [] };
  ctx = { zone, wild, trainer, battle: b };
  screen = 'battle'; render(); window.scrollTo(0, 0);
}
function hpCard(b, f, foe) {
  const pct = Math.round(f.hp / f.max * 100);
  const dots = foe && b.trainer ? `<span class="teamdots" aria-label="${b.foes.filter(x => x.hp > 0).length} of ${b.foes.length} left">${b.foes.map(x => `<i class="${x.hp > 0 ? 'on' : ''}"></i>`).join('')}</span>` : '';
  return `<div class="hpcard"><div class="nm"><span>${foe ? foeName(b, f) : SP[f.c.n].name}</span><span class="small">Lv ${f.c.lv}</span></div>
    <div class="chips">${typeChip(SP[f.c.n].type)}${dots}</div>
    <div class="hpbar ${pct <= 25 ? 'low' : pct <= 55 ? 'mid' : ''}" role="progressbar" aria-label="HP" aria-valuemin="0" aria-valuemax="${f.max}" aria-valuenow="${f.hp}"><i style="width:${pct}%"></i></div>
    <div class="hpnum">${f.hp} / ${f.max} HP</div></div>`;
}
function renderBattle() {
  const b = ctx.battle, me = b.team[b.ai], foe = b.foe, tr = b.trainer;
  const dmg = (who) => b.dmg && b.dmg.who === who ? `<span class="dmg ${b.dmg.crit ? 'crit' : ''}">${MINUS}${b.dmg.n}</span>` : '';
  const cls = (who) => [b.anim === 'me' && who === 'me' ? 'lunge-me' : '', b.anim === 'foe' && who === 'foe' ? 'lunge-foe' : '',
    b.anim === 'foe' && who === 'me' ? 'hit' : '', b.anim === 'me' && who === 'foe' ? 'hit' : ''].join(' ');
  let controls;
  if (b.over === 'won') {
    const more = tr ? `<button class="btn primary" data-act="explore-again">${zoneBack()}</button>`
      : `<button class="btn primary" data-act="catch-after">${tx(L(`Try to catch ${SP[foe.c.n].name}`, `Intenta atrapar a ${SP[foe.c.n].name}`))}</button><button class="btn" data-act="explore-again">${t('keepExploring')}</button>`;
    controls = `<div class="panel"><p class="result-msg">${t('youWon')}</p>${b.rewards.map(r => `<p>${bi(r)}</p>`).join('')}<div class="btn-row">${more}</div></div>`;
  } else if (b.over === 'lost') {
    controls = `<div class="panel"><p class="result-msg">${bi(tr ? L(`${tr.short} wins this time.`, `${tr.short} gana esta vez.`) : L('Your team needs a rest.', 'Tu equipo necesita descansar.'))}</p>
      <p>${bi(L(`Everyone is healed and ready to go again. ${tr ? `${tr.short} will be right where you left them.` : ''} Training is a good way to get stronger.`, `Todos están curados y listos otra vez. ${tr ? `${tr.short} te estará esperando en el mismo lugar.` : ''} Entrenar es una buena forma de hacerte más fuerte.`))}</p>
      <div class="btn-row"><button class="btn primary" data-act="nav" data-to="train">${t('trainTeam')}</button><button class="btn" data-act="explore-again">${zoneBack()}</button></div></div>`;
  } else {
    const dis = b.busy ? 'disabled' : '';
    const score = m => m.power * typeMult(m.type, SP[foe.c.n].type) * (m.type === SP[me.c.n].type ? 1.2 : 1);
    const best = score(movesOf(me.c)[1]) >= score(movesOf(me.c)[0]) ? 1 : 0;
    const bench = b.team.map((f, i) => i === b.ai || f.hp <= 0 ? '' :
      `<button class="btn" data-act="swap" data-i="${i}" ${dis}><span class="mini">${artC(f.c, { label: false })}</span>${tx(L(`Switch to ${SP[f.c.n].name}`, `Cambiar a ${SP[f.c.n].name}`))}</button>`).join('');
    controls = `<div class="moves">${movesOf(me.c).map((m, i) => {
      const eff = typeMult(m.type, SP[foe.c.n].type);
      return `<button class="btn move ${i === best ? 'primary' : ''}" data-act="move" data-i="${i}" ${dis}>${m.name}<small>${tx(L(`${TYPE_LABEL[m.type]} move${eff > 1 ? ', strong against this foe' : eff < 1 ? ', weak against this foe' : ''}`, `Movimiento ${TYPE_LABEL[m.type]}${eff > 1 ? ', fuerte contra este rival' : eff < 1 ? ', débil contra este rival' : ''}`))}</small></button>`;
    }).join('')}</div>
    <div class="bench">${bench}<button class="btn ghost" data-act="run" ${dis}>${tr ? t('giveUp') : t('runAway')}</button></div>`;
  }
  const banner = tr ? `<div class="vs-banner${tr.champion ? ' champ' : ''}"><span class="trainer-face">${npcAvatar(tr.id, tr.cap, tr.shirt, 'down')}</span><span><b>${tx(L(tr.name, tr.nameEs || tr.name))}</b><span class="small">${tr.champion ? tx(L(`${ZONES[ctx.zone].name} Champion`, `Campeón de ${ZONES[ctx.zone].name}`)) : tx(L('Trainer battle', 'Combate de entrenador'))}</span></span></div>` : '';
  return `${banner}<div class="arena theme-${ctx.zone}">${sceneSVG(ctx.zone)}
    <div class="side foe">${hpCard(b, foe, true)}<div class="art-wrap plat-wrap ${cls('foe')} ${foe.hp <= 0 ? 'faint' : 'bob'}">${artC(foe.c, { faceLeft: true })}${dmg('foe')}</div></div>
    <div class="side me"><div class="art-wrap plat-wrap ${cls('me')} ${me.hp <= 0 ? 'faint' : 'bob'}">${artC(me.c, { flip: true })}${dmg('me')}</div>${hpCard(b, me, false)}</div>
  </div>
  <p class="log" aria-live="polite">${bi(b.log)}</p>
  ${controls}`;
}
function damage(att, def, move, crit, guard) {
  const ld = att.c.lv;
  const base = Math.floor(((2 * ld / 5 + 2) * move.power * att.st.atk / def.st.def) / 50) + 2;
  const stab = move.type === SP[att.c.n].type ? 1.2 : 1;
  const eff = typeMult(move.type, SP[def.c.n].type);
  const n = Math.max(1, Math.round(base * stab * eff * (crit ? 1.8 : 1) * (guard ? 0.4 : 1) * (0.9 + Math.random() * 0.2)));
  return { n, eff };
}
const effL = e => (e > 1 ? L(' It’s a strong hit!', ' ¡Es un golpe fuerte!') : e < 1 ? L(' It’s a weak hit.', ' Es un golpe débil.') : L('', ''));
async function show(b, log, anim = null, dmg = null, wait = 750) {
  b.log = log; b.anim = anim; b.dmg = dmg; render();
  await sleep(wait);
  b.anim = null; b.dmg = null;
}
async function playerAttack(b, move) {
  const me = b.team[b.ai], foe = b.foe, name = SP[me.c.n].name;
  b.log = L(`${name} gets ready to use ${move.name}…`, `${name} se prepara para usar ${move.name}…`); render();
  const q = battleQ(ZONES[ctx.zone].topic, b.trainer && b.trainer.champion);
  const res = await askQuestion({ topic: ZONES[ctx.zone].topic, tier: q.tier, seconds: q.seconds, allowSkip: true, autoMs: 800, theme: ctx.zone, low: true, battle: true,
    title: UI.critTitle, sub: L(`Answer correctly and ${name}’s ${move.name} becomes a critical hit.`, `Responde bien y ${move.name} de ${name} será un golpe crítico.`) });
  const crit = solved(res);
  const d = damage(me, foe, move, crit, false);
  foe.hp = Math.max(0, foe.hp - d.n);
  await show(b, L(`${name} used ${move.name}.${crit ? ' Critical hit!' : ''}${effL(d.eff).en}`, `${name} usó ${move.name}.${crit ? ' ¡Golpe crítico!' : ''}${effL(d.eff).es}`), 'me', { who: 'foe', n: d.n, crit });
}
async function foeAttack(b) {
  const me = b.team[b.ai], foe = b.foe, fnL = foeNameL(b), fname = fnL.en;
  const ms = movesOf(foe.c), sig = ms[1];
  const move = typeMult(sig.type, SP[me.c.n].type) < 1 && Math.random() < 0.6 ? ms[0] : sig;
  b.log = L(`${fnL.en} is about to use ${move.name}!`, `¡${fnL.es} va a usar ${move.name}!`); render();
  const q = battleQ(ZONES[ctx.zone].topic, b.trainer && b.trainer.champion);
  const res = await askQuestion({ topic: ZONES[ctx.zone].topic, tier: q.tier, seconds: q.seconds, allowSkip: true, autoMs: 800, theme: ctx.zone, low: true, battle: true,
    title: UI.guardTitle, sub: L(`Answer correctly to block most of the damage from ${move.name}.`, `Responde bien para bloquear casi todo el daño de ${move.name}.`) });
  const guard = solved(res);
  const d = damage(foe, me, move, false, guard);
  me.hp = Math.max(0, me.hp - d.n);
  await show(b, L(`${fnL.en} used ${move.name}.${guard ? ' Guarded! Most of the damage was blocked.' : ''}${effL(d.eff).en}`, `${fnL.es} usó ${move.name}.${guard ? ' ¡Defendido! Bloqueaste casi todo el daño.' : ''}${effL(d.eff).es}`), 'foe', { who: 'me', n: d.n, crit: false });
}
// returns 'over' when the battle ended, 'switched' when a new Numling came in (the turn ends), or false
async function checkFaints(b) {
  if (b.foe.hp <= 0) {
    if (b.fi < b.foes.length - 1) {
      { const f0 = foeNameL(b); await show(b, L(`${f0.en} is worn out.`, `${f0.es} está agotado.`), null, null, 900); }
      b.fi++; b.foe = b.foes[b.fi];
      await show(b, L(`${b.trainer.short} sends out ${SP[b.foe.c.n].name}!`, `¡${b.trainer.short} envía a ${SP[b.foe.c.n].name}!`), null, null, 900);
      return 'switched';
    }
    await winBattle(b); return 'over';
  }
  const me = b.team[b.ai];
  if (me.hp <= 0) {
    const next = b.team.findIndex(f => f.hp > 0);
    if (next < 0) { b.over = 'lost'; b.busy = false; b.log = L(`${SP[me.c.n].name} is worn out.`, `${SP[me.c.n].name} está agotado.`); save(); render(); return 'over'; }
    await show(b, `${SP[me.c.n].name} is worn out.`, null, null, 900);
    b.ai = next; b.used.add(b.team[next].c.uid);
    await show(b, `Go, ${SP[b.team[next].c.n].name}!`, null, null, 700);
    return 'switched';
  }
  return false;
}
async function winBattle(b) {
  const tr = b.trainer, first = tr && !G.trainerWins.has(tr.id);
  let amount = b.foes.reduce((sum, f) => sum + 6 + f.c.lv * 4 + RARITY[SP[f.c.n].r].xp, 0);
  if (first) amount = Math.round(amount * 1.5);
  b.rewards = [];
  if (tr) b.rewards.push(L(`${tr.name}: “${tr.beat}”`, `${tr.nameEs || tr.name}: “${tr.beatEs || tr.beat}”`));
  for (const uid of b.used) {
    const c = byUid(uid); if (!c) continue;
    const ups = addXp(c, amount);
    b.rewards.push(L(`${SP[c.n].name} earned ${amount} XP${first ? ' (first-win bonus included)' : ''}.${ups.length ? ` It reached level ${c.lv}!` : ''}${evoReady(c, ups)}`,
                     `${SP[c.n].name} ganó ${amount} XP${first ? ' (incluye el bono por primera victoria)' : ''}.${ups.length ? ` ¡Llegó al nivel ${c.lv}!` : ''}${evoReadyEs(c, ups)}`));
  }
  if (tr) {
    G.trainerWins.add(tr.id);
    if (tr.champion && !G.badges.has(ctx.zone)) { G.badges.add(ctx.zone); b.rewards.push(L(`<b>You earned the ${ZONES[ctx.zone].name} Badge!</b> It’s on your trainer card in Save.`, `<b>¡Ganaste la insignia de ${ZONES[ctx.zone].name}!</b> Está en tu tarjeta de entrenador en Guardar.`)); }
    else if (!tr.champion && first) {
      const left = TRAINERS[ctx.zone].filter(t => !G.trainerWins.has(t.id)).length;
      b.rewards.push(left ? L(`${left} more trainer${left > 1 ? 's' : ''} to beat before the Champion will battle you.`, `Te ${left > 1 ? 'faltan' : 'falta'} ${left} entrenador${left > 1 ? 'es' : ''} por vencer antes de que el Campeón combata contigo.`)
        : L(`You’ve beaten every trainer here. The ${ZONES[ctx.zone].name} Champion is waiting!`, `Venciste a todos los entrenadores de aquí. ¡El Campeón de ${ZONES[ctx.zone].name} te espera!`));
    }
  }
  G.stats.won++; questEvent('battle', { zone: ctx.zone, trainer: tr ? tr.id : null, champion: !!(tr && tr.champion) }); save();
  { const f0 = foeNameL(b); b.log = L(`${f0.en} is worn out.`, `${f0.es} está agotado.`); }
  b.over = 'won'; b.busy = false; render();
}
async function battleTurn(action) {
  const b = ctx.battle; if (!b || b.busy || b.over) return;
  b.busy = true; render();
  if (action.swap != null) {
    b.ai = action.swap; b.used.add(b.team[b.ai].c.uid);
    await show(b, `Go, ${SP[b.team[b.ai].c.n].name}!`, null, null, 700);
    await foeAttack(b);
    if ((await checkFaints(b)) === 'over') return;
  } else {
    const me = b.team[b.ai], foe = b.foe;
    const move = movesOf(me.c)[action.move];
    const meFirst = me.st.spd > foe.st.spd || (me.st.spd === foe.st.spd && Math.random() < 0.5);
    for (const side of meFirst ? ['me', 'foe'] : ['foe', 'me']) {
      if (side === 'me') await playerAttack(b, move); else await foeAttack(b);
      const r = await checkFaints(b);
      if (r === 'over') return;
      if (r === 'switched') break;
    }
  }
  b.busy = false; b.log = L(`What will ${SP[b.team[b.ai].c.n].name} do?`, `¿Qué hará ${SP[b.team[b.ai].c.n].name}?`); render();
}

/* ========================= training ========================= */
const TRAIN_TIERS = { 1: { label: 'Warm-up', es: 'Calentamiento', xp: 5 }, 2: { label: 'Standard', es: 'Estándar', xp: 9 }, 3: { label: 'Challenge', es: 'Reto', xp: 14 } };

function renderTrain() {

        ${c.lv < 50 ? `<div class="xpbar"><i style="width:${Math.round(c.xp / xpNext(c.lv) * 100)}%"></i></div><span class="small muted">${tx(L(`Level ${c.lv}: ${c.xp} of ${xpNext(c.lv)} XP to level ${c.lv + 1}`, `Nivel ${c.lv}: ${c.xp} de ${xpNext(c.lv)} XP para el nivel ${c.lv + 1}`))}</span>` : `<span class="small muted">${tx(L('Max level', 'Nivel máximo'))}</span>`}</div>

async function runTraining() {
  const c = byUid(ctx.uid), name = SP[c.n].name, topics = openZones().map(z => ZONES[z].topic);
  let streak = 0, total = 0, right = 0, hinted = 0, asked = 0; const startLv = c.lv;
