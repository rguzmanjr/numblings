<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Numlings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&family=Sniglet:wght@400;800&display=swap" rel="stylesheet">
<style>
/* Numlings styles */
*{box-sizing:border-box}
[hidden]{display:none!important}
:root{
  --paper:#EAF1F5; --grid:#D7E4EC; --grid-major:#BED1DD;
  --ink:#1B2848; --pencil:#4F5E79; --card:#FFFFFF; --card-2:#F3F8FB;
  --line:#1B2848; --hl:#FFD43B; --hl-ink:#1B2848; --on-color:#FFFFFF;
  --good:#1F7A45; --good-bg:#DDF4E5; --bad:#B73232; --bad-bg:#FBE3E3;
  --blaze:#D3452C; --tide:#2168B8; --grove:#22804A; --volt:#6E44D4; --none:#5F6A85;
  --gold:#B57B00; --focus:#2168B8;
  --r-l:20px; --r-m:14px; --r-s:9px;
  --display:'Sniglet','Trebuchet MS',system-ui,sans-serif;
  --body:'Lexend','Segoe UI',system-ui,-apple-system,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#132038; --grid:#192844; --grid-major:#223558;
    --ink:#EEF3FF; --pencil:#AEBBD6; --card:#1C2B4A; --card-2:#22345A;
    --line:#8EA2CB; --on-color:#10192E;
    --good:#5BCB88; --good-bg:#173C2B; --bad:#FF8A8A; --bad-bg:#46202A;
    --blaze:#FF7A5C; --tide:#62A9FF; --grove:#55C67F; --volt:#AB8EFF; --none:#A0ABC6;
    --gold:#F2B731; --focus:#62A9FF; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#132038; --grid:#192844; --grid-major:#223558;
  --ink:#EEF3FF; --pencil:#AEBBD6; --card:#1C2B4A; --card-2:#22345A;
  --line:#8EA2CB; --on-color:#10192E;
  --good:#5BCB88; --good-bg:#173C2B; --bad:#FF8A8A; --bad-bg:#46202A;
  --blaze:#FF7A5C; --tide:#62A9FF; --grove:#55C67F; --volt:#AB8EFF; --none:#A0ABC6;
  --gold:#F2B731; --focus:#62A9FF; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{
  margin:0; min-height:100vh; font-family:var(--body); font-size:17px; line-height:1.5; color:var(--ink);
  background-color:var(--paper);
  background-image:
    linear-gradient(var(--grid-major) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid-major) 1px,transparent 1px),
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:100px 100px,100px 100px,20px 20px,20px 20px;
  background-attachment:fixed;
}
#app{max-width:940px;margin:0 auto;padding:20px 16px 110px}
h1,h2,h3{font-family:var(--display);font-weight:800;line-height:1.1;margin:0}
h2{font-size:clamp(1.7rem,4.5vw,2.3rem)}
h3{font-size:1.3rem}
p{margin:.4em 0}
.muted{color:var(--pencil)}
.small{font-size:.86rem}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
img,svg{max-width:100%}

/* buttons */
.btn{
  font:600 1rem/1.2 var(--body); padding:.78rem 1.15rem; min-height:48px;
  border:2px solid var(--line); border-radius:var(--r-m);
  background:var(--card); color:var(--ink); box-shadow:0 4px 0 var(--line);
  cursor:pointer; transition:transform .07s ease, box-shadow .07s ease;
  display:inline-flex; align-items:center; justify-content:center; gap:.5em; text-align:center;
}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn.primary{background:var(--hl);color:var(--hl-ink)}
.btn.ghost{box-shadow:none;background:transparent;border-color:transparent;text-decoration:underline;text-underline-offset:3px}
.btn.ghost:active{transform:none}
.btn.danger{color:var(--bad);border-color:var(--bad);box-shadow:0 4px 0 var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none;transform:none}
.btn.wide{width:100%}
.btn-row{display:flex;flex-wrap:wrap;gap:12px;margin-top:16px}
.btn-row .btn{flex:1 1 140px}
.linkish{background:none;border:0;padding:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-weight:600}

.panel{background:var(--card);border:2px solid var(--line);border-radius:var(--r-l);padding:18px}
.stack{display:grid;gap:16px}
.chip{display:inline-flex;align-items:center;gap:.3em;padding:.12em .65em;border-radius:999px;font-size:.8rem;font-weight:700;background:var(--c,var(--none));color:var(--on-color);white-space:nowrap}
.stars{color:var(--gold);letter-spacing:1px;font-size:.95rem}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.banner{border:2px dashed var(--bad);background:var(--bad-bg);border-radius:var(--r-m);padding:12px 14px;margin-bottom:16px;font-size:.92rem}

/* creature art */
.art{display:block;width:100%;height:auto;overflow:visible}
.art.px{image-rendering:pixelated;image-rendering:crisp-edges;-webkit-user-drag:none;user-select:none}
.face-left{scale:-1 1}
.mini .art.px,.q-art .art.px,.trainer-face .art.px{image-rendering:auto}
.sil.px{opacity:.9}.sil.px.faint{opacity:.28}
.bob .art{animation:bob 2.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.sil{color:var(--ink);opacity:.82}
.sil.faint{opacity:.22}

/* title */
.title{display:grid;gap:18px;justify-items:center;text-align:center;padding-top:10px}
.logo{font-size:clamp(3.4rem,13vw,6.2rem);letter-spacing:.01em;line-height:.95;margin-top:6px}
.logo span{display:inline-block;text-shadow:4px 4px 0 var(--hl)}
.logo span:nth-child(odd){transform:rotate(-4deg) translateY(3px)}
.logo span:nth-child(3n){transform:rotate(5deg) translateY(-2px)}
.tagline{font-size:1.1rem;color:var(--pencil);max-width:34ch}
.plane{position:relative;width:min(100%,560px);aspect-ratio:2/1;margin:clamp(70px,16vw,96px) auto 10px}
.plane .ax{position:absolute;background:var(--ink)}
.plane .ax.x{left:0;right:0;top:50%;height:2px}
.plane .ax.y{top:0;bottom:0;left:50%;width:2px}
.plane .ax.x::after,.plane .ax.y::after{content:"";position:absolute;border:7px solid transparent}
.plane .ax.x::after{right:-4px;top:-6px;border-left:10px solid var(--ink);border-right:0}
.plane .ax.y::after{top:-4px;left:-6px;border-bottom:10px solid var(--ink);border-top:0}
.plane .ticks{position:absolute}
.plane .ticks.x{left:0;right:0;top:calc(50% - 5px);height:12px;background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px calc(100% / 12))}
.plane .ticks.y{top:0;bottom:0;left:calc(50% - 5px);width:12px;background:repeating-linear-gradient(180deg,var(--ink) 0 2px,transparent 2px calc(100% / 6))}
.plot{position:absolute;width:clamp(68px,20%,120px);margin:0;transform:translate(-50%,calc(-100% + 5px))}
.plot figcaption{font-weight:600;font-size:.85rem;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:0 .55em;display:inline-block;margin-top:-4px}
.plot::after{content:"";display:block;width:12px;height:12px;border-radius:50%;background:var(--hl);border:2px solid var(--ink);margin:2px auto 0}
.title-actions{display:grid;gap:12px;width:min(100%,360px)}

/* new game */
.starters{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.starter{background:var(--card);border:2px solid var(--line);border-radius:var(--r-l);padding:14px;cursor:pointer;text-align:center;box-shadow:0 4px 0 var(--line)}
.starter[aria-pressed="true"]{background:var(--hl);color:var(--hl-ink);outline:none}
.starter[aria-pressed="true"] .muted{color:var(--hl-ink)}
.starter .art-wrap{width:140px;margin:0 auto}
.field{display:grid;gap:6px;max-width:420px}
.field label{font-weight:700}
.text-in{font:600 1.15rem var(--body);padding:.7rem .9rem;border:2px solid var(--line);border-radius:var(--r-m);background:var(--card);color:var(--ink);width:100%}

/* explore */
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.lead-mini{display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:4px 14px 4px 6px;font-weight:600}
.lead-mini .mini{width:42px}
.mini{display:inline-block;line-height:0}
.zones{display:grid;gap:16px}
.zone{display:grid;grid-template-columns:12px 1fr auto;gap:16px;align-items:center;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:var(--r-l);padding:16px 18px 16px 0;cursor:pointer;box-shadow:0 4px 0 var(--line);overflow:hidden;color:var(--ink)}
.zone:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.zone .band{align-self:stretch;background:var(--c);margin:-16px 0}
.zone h3{font-size:1.55rem}
.zone .meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.86rem;color:var(--pencil);margin-top:6px}
.zone .go{font-weight:700;font-size:.95rem;background:var(--hl);color:var(--hl-ink);border:2px solid var(--line);border-radius:var(--r-s);padding:.4em .8em}
.zone:disabled{cursor:not-allowed;box-shadow:none;opacity:.6}
.zone:disabled .go{background:var(--card-2);color:var(--pencil)}

/* encounter */
.back{margin-bottom:12px}
.encounter{display:grid;grid-template-columns:minmax(200px,300px) 1fr;gap:22px;align-items:center}
.encounter .art-wrap{background:var(--card-2);border:2px solid var(--line);border-radius:var(--r-l);padding:10px 14px 4px}
.enc-name{font-size:clamp(2rem,6vw,2.8rem)}
.spot{font-family:var(--display);font-size:1.05rem;color:var(--pencil)}
.facts{display:grid;gap:8px;margin:14px 0 0;padding:0;list-style:none}
.facts li{display:flex;gap:10px;align-items:baseline}
.facts b{min-width:6.5em;font-size:.86rem;color:var(--pencil);font-weight:600}
.searching{display:grid;place-items:center;min-height:300px;text-align:center;gap:10px}
.radar{width:96px;height:96px;border:2px solid var(--line);border-radius:50%;position:relative;background:var(--card)}
.radar::before,.radar::after{content:"";position:absolute;background:var(--ink)}
.radar::before{left:50%;top:6px;bottom:6px;width:2px}
.radar::after{top:50%;left:6px;right:6px;height:2px}
.radar i{position:absolute;width:14px;height:14px;border-radius:50%;background:var(--hl);border:2px solid var(--line);animation:hop 1s steps(1) infinite}
@keyframes hop{0%{left:20%;top:24%}25%{left:62%;top:30%}50%{left:56%;top:64%}75%{left:22%;top:58%}}
.result-msg{font-family:var(--display);font-size:1.5rem;margin:6px 0}
.stamp{position:absolute;right:6px;top:10px;font-family:var(--display);font-weight:800;font-size:1.35rem;color:var(--good);border:3px solid var(--good);border-radius:10px;padding:.05em .45em;transform:rotate(-12deg);background:var(--card);animation:stamp .45s cubic-bezier(.2,1.6,.4,1) both}
@keyframes stamp{from{transform:rotate(-12deg) scale(2.4);opacity:0}to{transform:rotate(-12deg) scale(1);opacity:1}}
.art-wrap{position:relative}

/* battle */
.arena{position:relative;background:var(--card-2);border:2px solid var(--line);border-radius:var(--r-l);padding:14px;display:grid;grid-template-rows:auto auto;gap:4px;overflow:hidden;isolation:isolate}
.arena .scenery{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.plat-wrap::before{content:"";position:absolute;left:8%;right:8%;bottom:2%;height:18%;border-radius:50%;background:rgba(0,0,0,.16);box-shadow:inset 0 -4px 0 rgba(0,0,0,.08)}
.side{position:relative;z-index:1;display:grid;grid-template-columns:1fr minmax(120px,210px);align-items:center;gap:12px}
.side.me{grid-template-columns:minmax(120px,210px) 1fr}
.side .art-wrap{position:relative}
.side.foe .hpcard{justify-self:end}
.side.me .hpcard{justify-self:start}
.hpcard{width:100%;max-width:380px;background:var(--card);border:2px solid var(--line);border-radius:var(--r-m);padding:10px 12px}
.hpcard .nm{font-family:var(--display);font-weight:800;font-size:1.25rem;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.hpbar{height:12px;border:2px solid var(--line);border-radius:999px;background:var(--card-2);overflow:hidden;margin-top:6px}
.hpbar i{display:block;height:100%;background:var(--good);transition:width .45s ease}
.hpbar.mid i{background:var(--gold)}
.hpbar.low i{background:var(--bad)}
.hpnum{font-size:.82rem;color:var(--pencil);margin-top:2px;text-align:right}
.log{min-height:3.2em;font-weight:600;margin:12px 2px;font-size:1.05rem}
.moves{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.move{text-align:left;align-items:flex-start;flex-direction:column;gap:2px}
.move small{font-weight:400;font-size:.8rem;color:inherit;opacity:.8}
.bench{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}
.bench .btn{padding:.35rem .8rem .35rem .35rem;min-height:44px}
.bench .mini{width:34px}
.lunge-me{animation:lungeR .35s ease}
.lunge-foe{animation:lungeL .35s ease}
@keyframes lungeR{50%{transform:translate(18px,-10px)}}
@keyframes lungeL{50%{transform:translate(-18px,10px)}}
.hit{animation:hit .45s ease}
@keyframes hit{20%,60%{transform:translateX(-6px);filter:brightness(1.6)}40%,80%{transform:translateX(6px)}}
.dmg{position:absolute;left:50%;top:20%;font-family:var(--display);font-weight:800;font-size:1.8rem;color:var(--bad);-webkit-text-stroke:1px var(--card);animation:rise .9s ease forwards;pointer-events:none}
.dmg.crit{color:var(--blaze);font-size:2.2rem}
@keyframes rise{from{transform:translate(-50%,0);opacity:1}to{transform:translate(-50%,-40px);opacity:0}}
.faint{opacity:.25;filter:grayscale(1);transition:opacity .4s}

/* team / codex grids */
.party{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.slot{background:var(--card);border:2px solid var(--line);border-radius:var(--r-l);padding:10px;text-align:center;cursor:pointer;position:relative;color:var(--ink)}
.slot.empty{border-style:dashed;cursor:default;display:grid;place-items:center;min-height:170px;color:var(--pencil);font-size:.9rem;background:transparent}
.slot .art-wrap{width:min(120px,100%);margin:0 auto}
.lead-tag{position:absolute;left:8px;top:8px;font-size:.75rem;font-weight:700;background:var(--hl);color:var(--hl-ink);border:2px solid var(--line);border-radius:999px;padding:0 .5em}
.tile-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.tile{background:var(--card);border:2px solid var(--line);border-radius:var(--r-m);padding:8px 6px 10px;text-align:center;cursor:pointer;font-size:.86rem;font-weight:600;color:var(--ink);display:grid;gap:2px;justify-items:center}
.tile .art-wrap{width:82px}
.tile .lv{font-weight:400;color:var(--pencil);font-size:.78rem}
.tile.in-party{background:var(--card-2)}
.tile.locked{cursor:default;color:var(--pencil);border-style:dashed}
.dexno{font-size:.72rem;color:var(--pencil);font-weight:600}
.section{margin-top:26px}
.section > h3{margin-bottom:10px}
.cycle{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:.9rem}

/* detail / stats */
.detail-top{display:grid;grid-template-columns:130px 1fr;gap:16px;align-items:center}
.statrow{display:grid;grid-template-columns:5.5em 2.6em 1fr;gap:8px;align-items:center;font-size:.9rem}
.statbar{height:8px;border-radius:999px;background:var(--card-2);border:1px solid var(--line);overflow:hidden}
.statbar i{display:block;height:100%;background:var(--ink)}
.xpbar{height:10px;border:2px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card-2);margin:4px 0}
.xpbar i{display:block;height:100%;background:var(--tide)}
.note{font-family:var(--display);font-size:1.08rem;border-left:4px solid var(--hl);padding-left:10px;margin:12px 0}

/* train / save */
.choice-row{display:flex;flex-wrap:wrap;gap:10px}
.choice{border:2px solid var(--line);border-radius:var(--r-m);background:var(--card);padding:.55rem .9rem;cursor:pointer;font-weight:600;color:var(--ink);min-height:44px}
.choice[aria-pressed="true"]{background:var(--hl);color:var(--hl-ink)}
.choice small{display:block;font-weight:400;font-size:.78rem}
select.text-in{font-size:1rem}
.card-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-top:12px}
.card-stats div{border-top:2px solid var(--line);padding-top:6px}
.card-stats b{display:block;font-family:var(--display);font-size:1.9rem;line-height:1.1}
.codebox{width:100%;min-height:110px;font:500 .9rem/1.4 ui-monospace,Menlo,Consolas,monospace;padding:10px;border:2px solid var(--line);border-radius:var(--r-m);background:var(--card-2);color:var(--ink);word-break:break-all;resize:vertical}
.topicrow{display:grid;grid-template-columns:9em 1fr 4.5em;gap:10px;align-items:center;font-size:.9rem;margin-top:8px}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:2px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.nav button{background:none;border:0;border-radius:var(--r-m);padding:6px 2px;cursor:pointer;display:grid;justify-items:center;gap:2px;font-size:.78rem;font-weight:600;color:var(--pencil);min-height:52px}
.nav button svg{width:24px;height:24px}
.nav button[aria-current="page"]{background:var(--hl);color:var(--hl-ink)}

/* modal */
.overlay{position:fixed;inset:0;z-index:40;background:rgba(9,15,30,.6);display:grid;place-items:center;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));overflow-y:auto}
.sheet{width:min(100%,580px);background:var(--card);border:2px solid var(--line);border-radius:var(--r-l);padding:22px;box-shadow:0 6px 0 var(--line);animation:pop .18s ease-out}
@keyframes pop{from{transform:scale(.96);opacity:0}}
.q-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.q-head h2{font-size:1.5rem}
.q-sub{color:var(--pencil);font-size:.92rem}
.pips{display:flex;gap:6px;align-items:center}
.pip{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);background:var(--card)}
.pip.on{background:var(--good);border-color:var(--good)}
.tries{font-size:.82rem;font-weight:600;color:var(--pencil)}
.timer{position:relative;height:14px;border:2px solid var(--line);border-radius:999px;overflow:hidden;margin:12px 0 2px;background:var(--card-2)}
.timer i{position:absolute;inset:0 auto 0 0;background:var(--tide);width:100%}
.timer.low i{background:var(--bad)}
.timer-num{font-size:.8rem;font-weight:600;color:var(--pencil);text-align:right}
.q-text{font-size:clamp(1.25rem,4vw,1.6rem);font-weight:600;margin:16px 0 4px;line-height:1.55}
.q-text.long{font-size:1.12rem;font-weight:400}
.q-teks{font-size:.75rem;color:var(--pencil)}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;font-size:.82em;line-height:1.1;margin:0 .12em}
.fr > span{padding:0 .15em}
.fr .fn{border-bottom:2px solid currentColor}
.qtable{border-collapse:collapse;margin:10px 0;font-size:1.05rem}
.qtable th,.qtable td{border:2px solid var(--line);padding:.25em .8em;text-align:center}
.qtable th{background:var(--card-2)}
.q-input{font:700 1.7rem var(--body);text-align:center;width:100%;padding:.5rem;border:2px solid var(--line);border-radius:var(--r-m);background:var(--card-2);color:var(--ink);margin-top:14px}
.q-hint{font-size:.8rem;color:var(--pencil);text-align:center}
.q-warn{color:var(--bad);font-weight:600;font-size:.9rem;text-align:center;min-height:1.3em}
.keypad{display:none;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.keypad button{min-height:52px;font-size:1.3rem;font-weight:700;border:2px solid var(--line);border-radius:var(--r-s);background:var(--card);color:var(--ink);cursor:pointer}
.keypad .wide2{grid-column:span 2;font-size:1rem}
.touch .keypad{display:grid}
.fb{border-radius:var(--r-m);padding:12px 14px;margin-top:14px;font-size:1.02rem}
.fb.good{background:var(--good-bg);border:2px solid var(--good)}
.fb.bad{background:var(--bad-bg);border:2px solid var(--bad)}
.fb strong{font-family:var(--display);font-size:1.3rem;display:block}
.explain{font-size:.95rem;margin-top:6px}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

#toasts{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;width:max-content;max-width:90vw}
.toast{background:var(--ink);color:var(--paper);font-weight:600;padding:.6em 1.1em;border-radius:999px;max-width:90vw;text-align:center;animation:pop .2s ease-out}

/* ---------- zone maps ---------- */
.map-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.map-top p{max-width:60ch}
.hud{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.hud-box{background:var(--card);border:2px solid var(--line);border-radius:var(--r-m);padding:6px 14px;display:flex;align-items:baseline;gap:8px}
.hud-box b{font-family:var(--display);font-size:1.35rem;font-variant-numeric:tabular-nums}
.hud-box.quest{background:var(--hl);color:var(--hl-ink);border-color:var(--line)}
.viewport{position:relative;overflow:hidden;border:2px solid var(--line);border-radius:var(--r-l);box-shadow:0 4px 0 var(--line);touch-action:manipulation;cursor:pointer;outline-offset:4px;background:#46AEDD;user-select:none;-webkit-user-select:none}
.viewport.mt-rapids{background:#2E7D3E}
.layer{position:absolute;left:0;top:0;transition:transform 150ms linear;will-change:transform}
.terrain{position:absolute;inset:0;width:100%;height:100%;display:block}
.gridlines path{stroke:#1B2848;stroke-opacity:.09;stroke-width:1}
.axes{opacity:.55}
.axlab{font:700 11px Lexend,system-ui,sans-serif;fill:#1B2848;paint-order:stroke;stroke:#fff;stroke-width:3px;text-anchor:middle}
.axlab.big{font-size:15px;font-style:italic}
.chest .lid{transition:transform .35s ease;transform-box:fill-box;transform-origin:0% 100%}
.chest.open .lid{transform:translateY(-3px) rotate(-28deg)}
.actor{position:absolute;left:0;top:0;width:var(--t);height:var(--t);transition:transform 150ms linear;pointer-events:none}
.actor svg{width:100%;height:100%;display:block;overflow:visible}
.player{z-index:3}
.follower{z-index:2;width:calc(var(--t) * .86);height:calc(var(--t) * .86)}
.actor.in-grass{clip-path:inset(-60% -20% 22% -20%)}
.actor.in-grass::after{content:"";position:absolute;left:-10%;right:-10%;bottom:14%;height:16%;background:repeating-linear-gradient(90deg,transparent 0 3px,#2C7F3E 3px 5px);opacity:.75}
.no-anim .layer,.no-anim .actor{transition:none!important}
.bonk{animation:bonk .2s}
@keyframes bonk{50%{margin-top:-3px}}
#fx{position:absolute;inset:0;pointer-events:none;z-index:1}
#fx > span{position:absolute;width:var(--t);height:var(--t)}
.sparkle i{position:absolute;width:30%;height:30%;background:#fff;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:twinkle 1.4s ease-in-out infinite;filter:drop-shadow(0 0 3px #FFE27A)}
.sparkle i:nth-child(1){left:12%;top:16%}
.sparkle i:nth-child(2){left:56%;top:30%;animation-delay:.45s}
.sparkle i:nth-child(3){left:30%;top:58%;animation-delay:.9s}
@keyframes twinkle{0%,100%{transform:scale(.3);opacity:.3}50%{transform:scale(1.15);opacity:1}}
.rustle{background:radial-gradient(circle,rgba(255,255,255,.65) 0 18%,transparent 19%) 20% 30%/40% 40% no-repeat,radial-gradient(circle,rgba(255,255,255,.55) 0 18%,transparent 19%) 70% 50%/34% 34% no-repeat;animation:rustle .5s ease-out forwards}
@keyframes rustle{from{transform:scale(.6);opacity:1}to{transform:scale(1.3) translateY(-20%);opacity:0}}
.glint{border-radius:50%;box-shadow:0 0 0 3px #FFE27A,0 0 22px 8px #FFD43B;animation:glint .7s ease-out forwards}
@keyframes glint{from{transform:scale(.4);opacity:1}to{transform:scale(1.8);opacity:0}}
.target{border:3px solid #FFD43B;border-radius:50%;animation:glint .6s ease-out forwards}
.nope{border:3px solid #E5533A;border-radius:8px;animation:glint .5s ease-out forwards}
.say{position:absolute;left:12px;right:12px;bottom:12px;z-index:5;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:var(--r-m);padding:12px 14px;display:flex;gap:12px;align-items:center;box-shadow:0 4px 0 var(--line);cursor:default}
.say p{margin:0;flex:1;font-size:1rem}
.say .btn{min-height:40px;padding:.4rem .9rem}
.dpad{position:absolute;right:12px;bottom:12px;z-index:4;display:none;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:2px}
.dpad button{background:rgba(255,255,255,.72);border:2px solid #1B2848;border-radius:12px;font-size:1.1rem;color:#1B2848;touch-action:none;cursor:pointer}
.dpad button:active{background:#FFD43B}
.dpad [data-dir="up"]{grid-column:2;grid-row:1}.dpad [data-dir="left"]{grid-column:1;grid-row:2}
.dpad [data-dir="right"]{grid-column:3;grid-row:2}.dpad [data-dir="down"]{grid-column:2;grid-row:3}
@media (any-pointer:coarse),(max-width:700px){.dpad{display:grid}}
.say:not([hidden]) ~ .dpad{bottom:96px}
.flash{position:absolute;inset:0;z-index:8;pointer-events:none;opacity:0;background:repeating-linear-gradient(135deg,#fff 0 18px,#FFD43B 18px 36px)}
.flashing .flash{animation:flash .75s steps(6) forwards}
@keyframes flash{0%{opacity:0}20%{opacity:.9}40%{opacity:0}60%{opacity:.9}100%{opacity:1;background-position:120px 0}}

/* ---------- trainers, badges ---------- */
.say-btns{display:flex;gap:8px;flex:none}
.alert{animation:alertbob 1s ease-in-out infinite}
@keyframes alertbob{50%{transform:translateY(-3px)}}
.teamdots{display:inline-flex;gap:4px;margin-left:6px}
.teamdots i{width:11px;height:11px;border-radius:50%;border:2px solid var(--line);background:transparent}
.teamdots i.on{background:var(--bad);border-color:var(--bad)}
.vs-banner{display:flex;align-items:center;gap:12px;margin-bottom:12px;background:var(--card);border:2px solid var(--line);border-radius:var(--r-m);padding:8px 16px 8px 8px;width:max-content;max-width:100%;box-shadow:0 4px 0 var(--line)}
.vs-banner.champ{background:var(--hl);color:var(--hl-ink)}
.vs-banner b{display:block;font-family:var(--display);font-size:1.35rem;line-height:1.1}
.trainer-face{width:52px;height:52px;flex:none;display:block}
.trainer-face svg{width:100%;height:100%}
.badge-tag{background:var(--hl);color:var(--hl-ink);border-radius:999px;padding:0 .6em;font-weight:700}
.badges{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px}
.badge{display:grid;grid-template-columns:auto 1fr;column-gap:10px;align-items:center;border:2px dashed var(--line);border-radius:var(--r-m);padding:8px 14px 8px 8px;font-weight:700;opacity:.6}
.badge i{grid-row:span 2;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:1.3rem;background:var(--card-2);color:var(--pencil);border:2px solid var(--line)}
.badge small{font-weight:400;color:var(--pencil)}
.badge.on{border-style:solid;opacity:1}
.badge.on i{background:var(--c);color:#FFD43B}

/* ---------- dungeon ---------- */
.dg-head{margin:26px 0 12px}
.dungeon-card .band{background:repeating-linear-gradient(180deg,#2B2440 0 8px,#3B3256 8px 16px)}
.crest-row{display:inline-flex;gap:4px;vertical-align:middle}
.crest{width:22px;height:25px;color:var(--pencil)}
.crest.on{color:#1B2848;filter:drop-shadow(0 0 3px rgba(255,212,59,.6))}
.crest-wrap{display:inline-flex;width:40px;justify-content:center}
.crest-wrap .crest{width:34px;height:39px}
.badge .crest-wrap{grid-row:span 2}
.dungeon-lobby,.dungeon-run{--stone:#2A2438;--stone2:#352E47;--mortar:#1A1626;color:#F3EEFF;border-radius:var(--r-l);border:2px solid #120F1C;padding:20px;
  background-color:var(--stone);background-image:linear-gradient(var(--mortar) 2px,transparent 2px),linear-gradient(90deg,var(--mortar) 2px,transparent 2px),linear-gradient(90deg,var(--mortar) 2px,transparent 2px);
  background-size:64px 32px,64px 64px,64px 64px;background-position:0 0,0 0,32px 32px;box-shadow:0 4px 0 #120F1C,inset 0 0 80px rgba(0,0,0,.55)}
.dungeon-lobby .btn.ghost,.dungeon-run .btn.ghost{color:#F3EEFF}
.dungeon-lobby p{color:#E3DCF5}
.dg-hero{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;margin-bottom:16px}
.dg-hero h2{color:#FFE7A3;text-shadow:3px 3px 0 #120F1C}
.torch{display:block;width:26px;height:70px;position:relative}
.torch::before{content:"";position:absolute;left:9px;top:28px;width:8px;height:40px;background:#6B4421;border:2px solid #120F1C}
.torch i{position:absolute;left:3px;top:4px;width:20px;height:28px;border-radius:50% 50% 45% 45%;background:radial-gradient(circle at 50% 70%,#FFF3A8 0 25%,#FF9A2E 45%,#E5533A 70%,transparent 72%);animation:flicker .18s steps(2) infinite alternate;filter:drop-shadow(0 0 14px #FF9A2E)}
@keyframes flicker{to{transform:scale(1.08,.94) translateY(1px)}}
.dg-modes{display:grid;gap:10px}
.dg-mode{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;text-align:left;background:rgba(18,15,28,.65);color:#F3EEFF;border:2px solid #4A4163;border-radius:var(--r-m);padding:12px 14px;cursor:pointer}
.dg-mode b{display:block;font-family:var(--display);font-size:1.4rem}
.dg-mode .small{display:block;color:#CFC6E6}
.dg-mode .dg-rec{color:#FFE7A3;margin-top:2px}
.dg-mode.sel{border-color:#FFD43B;box-shadow:0 0 0 2px #FFD43B inset}
.dg-mode .crest{color:#8E84A8}.dg-mode .crest.on{color:#1B2848}
.dungeon-run{display:grid;gap:12px;justify-items:center;text-align:center}
.dg-top{display:flex;justify-content:space-between;align-items:center;width:100%;gap:10px;flex-wrap:wrap}
.dg-floor{font-family:var(--display);font-size:1.3rem;color:#FFE7A3}
.dg-hearts{display:flex;gap:6px}
.heart{width:30px;height:26px;fill:#4A4163}
.heart.on{fill:#FF4D6D;filter:drop-shadow(0 0 4px rgba(255,77,109,.7))}
.dg-streak{font-weight:700;color:#FFB347;min-width:6em;text-align:right}
.dg-hall{display:flex;align-items:flex-end;justify-content:center;gap:clamp(20px,8vw,90px);width:100%}
.dg-guard{width:min(46vw,190px);position:relative}
.dg-guard.shade .art{filter:brightness(.55) saturate(.6) drop-shadow(0 0 10px #8E6BFF)}
.dg-guard.boss{width:min(56vw,240px)}
.dg-guard.hit .art{animation:hit .35s ease}
.dg-hp{display:flex;gap:4px;justify-content:center;margin-top:6px}
.dg-hp i{width:14px;height:10px;border-radius:3px;background:#4A4163;border:1px solid #120F1C}
.dg-hp i.on{background:#E5533A}
.dg-fact{font-family:var(--display);font-weight:800;font-size:clamp(3rem,11vw,5.2rem);line-height:1;color:#FFFFFF;text-shadow:4px 4px 0 #120F1C;min-height:1.1em}
.dg-fact.pop{animation:popin .25s cubic-bezier(.2,1.5,.4,1)}
.dg-fact.banner{color:#FFE7A3;font-size:clamp(2rem,7vw,3.2rem)}
.dg-timer{width:min(100%,520px);height:16px;border:2px solid #120F1C;border-radius:999px;background:#1A1626;overflow:hidden}
.dg-timer i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#FFD43B,#FF9A2E)}
.dg-timer i.low{background:#FF4D6D}
.dg-input{font:800 2.4rem var(--body);width:min(100%,260px);text-align:center;padding:.3rem;border:3px solid #FFD43B;border-radius:var(--r-m);background:#120F1C;color:#FFFFFF;letter-spacing:.08em}
.dg-flash{min-height:1.6em;font-weight:700;font-size:1.25rem}
.dg-flash.good{color:#8FF0A4}.dg-flash.bad{color:#FF8A9A}
.dungeon-run.hurt{animation:shake .3s}
.dg-pad{width:min(100%,320px);grid-template-columns:repeat(3,1fr)}
.dg-pad.show{display:grid}
.dg-pad [data-dk="0"]{grid-column:2}
.dg-pad [data-dk="back"]{grid-column:1;grid-row:4}
.dg-stats div{border-top-color:#4A4163}
.dg-stats b{color:#FFE7A3}
.dg-new{color:#8FF0A4;font-weight:700}
.dg-guard.resident{width:min(50vw,210px)}
.dg-hp.catch i.on{background:#FFD43B}
.dungeon-run.catching .dg-floor{color:#8FF0A4}
.dg-encounter{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center;background:rgba(18,15,28,.7);border:2px solid #FFD43B;border-radius:var(--r-m);padding:14px;margin:14px 0;position:relative}
.dg-encounter .result-msg{color:#FFE7A3}
.dg-encounter .small{color:#E3DCF5}
.dg-enc-art{width:150px}
.dg-catchmsg{color:#8FF0A4}
@media (max-width:640px){.dg-hero{grid-template-columns:1fr}.dg-hero .torch{display:none}.dg-encounter{grid-template-columns:1fr;justify-items:center;text-align:center}}

/* ---------- shinies ---------- */
.shiny-wrap{position:relative;display:block}
.shiny-wrap .tw{position:absolute;width:16%;aspect-ratio:1;background:#FFF7B8;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);filter:drop-shadow(0 0 3px #FFD43B);animation:twinkle 1.6s ease-in-out infinite;pointer-events:none}
.shiny-wrap .tw:nth-of-type(1){left:6%;top:14%}
.shiny-wrap .tw:nth-of-type(2){right:8%;top:30%;animation-delay:.55s}
.shiny-wrap .tw:nth-of-type(3){left:30%;bottom:10%;animation-delay:1.1s;width:11%}
.mini .shiny-wrap .tw,.q-art .shiny-wrap .tw{display:none}
.chip.shiny-chip{background:linear-gradient(90deg,#FFD43B,#FF9AD5,#8FD5F2);color:#1B2848}
.shiny-star{color:#F2B731;margin-right:.15em}
.shiny-scene::before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;background:radial-gradient(circle at 20% 30%,#fff 0 2px,transparent 3px),radial-gradient(circle at 75% 22%,#fff 0 2px,transparent 3px),radial-gradient(circle at 62% 70%,#FFF3A8 0 2px,transparent 3px),radial-gradient(circle at 35% 62%,#fff 0 1.5px,transparent 2.5px);animation:pulse 1.4s ease-in-out infinite}
.tile.has-shiny{position:relative}
.shiny-badge{position:absolute;right:6px;top:4px;color:#F2B731;font-size:1rem;text-shadow:0 0 4px #FFE27A}
.shiny-row{display:grid;grid-template-columns:72px 1fr;gap:12px;align-items:center;border-top:2px dashed var(--line);padding-top:10px;margin-top:10px}

/* ---------- evolution ---------- */
.evo-tag{display:inline-block;margin-top:3px;font-size:.72rem;font-weight:700;background:var(--hl);color:var(--hl-ink);border:2px solid var(--line);border-radius:999px;padding:0 .5em;animation:pulse 1.6s ease-in-out infinite}
.evo-line{border-top:2px dashed var(--line);padding-top:10px;margin-top:10px}
.track{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:12px 0}
.slot-q{width:38px;height:38px;border-radius:10px;border:2px solid var(--line);display:grid;place-items:center;font-weight:700;color:var(--pencil);background:var(--card-2)}
.slot-q.ok{background:var(--good);border-color:var(--good);color:#fff}
.slot-q.miss{background:var(--bad);border-color:var(--bad);color:#fff}
.track .need{font-size:.85rem;font-weight:700;margin-left:6px}
.pip.off{background:var(--bad);border-color:var(--bad)}
.stage.duo{display:flex;align-items:flex-end;justify-content:center;gap:4%;width:min(80%,420px)}
.stage.duo .foe{width:42%}
.stage.duo .arrow{font-size:2.4rem;font-weight:800;color:#1B2848;align-self:center}
.mystery .art{color:#1B2848;opacity:.75}
.evo-stage{width:min(56%,280px)}
.evo-stage .foe{position:absolute;inset:auto 0 0 0}
.evo-stage .evo-new{position:relative}
.rays{position:absolute;left:50%;top:50%;width:260%;aspect-ratio:1;transform:translate(-50%,-50%);background:repeating-conic-gradient(rgba(255,236,140,.55) 0 10deg,transparent 10deg 20deg);border-radius:50%;mask:radial-gradient(circle,#000 20%,transparent 65%);-webkit-mask:radial-gradient(circle,#000 20%,transparent 65%);animation:spin 9s linear infinite;pointer-events:none}
.evo-old .art{animation:evoout 1.6s ease-in forwards}
.evo-stage .evo-new .art{animation:evoin 1s 1.3s cubic-bezier(.2,1.5,.4,1) both}
.evo-stage .evo-new.bob .art{animation:bob 2.6s ease-in-out infinite}
@keyframes evoout{0%{filter:brightness(1)}30%,50%,70%{filter:brightness(3) saturate(0);transform:scale(1.08)}40%,60%{filter:brightness(1.6);transform:scale(.96)}100%{filter:brightness(4) saturate(0);transform:scale(.4);opacity:0}}
@keyframes evoin{from{filter:brightness(4) saturate(0);transform:scale(.3);opacity:0}60%{filter:brightness(2)}to{filter:none;transform:none;opacity:1}}
.gain{color:var(--good);font-weight:700}
.statrow:has(.gain){grid-template-columns:5.5em 2.6em 1fr}

/* ---------- themed encounter scene ---------- */
.enc{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;align-items:stretch}
.scene{position:relative;min-height:clamp(330px,52vh,460px);border:2px solid var(--line);border-radius:var(--r-l);overflow:hidden;box-shadow:0 4px 0 var(--line);isolation:isolate}
.scenery{position:absolute;inset:0;width:100%;height:100%;display:block}
.scenery .wave{animation:drift 3s ease-in-out infinite alternate}
.rapid{animation:rush 1.1s linear infinite}
@keyframes drift{to{transform:translateX(8px)}}
@keyframes rush{from{transform:translateX(-6px);opacity:.3}50%{opacity:1}to{transform:translateX(10px);opacity:.3}}
.scene-tag{position:absolute;left:12px;top:12px;z-index:2;background:rgba(255,255,255,.9);color:#1B2848;border:2px solid #1B2848;border-radius:999px;padding:.1em .7em;font-weight:600;font-size:.88rem}
.scene-tag.right{left:auto;right:12px}
.stage{position:absolute;left:50%;bottom:9%;width:min(48%,240px);transform:translateX(-50%);z-index:1}
.plat{position:absolute;left:-6%;right:-6%;bottom:-2%;height:20%;border-radius:50%;background:rgba(80,50,10,.22);box-shadow:inset 0 -5px 0 rgba(0,0,0,.08)}
.foe{position:relative}
.scene.enter .foe .art{animation:popin .55s cubic-bezier(.2,1.5,.4,1) both}
@keyframes popin{from{transform:translateY(40%) scale(.5);opacity:0}}
.foe.captured .art{animation:capture .7s ease-in forwards}
@keyframes capture{40%{transform:scale(1.1)}to{transform:translateY(-30%) scale(.05) rotate(200deg);opacity:0}}
.foe.flee .art{animation:flee 1s ease-in forwards}
@keyframes flee{25%{transform:translate(18%,-14%)}50%{transform:translate(40%,0)}75%{transform:translate(70%,-12%)}to{transform:translate(160%,0);opacity:0}}
.ring{position:absolute;left:50%;top:48%;width:112%;aspect-ratio:1;transform:translate(-50%,-50%);pointer-events:none;filter:drop-shadow(0 0 4px rgba(255,214,59,.8));overflow:visible}
.ring g{transform-origin:50px 50px;animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.shine::after{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;background:radial-gradient(circle at 50% 70%,rgba(255,236,140,.55),transparent 55%);animation:pulse 2.2s ease-in-out infinite}
.shine.r5::after{background:radial-gradient(circle at 50% 70%,rgba(255,215,90,.8),rgba(190,140,255,.35) 40%,transparent 65%)}
@keyframes pulse{50%{opacity:.45}}
.dexcard{position:absolute;left:50%;top:50%;z-index:3;width:170px;background:#fff;color:#1B2848;border:3px solid #1B2848;border-radius:16px;padding:10px 10px 12px;text-align:center;display:grid;justify-items:center;gap:2px;box-shadow:0 6px 0 #1B2848;transform:translate(-50%,-50%) rotate(-4deg);animation:cardin .55s .55s cubic-bezier(.2,1.5,.4,1) both}
.dexcard .art-wrap{width:110px}
.dexcard b{font-family:var(--display);font-size:1.3rem}
.dexcard .dexno{color:#4F5E79}
.dexcard .stamp{right:-16px;top:auto;bottom:-16px;animation-delay:1.05s}
@keyframes cardin{from{transform:translate(-50%,-30%) rotate(-30deg) scale(.2);opacity:0}}
.enc-info{display:flex;flex-direction:column;justify-content:center}
.q-art{width:54px;flex:none}
.q-head{justify-content:flex-start}
.q-head .pips{margin-left:auto}
.overlay.low,.overlay.side{align-items:end;background:rgba(9,15,30,.32)}
@media (min-width:1000px){
  .overlay.side{display:flex;align-items:center;justify-content:flex-end;padding-right:max(16px,calc((100vw - 940px) / 2))}
  .overlay.side .sheet{width:min(100%,480px)}
}
.overlay.qt-isles .sheet{border-top:10px solid #46AEDD}
.overlay.qt-rapids .sheet{border-top:10px solid #3E9C4D}

/* ---------- math support and skills ---------- */
.q-teks{font-size:.78rem}

.skill-row.sel{border-color:var(--line);background:color-mix(in srgb,var(--hl) 30%,var(--card))}
.skill-name{font-weight:600;font-size:.92rem}

@media (max-width:640px){.skill-row{grid-template-columns:1fr 7em}.skill-bar{grid-column:1 / -1;grid-row:2}}

/* ---------- town and quests ---------- */
.viewport.mt-town{background:#2E7D3E}
.qobj{position:absolute;pointer-events:none;z-index:2}
.qobj svg{width:100%;height:100%;display:block;overflow:visible}

.hud-track{cursor:pointer;text-align:left;font:inherit;color:inherit;max-width:100%}

.quest-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-top:10px}
.quest-card{border:2px solid var(--line);border-radius:var(--r-m);padding:12px 14px;background:var(--card-2)}

.quest-top{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.trainer-title{display:inline-block;margin-left:8px;font-size:.85rem;font-weight:700;background:var(--hl);color:var(--hl-ink);border-radius:999px;padding:.05em .7em;vertical-align:middle}

/* ---------- inequality and multiple-choice answers ---------- */
.var{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-weight:700}

.lang-switch{display:inline-flex;border:2px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
.lang-switch button{border:0;background:transparent;color:var(--ink);font:700 .78rem var(--body);padding:.3em .7em;cursor:pointer;min-height:32px}

.lang-switch button[aria-pressed="true"]{background:var(--hl);color:var(--hl-ink)}
.q-head .lang-switch{margin-left:auto}

/* ---------- characters and the wardrobe ---------- */
.avatar{display:block;overflow:visible}
.player svg.avatar{width:100%;height:auto;margin-top:calc(var(--t) * -.0625)}
@keyframes av-step-a{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.2px)}}
@keyframes av-step-b{0%,100%{transform:translateY(-1.2px)}50%{transform:translateY(0)}}
@keyframes av-swing-a{0%,100%{transform:rotate(16deg)}50%{transform:rotate(-16deg)}}
@keyframes av-swing-b{0%,100%{transform:rotate(-16deg)}50%{transform:rotate(16deg)}}
@keyframes av-arm-a{0%,100%{transform:translateY(0)}50%{transform:translateY(.9px)}}
@keyframes av-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-.6px)}}
@keyframes av-flame{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.6)}}
.avatar .av-lgL,.avatar .av-lgR,.avatar .av-lgF,.avatar .av-lgB,.avatar .av-amF,.avatar .av-amL,.avatar .av-amR,.avatar .av-flame{transform-box:fill-box;transform-origin:50% 0}
.walking .av-lgL{animation:av-step-a .3s linear infinite}.walking .av-lgR{animation:av-step-b .3s linear infinite}
.walking .av-lgF{animation:av-swing-a .3s ease-in-out infinite}.walking .av-lgB{animation:av-swing-b .3s ease-in-out infinite}
.walking .av-amF{animation:av-swing-b .3s ease-in-out infinite}.walking .av-amL{animation:av-arm-a .3s linear infinite}.walking .av-amR{animation:av-arm-a .3s linear infinite reverse}
.walking-demo > g{animation:av-bob 1.6s ease-in-out infinite}
.avatar .av-flame{animation:av-flame .25s linear infinite}
@media (prefers-reduced-motion: reduce){.walking *, .walking-demo > g, .avatar .av-flame{animation:none!important}}
.wardrobe{display:grid;grid-template-columns:minmax(240px,320px) 1fr;gap:16px;align-items:start}
@media (max-width:760px){.wardrobe{grid-template-columns:1fr}}
.w-preview{display:grid;justify-items:center;gap:6px;background:radial-gradient(ellipse at 50% 85%,color-mix(in srgb,var(--hl) 40%,transparent) 0 35%,transparent 36%),linear-gradient(#DDEFFB,#F4F9FF);border:2px solid var(--line);border-radius:var(--r-m);padding:14px 10px 8px}
.w-big svg{width:150px;height:auto}
.w-turn{display:flex;gap:10px}.w-turn svg{width:44px;height:auto}
.w-redeem{display:grid;gap:6px;margin-top:12px}
.w-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.w-tabs button{border:2px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);font:700 .9rem var(--body);padding:.35em .9em;cursor:pointer;display:flex;gap:6px;align-items:baseline}
.w-tabs button[aria-selected="true"]{background:var(--hl);color:var(--hl-ink)}
.w-tabs small{font-weight:600;opacity:.75}
.w-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.w-item{position:relative;display:grid;justify-items:center;gap:4px;border:2px solid var(--line);border-radius:var(--r-m);background:var(--card-2);color:var(--ink);padding:8px 6px;cursor:pointer;font:600 .8rem var(--body);text-align:center}
.w-item.on{background:color-mix(in srgb,var(--hl) 35%,var(--card));box-shadow:0 0 0 3px var(--hl)}
.w-item.locked{background:var(--card)}
.w-item.locked .w-thumb{filter:grayscale(1) brightness(.35) opacity(.55)}
.w-thumb svg{width:64px;height:auto}
.w-lock{position:absolute;top:8px;right:8px;font-size:1rem}
.w-how{font-weight:400;font-size:.72rem;color:var(--pencil);line-height:1.25}
.w-new{position:absolute;top:6px;left:6px;background:var(--bad);color:#fff;border-radius:999px;font-size:.68rem;padding:.05em .5em}
.swatch{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:var(--sw);cursor:pointer;box-shadow:0 2px 0 var(--line)}
.swatch[aria-pressed="true"]{outline:3px solid var(--hl);outline-offset:2px}
.swatch.none{background:repeating-linear-gradient(45deg,var(--card) 0 5px,var(--grid-major) 5px 7px)}
.hair-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:8px}
.w-hair{display:grid;justify-items:center;border:2px solid var(--line);border-radius:var(--r-m);background:var(--card-2);color:var(--ink);font:600 .75rem var(--body);padding:4px;cursor:pointer;overflow:hidden}
.w-hair span{height:40px;overflow:hidden;display:block}.w-hair svg{width:52px;height:auto;margin-top:-2px}
.w-hair[aria-pressed="true"]{box-shadow:0 0 0 3px var(--hl);background:color-mix(in srgb,var(--hl) 30%,var(--card))}
.w-right h3,.creator-controls h3{margin:12px 0 6px;font-size:1rem}
.creator{display:grid;grid-template-columns:200px 1fr;gap:16px;align-items:start}
@media (max-width:640px){.creator{grid-template-columns:1fr}}
.creator .w-big svg{width:120px}
.look-row{display:flex;align-items:center;gap:14px;margin:8px 0 12px}.look-av svg{width:64px;height:auto}
.card-top{display:flex;gap:14px;align-items:center}.card-av svg{width:76px;height:auto}
.vs-banner .trainer-face svg{width:100%;height:auto}
.w-dot{width:9px;height:9px;border-radius:50%;background:var(--bad);display:inline-block;align-self:center}

/* ---------- ambient life on the maps (its own layer, so the map itself never repaints) ---------- */
#amb{position:absolute;inset:0;pointer-events:none;z-index:5;overflow:hidden}
#amb i{position:absolute;display:block;will-change:transform}
.cloud-sh{left:0;height:22%;border-radius:50%;background:radial-gradient(closest-side,rgba(10,25,50,.16),rgba(10,25,50,0));animation:cloud-drift 80s linear infinite}
@keyframes cloud-drift{from{transform:translateX(-60%)}to{transform:translateX(320%)}}
.bfly{width:calc(var(--t) * .38);height:calc(var(--t) * .3);animation:bfly-path 14s ease-in-out infinite}
.bfly b{position:absolute;top:0;width:50%;height:100%;border-radius:60% 60% 40% 40%;background:#FFB347;border:1px solid #8A4B12;transform-origin:100% 50%;animation:flap .28s ease-in-out infinite alternate}
.bfly b + b{left:50%;transform-origin:0 50%;animation-direction:alternate-reverse}
.bfly.b1 b{background:#9EC8FF;border-color:#2D5C99}.bfly.b2 b{background:#FFFFFF;border-color:#7B8494}
@keyframes flap{from{transform:scaleX(1)}to{transform:scaleX(.25)}}
@keyframes bfly-path{0%{transform:translate(0,0)}25%{transform:translate(calc(var(--t) * 2.2),calc(var(--t) * -1))}50%{transform:translate(calc(var(--t) * 3.4),calc(var(--t) * .8))}75%{transform:translate(calc(var(--t) * 1.2),calc(var(--t) * 1.6))}100%{transform:translate(0,0)}}
.gull{left:0;width:calc(var(--t) * .7);height:calc(var(--t) * .3);animation:gull-fly 30s linear infinite}
.gull::before,.gull::after{content:"";position:absolute;top:30%;width:52%;height:60%;border-top:2.5px solid #F4F7FA;border-radius:50% 50% 0 0}
.gull::before{left:0}.gull::after{right:0}
@keyframes gull-fly{from{transform:translateX(-10vw) translateY(0)}50%{transform:translateX(60vw) translateY(calc(var(--t) * .8))}to{transform:translateX(130vw) translateY(0)}}
.wind{left:0;width:calc(var(--t) * 1.6);height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);animation:wind-blow 8s linear infinite}
@keyframes wind-blow{0%{transform:translateX(-20vw);opacity:0}10%{opacity:1}60%{opacity:.8}100%{transform:translateX(120vw);opacity:0}}
@media (prefers-reduced-motion: reduce){#amb{display:none}}

/* ---------- battle and encounter platforms (Prodigy-style), colored by biome ---------- */
.scene, .arena{--pt:#9FD27E;--pt-hi:#C4E8A8;--pt-lo:#78B25C;--ps:#6B4A2A}
.scene-isles, .arena.theme-isles{--pt:#F2DFA8;--pt-hi:#FFF4D2;--pt-lo:#D6BB7A;--ps:#B08A50}
.scene-rapids, .arena.theme-rapids{--pt:#7CC46A;--pt-hi:#A6DE8E;--pt-lo:#5DA64F;--ps:#6B4A2A}
.scene-bluffs, .arena.theme-bluffs{--pt:#CFC5B3;--pt-hi:#EDE6D8;--pt-lo:#A99E8A;--ps:#7E766A}
.plat, .plat-wrap::before{background:radial-gradient(ellipse at 45% 30%,var(--pt-hi) 0 22%,var(--pt) 55%,var(--pt-lo) 100%);
  border:2px solid rgba(27,40,72,.55);box-shadow:0 7px 0 var(--ps),0 7px 0 2px rgba(27,40,72,.5),0 16px 18px rgba(0,0,0,.28)}
.plat{bottom:0;height:22%}
.plat-wrap::before{left:4%;right:4%;bottom:0;height:22%}
.plat-wrap > .art, .plat-wrap > img, .plat-wrap > .art-img{position:relative;z-index:1}
.plat::after, .plat-wrap::after{content:"";position:absolute;left:18%;right:40%;top:16%;height:22%;border-radius:50%;background:rgba(255,255,255,.35);pointer-events:none}
.plat-wrap::after{bottom:13%;top:auto;height:4%;z-index:0}

/* =====================================================================
   GAME LOOK: richer panels, buttons, bars, navigation, and title screen.
   These rules sit at the end so they layer on top of the basics above.
   ===================================================================== */
:root{--shine:rgba(255,255,255,.55);--panel-shadow:0 5px 0 var(--line),0 10px 22px rgba(15,30,60,.12)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--shine:rgba(255,255,255,.10);--panel-shadow:0 5px 0 #0B1426,0 10px 22px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--shine:rgba(255,255,255,.10);--panel-shadow:0 5px 0 #0B1426,0 10px 22px rgba(0,0,0,.35)}
/* panels */
.panel{background:linear-gradient(180deg,var(--card) 0,var(--card) 60%,var(--card-2) 100%);box-shadow:var(--panel-shadow),inset 0 2px 0 var(--shine)}
.panel h3{display:flex;align-items:center;gap:8px}
.panel > h3:first-child::before,.panel > .t-bar h3::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--hl);border:2px solid var(--line);transform:rotate(45deg);flex:none}
/* buttons: glossy top, deeper press */
.btn{background-image:linear-gradient(180deg,var(--shine) 0,rgba(255,255,255,0) 55%);transition:transform .08s ease,box-shadow .08s ease,filter .15s}
.btn:hover:not([disabled]){filter:brightness(1.04)}
.btn.primary{background-color:var(--hl);background-image:linear-gradient(180deg,#FFF0A8 0,#FFD43B 55%,#F2B731 100%);color:var(--hl-ink)}
.btn.ghost{background-image:none}
/* headings with a game-style offset shadow */
.page-head h2{text-shadow:3px 3px 0 color-mix(in srgb,var(--hl) 85%,transparent)}
/* health and XP bars: glossy fill with a stripe of shine */
.hpbar,.xpbar{background:linear-gradient(180deg,rgba(0,0,0,.12),rgba(0,0,0,0) 60%),var(--card-2);height:14px}
.hpbar i,.xpbar i{position:relative;background-image:linear-gradient(180deg,rgba(255,255,255,.45) 0,rgba(255,255,255,0) 50%,rgba(0,0,0,.12) 100%)}
.hpbar i{background-color:#2FB566}.hpbar.mid i{background-color:#F2B731}.hpbar.low i{background-color:#E04848}
.xpbar i{background-color:#3D8DE0}
.hpcard{background:linear-gradient(180deg,var(--card),var(--card-2));box-shadow:0 4px 0 var(--line),inset 0 2px 0 var(--shine)}
/* chips get a little depth */
.chip{box-shadow:inset 0 -2px 0 rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.35)}
/* bottom navigation: a raised tray with a lifted active button */
.nav{background:linear-gradient(180deg,var(--card) 0,var(--card-2) 100%);box-shadow:0 -6px 16px rgba(15,30,60,.10)}
.nav button{transition:transform .12s ease,background .12s}
.nav button[aria-current="page"]{background-image:linear-gradient(180deg,#FFF0A8 0,#FFD43B 60%,#F2B731 100%);box-shadow:0 3px 0 var(--line);transform:translateY(-3px)}
.nav button:not([aria-current="page"]):hover{background:color-mix(in srgb,var(--hl) 25%,transparent)}
/* map frame and heads-up boxes */
.viewport{border-width:3px;box-shadow:0 5px 0 var(--line),0 12px 26px rgba(15,30,60,.18),inset 0 0 0 3px rgba(255,255,255,.35)}
.hud-box{border-radius:999px;background:linear-gradient(180deg,var(--card),var(--card-2));box-shadow:0 3px 0 var(--line),inset 0 2px 0 var(--shine)}
.hud-box.quest{background-image:linear-gradient(180deg,#FFF0A8,#FFD43B 60%,#F2B731)}
.hud-track{border-radius:var(--r-m)}
/* scenes and arenas get the same framed look as the map */
.scene,.arena{border-width:3px;box-shadow:0 5px 0 var(--line),0 12px 26px rgba(15,30,60,.18)}
/* toasts */
.toast{box-shadow:0 4px 0 #0B1426,0 8px 18px rgba(0,0,0,.25);border:2px solid rgba(255,255,255,.25)}
/* title screen: a shining logo and drifting math symbols */
.logo span{background:linear-gradient(180deg,var(--ink) 0 55%,color-mix(in srgb,var(--ink) 70%,var(--tide)) 100%);-webkit-background-clip:text;background-clip:text}
.title{position:relative;isolation:isolate}
.title::before{content:"+ − × ÷ = % ½ ≤ ≥ x";position:absolute;inset:-10px -20px auto;z-index:-1;font:800 2.6rem var(--display);letter-spacing:1.6em;line-height:2.4;color:color-mix(in srgb,var(--tide) 22%,transparent);white-space:normal;word-spacing:1.2em;text-align:center;animation:float-symbols 16s ease-in-out infinite alternate;pointer-events:none}
@keyframes float-symbols{from{transform:translateY(0) rotate(-1deg)}to{transform:translateY(-14px) rotate(1deg)}}
@media (prefers-reduced-motion: reduce){.title::before{animation:none}}

</style>

<!-- Numlings: the whole game in one file. Teacher settings (CONFIG) are in the first script below. -->
<script>/* ===== config.js ===== */
/* Numlings: TEACHER SETTINGS. Edit the values below to tune the game for your class. */
'use strict';
/* =========================================================================
   NUMLINGS — teacher settings. Edit these, then re-upload the file.
   ========================================================================= */
const CONFIG = {
  // Set a zone to false to lock it for every student (e.g. until you teach that unit).
  zones: { isles: true, rapids: true, bluffs: true },
  // Seconds for battle (crit + guard) questions, by difficulty tier.

<script>/* ===== util.js ===== */
/* Numlings: small math and HTML helpers used everywhere */
'use strict';
/* ========================= small helpers ========================= */
const MINUS = '\u2212';
const $ = (s, el = document) => el.querySelector(s);
const ri = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const pick = a => a[Math.floor(Math.random() * a.length)];
const nz = (a, b) => { let v = 0; while (v === 0) v = ri(a, b); return v; };
const nzBig = (a, b) => { let v = 0; while (Math.abs(v) < 2) v = ri(a, b); return v; }; // no 0, 1, -1
const sgn = () => (Math.random() < 0.5 ? -1 : 1);
const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) [a, b] = [b, a % b]; return a || 1; };
const lcm = (a, b) => Math.abs(a * b) / gcd(a, b);
const round2 = n => Math.round(n * 100) / 100;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function num(n) {
  const r = Math.round(n * 1e4) / 1e4;
  return (r < 0 ? MINUS : '') + String(Math.abs(r));
}
const paren = n => (n < 0 ? `(${num(n)})` : num(n));
const money = n => (n < -0.0001 ? MINUS : '') + '$' + Math.abs(round2(n)).toFixed(2);
function simp(n, d) { if (d < 0) { n = -n; d = -d; } const g = gcd(n, d); return [n / g, d / g]; }
const terminates = d => { while (d % 2 === 0) d /= 2; while (d % 5 === 0) d /= 5; return d === 1; };
function fracHTML(n, d) {
  [n, d] = simp(n, d);
  if (d === 1) return num(n);
  return `${n < 0 ? MINUS : ''}<span class="fr"><span class="fn">${Math.abs(n)}</span><span class="fd">${d}</span></span>`;
}
const pfracHTML = (n, d) => (n < 0 ? `(${fracHTML(n, d)})` : fracHTML(n, d));
function mixedHTML(n, d) {
  [n, d] = simp(n, d);
  const a = Math.abs(n), w = Math.floor(a / d), r = a % d;
  if (d === 1 || w === 0) return fracHTML(n, d);
  return `${n < 0 ? MINUS : ''}${w}<span class="fr"><span class="fn">${r}</span><span class="fd">${d}</span></span>`;
}
const raw = (n, d) => `${n < 0 ? MINUS : ''}${Math.abs(n)}/${d}`;
const praw = (n, d) => (n < 0 ? `(${raw(n, d)})` : raw(n, d));
function fracText(n, d) {
  [n, d] = simp(n, d);
  if (d === 1) return num(n);
  let s = raw(n, d);
  const a = Math.abs(n);
  if (a > d) s += ` (or ${n < 0 ? MINUS : ''}${Math.floor(a / d)} ${a % d}/${d})`;
  else if (terminates(d)) s += ` (or ${num(n / d)})`;
  return s;
}
function signRule(a, b) {
  return (a < 0) === (b < 0) ? 'Same signs give a positive answer.' : 'Different signs give a negative answer.';
}

</script>

    if (v === 'down') face = `<ellipse cx="13.3" cy="11" rx="1.05" ry="1.35" fill="${AV_INK}"/><ellipse cx="18.7" cy="11" rx="1.05" ry="1.35" fill="${AV_INK}"/><circle cx="13.65" cy="10.5" r=".38" fill="#FFFFFF"/><circle cx="19.05" cy="10.5" r=".38" fill="#FFFFFF"/>
      <ellipse cx="11.5" cy="13.3" rx="1.3" ry=".7" fill="#F28B8B" opacity=".45"/><ellipse cx="20.5" cy="13.3" rx="1.3" ry=".7" fill="#F28B8B" opacity=".45"/><path d="M14.9 14 q1.1 .9 2.2 0" stroke="${AV_INK}" stroke-width=".9" fill="none" stroke-linecap="round"/>`;
  }

  const arms = v === 'side' ? arm(14.9, 'av-amF', O.top, skin) : arm(8.1, 'av-amL', O.top, skin) + arm(21, 'av-amR', O.top, skin);
  const shadow = `<ellipse cx="16" cy="30.6" rx="7.6" ry="1.8" fill="#000" opacity=".2"/>`;
  if (v === 'up') {
    return `<g${flip}>${shadow}${legs(O.bottom, O.shoes, skin, 'up')}${torso(O.top, 'up', skin)}${arms}${accFront(O.acc, 'up')}
      ${head}${hairUp(L0.hair, hc)}${faceAcc(O.acc, 'up')}${headphones(O.acc, 'up')}${hat(O.hat, 'up')}</g>`;

// the player, townspeople, and trainers

function npcAvatarParts(id, cap, shirt) {

const npcAvatar = (id, cap, shirt, dir = 'down', cls) => { const p = npcAvatarParts(id, cap, shirt); return avatarSVG(p.look, p.outfit, dir, cls); };

<script>/* ===== terrain.js ===== */
/* Numlings: the terrain artist. Draws each map tile with texture, shading, and biome details,
   plus soft lighting over the map and a separate ambient layer (cloud shadows, butterflies, gulls).
   Nothing inside the map picture animates except what was already there, so Chromebooks only paint it once;
   moving things live in the ambient layer, which the browser can slide around cheaply. */
'use strict';
const TINK = '#1B2848';
const PATHY = ch => ch === ',' || ch === '=' || ch === 'H' || ch === '@' || ch === 'E';
const WATERY = ch => ch === '~' || ch === '=' || ch === 'H' || ch === 'o';

/* ---------- small pieces ---------- */
const tuft = (x, y, c) => `<path d="M${x - 2.4} ${y} l1 -3.6 l1.2 3.6 l1.1 -4.4 l1.1 4.4" fill="none" stroke="${c}" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round"/>`;
function flower(x, y, c, s = 1) {
  const p = [0, 72, 144, 216, 288].map(a => { const r = a * Math.PI / 180; return `<circle cx="${(x + Math.cos(r) * 2.1 * s).toFixed(2)}" cy="${(y + Math.sin(r) * 2.1 * s).toFixed(2)}" r="${1.6 * s}" fill="${c}"/>`; }).join('');
  return `<g>${p}<circle cx="${x}" cy="${y}" r="${1.2 * s}" fill="#F2B731" stroke="#B57B00" stroke-width=".4"/></g>`;
}
const shell = (x, y) => `<path d="M${x - 3} ${y + 1.6} Q${x} ${y - 3.6} ${x + 3} ${y + 1.6}Z" fill="#FBE3D0" stroke="#C99C7E" stroke-width=".7"/><path d="M${x} ${y + 1.4} V${y - 1.6} M${x - 1.5} ${y + 1.4} L${x - .7} ${y - 1} M${x + 1.5} ${y + 1.4} L${x + .7} ${y - 1}" stroke="#C99C7E" stroke-width=".5"/>`;
const starfish = (x, y) => `<path d="${starPath(x, y, 3.4)}" fill="#F28B6B" stroke="#C25A3C" stroke-width=".6"/>`;
const mushroom = (x, y) => `<rect x="${x - .9}" y="${y - 1.4}" width="1.8" height="3" rx=".6" fill="#F6EBD7" stroke="${TINK}" stroke-width=".5"/><path d="M${x - 3.4} ${y - 1} Q${x} ${y - 6} ${x + 3.4} ${y - 1}Z" fill="#E5533A" stroke="${TINK}" stroke-width=".6"/><circle cx="${x - 1.2}" cy="${y - 2.6}" r=".6" fill="#fff"/><circle cx="${x + 1.2}" cy="${y - 3}" r=".5" fill="#fff"/>`;
const leaf = (x, y, rot, c) => `<ellipse cx="${x}" cy="${y}" rx="2" ry="1" transform="rotate(${rot} ${x} ${y})" fill="${c}" opacity=".85"/>`;

/* ---------- ground, by biome ---------- */
function groundDetail(zone, P, X, Y, r) {
  let d = '';
  if (r % 4 === 0) d += `<ellipse cx="${X + 8 + r % 16}" cy="${Y + 10 + (r >> 3) % 12}" rx="${9 + r % 5}" ry="${5 + r % 3}" fill="${shade(P.ground, r % 8 ? 0.12 : -0.08)}" opacity=".55"/>`;
  if (zone === 'isles') {
    if (r % 3 === 0) d += `<path d="M${X + 4} ${Y + 12 + r % 8} q5 -2.5 10 0 t10 0" stroke="${shade(P.ground, -0.12)}" stroke-width="1" fill="none" stroke-linecap="round"/>`;
    if (r % 17 === 0) d += shell(X + 10 + r % 12, Y + 20);
    else if (r % 29 === 1) d += starfish(X + 16, Y + 16);
    else if (r % 5 === 0) d += `<circle cx="${X + 24 - r % 14}" cy="${Y + 26 - (r >> 5) % 14}" r="1.1" fill="${P.speck}"/>`;
  } else if (zone === 'rapids') {
    if (r % 2) d += tuft(X + 6 + r % 18, Y + 12 + (r >> 4) % 14, shade(P.ground, -0.25));
    if (r % 5 === 0) d += leaf(X + 20 - r % 10, Y + 22 - (r >> 2) % 10, r % 180, ['#D98A3A', '#C46A2E', '#E3B04A'][r % 3]);
    if (r % 31 === 2) d += mushroom(X + 16, Y + 22);
  } else if (zone === 'bluffs') {
    if (r % 4 === 1) d += `<path d="M${X + 6 + r % 10} ${Y + 8 + r % 6} l3 4 l-1 4 l4 3" stroke="${shade(P.ground, -0.22)}" stroke-width=".9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
    if (r % 3 === 0) d += `<ellipse cx="${X + 22 - r % 12}" cy="${Y + 24 - (r >> 3) % 12}" rx="1.8" ry="1.2" fill="${shade(P.rock, 0.15)}" stroke="${shade(P.rock, -0.25)}" stroke-width=".5"/>`;
    if (r % 19 === 3) d += flower(X + 12, Y + 14, '#B79CFF', 0.7) + flower(X + 18, Y + 18, '#FFFFFF', 0.6);
  } else {   // town lawn
    if (r % 2) d += tuft(X + 6 + r % 18, Y + 10 + (r >> 4) % 16, shade(P.ground, -0.18));
    if (r % 13 === 0) d += flower(X + 22 - r % 12, Y + 22, '#FFFFFF', 0.6);
  }
  return d;
}
/* ---------- paths: cobblestone in town, dirt and gravel elsewhere, with soft edges ---------- */
function pathTile(zone, P, x, y, X, Y, r) {
  let d;
  if (zone === 'town') return `<rect x="${X}" y="${Y}" width="32" height="32" fill="url(#cobble)"/>`;
  d = `<rect x="${X}" y="${Y}" width="32" height="32" fill="${P.short}"/>`;
  if (r % 2) d += `<circle cx="${X + 6 + r % 20}" cy="${Y + 8 + (r >> 4) % 18}" r="1.5" fill="${P.short2}"/>`;
  d += `<circle cx="${X + 20 - r % 9}" cy="${Y + 24 - (r >> 5) % 9}" r="1.2" fill="${P.short2}"/><ellipse cx="${X + 12 + r % 9}" cy="${Y + 15}" rx="4" ry="1.6" fill="#FFFFFF" opacity=".12"/>`;
  // soft edge where the path meets grass or ground
  const edge = shade(P.short, -0.18);
  if (!PATHY(T(x, y - 1)) && T(x, y - 1) !== undefined) d += `<path d="M${X} ${Y + 1.5} Q${X + 8} ${Y + 3.5} ${X + 16} ${Y + 1.5} T${X + 32} ${Y + 1.5}" stroke="${edge}" stroke-width="2" fill="none"/>`;
  if (!PATHY(T(x, y + 1)) && T(x, y + 1) !== undefined) d += `<path d="M${X} ${Y + 30.5} Q${X + 8} ${Y + 28.5} ${X + 16} ${Y + 30.5} T${X + 32} ${Y + 30.5}" stroke="${edge}" stroke-width="2" fill="none"/>`;
  if (!PATHY(T(x - 1, y)) && T(x - 1, y) !== undefined) d += `<path d="M${X + 1.5} ${Y} Q${X + 3.5} ${Y + 8} ${X + 1.5} ${Y + 16} T${X + 1.5} ${Y + 32}" stroke="${edge}" stroke-width="2" fill="none"/>`;
  if (!PATHY(T(x + 1, y)) && T(x + 1, y) !== undefined) d += `<path d="M${X + 30.5} ${Y} Q${X + 28.5} ${Y + 8} ${X + 30.5} ${Y + 16} T${X + 30.5} ${Y + 32}" stroke="${edge}" stroke-width="2" fill="none"/>`;
  return d;
}
/* ---------- water: lighter near shore, deeper in the middle ---------- */
function waterTile(zone, P, x, y, X, Y, r) {
  const land = (dx, dy) => { const c = T(x + dx, y + dy); return c !== undefined && !WATERY(c); };
  let near = false, far = true;
  for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) {
    if (!land(dx, dy)) continue;
    if (Math.abs(dx) <= 1 && Math.abs(dy) <= 1) near = true; far = false;
  }
  const c = near ? shade(P.water, 0.16) : far ? shade(P.water, -0.1) : P.water;
  let d = `<rect x="${X}" y="${Y}" width="32" height="32" fill="${c}"/>`;
  if (!near && r % 4 === 0) d += `<ellipse cx="${X + 16}" cy="${Y + 16}" rx="10" ry="6" fill="${shade(P.water, -0.16)}" opacity=".5"/>`;
  for (const [dx, dy, p] of [[0, -1, `M${X} ${Y + 2}h32`], [0, 1, `M${X} ${Y + 30}h32`], [-1, 0, `M${X + 2} ${Y}v32`], [1, 0, `M${X + 30} ${Y}v32`]])
    if (land(dx, dy)) d += `<path d="${p}" stroke="${shade(P.water, 0.35)}" stroke-width="6" opacity=".5"/><path d="${p}" stroke="${P.foam}" stroke-width="2.6" stroke-linecap="round"/>`;
  if (r % 5 === 1) d += `<path d="M${X + 6 + r % 14} ${Y + 8 + (r >> 4) % 14} h5 M${X + 14 + r % 9} ${Y + 20} h3" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity=".55"/>`;
  if (zone === 'rapids') { if (r % 2 === 0) d += `<path class="rapid" d="M${X + 6 + r % 12} ${Y + 4 + (r >> 3) % 8} l3 12" stroke="${P.foam}" stroke-width="2.4" stroke-linecap="round" opacity=".8"/>`;
    if (near && r % 9 === 0) d += `<circle cx="${X + 10 + r % 12}" cy="${Y + 12 + (r >> 2) % 10}" r="4.2" fill="#4FA05A" stroke="#2C6B36" stroke-width=".8"/><path d="M${X + 10 + r % 12} ${Y + 12 + (r >> 2) % 10} l3.6 -2.2" stroke="${c}" stroke-width="1.6"/>`; }
  else if (r % 3 === 0) d += `<path class="wave" d="M${X + 5} ${Y + 10 + r % 12} q4 -3.5 8 0 t8 0" stroke="${P.foam}" stroke-width="2" fill="none" stroke-linecap="round"/>`;
  return d;
}
/* ---------- tall grass ---------- */
function grassTile(P, X, Y, r) {
  let d = `<rect x="${X}" y="${Y}" width="32" height="32" fill="${P.tall}"/><rect x="${X}" y="${Y + 20}" width="32" height="12" fill="${shade(P.tall, -0.12)}" opacity=".6"/>`;
  const back = shade(P.blade, 0.12), front = P.blade, tip = shade(P.tall, 0.3);
  const blade = (bx, by, h, lean) => `M${bx - 2.2} ${by} Q${bx - .4 + lean} ${by - h * .6} ${bx + lean} ${by - h} Q${bx + .8 + lean} ${by - h * .5} ${bx + 2.2} ${by}Z`;
  d += `<path d="${[[6, 13], [17, 11], [27, 14], [11, 21]].map(([bx, by], i) => blade(X + bx + (r >> i) % 3 - 1, Y + by, 9, i % 2 ? 1.6 : -1.6)).join('')}" fill="${back}"/>`;
  d += `<path d="${[[4, 31], [13, 29], [22, 31], [30, 28], [17, 22]].map(([bx, by], i) => blade(X + bx + (r >> (i + 2)) % 3 - 1, Y + by, 11, i % 2 ? -1.8 : 1.8)).join('')}" fill="${front}"/>`;
  d += `<path d="M${X + 8} ${Y + 7} l.8 -2.6 M${X + 19} ${Y + 6} l.8 -2.6 M${X + 26} ${Y + 9} l-.8 -2.6" stroke="${tip}" stroke-width="1.2" stroke-linecap="round"/>`;

/* ---------- bridges ---------- */

  if (horiz) return `<rect x="${X}" y="${Y + 25}" width="32" height="4" fill="#000" opacity=".18"/><rect x="${X}" y="${Y + 6}" width="32" height="20" fill="${plank}"/>`
    + [0, 6.4, 12.8, 19.2, 25.6].map((i, k) => `<rect x="${X + i + .5}" y="${Y + 6}" width="5.6" height="20" fill="${shade(plank, (k % 3 - 1) * 0.06)}"/><path d="M${X + i + .5} ${Y + 6}v20" stroke="${dark}" stroke-width="1.1"/>`).join('')
    + `<path d="M${X} ${Y + 6.5}h32M${X} ${Y + 25.5}h32" stroke="${rail}" stroke-width="2.4"/><rect x="${X + 1}" y="${Y + 3}" width="3" height="5" rx="1" fill="${rail}"/><rect x="${X + 1}" y="${Y + 24}" width="3" height="5" rx="1" fill="${rail}"/>`;
  return `<rect x="${X + 25}" y="${Y}" width="4" height="32" fill="#000" opacity=".18"/><rect x="${X + 6}" y="${Y}" width="20" height="32" fill="${plank}"/>`
    + [0, 6.4, 12.8, 19.2, 25.6].map((i, k) => `<rect x="${X + 6}" y="${Y + i + .5}" width="20" height="5.6" fill="${shade(plank, (k % 3 - 1) * 0.06)}"/><path d="M${X + 6} ${Y + i + .5}h20" stroke="${dark}" stroke-width="1.1"/>`).join('')
    + `<path d="M${X + 6.5} ${Y}v32M${X + 25.5} ${Y}v32" stroke="${rail}" stroke-width="2.4"/>`;

/* ---------- rocks: real cliff walls in a ridge, boulders on their own ---------- */
function rockTile(zone, P, x, y, X, Y, r) {
  const rk = P.rock, top = shade(rk, 0.25), face = shade(rk, -0.12), deep = shade(rk, -0.32);
  const R = (dx, dy) => T(x + dx, y + dy) === 'R';

    d += `<path d="M${X + (l ? 0 : 2)} ${Y + (above ? 0 : 4)} H${X + (rt ? 32 : 30)} V${Y + (below ? 32 : 28)} H${X + (l ? 0 : 2)}Z" fill="${face}" stroke="${TINK}" stroke-width="${l && rt ? 0 : 1.2}"/>`;
    if (!above) d += `<path d="M${X + (l ? 0 : 2)} ${Y + 4} Q${X + 8} ${Y + 1} ${X + 16} ${Y + 3} T${X + (rt ? 32 : 30)} ${Y + 4} V${Y + 11} Q${X + 16} ${Y + 13} ${X + (l ? 0 : 2)} ${Y + 11}Z" fill="${top}"/>
      <path d="M${X + (l ? 0 : 2)} ${Y + 11} Q${X + 16} ${Y + 13} ${X + (rt ? 32 : 30)} ${Y + 11}" stroke="${deep}" stroke-width="1.2" fill="none"/>`;
    d += `<path d="M${X + 7 + r % 5} ${Y + 14} l-1 7 M${X + 17 + r % 4} ${Y + 13} l1 9 M${X + 25 - r % 4} ${Y + 15} l-1 6" stroke="${deep}" stroke-width="1" stroke-linecap="round" opacity=".7"/>`;
    if (!above && zone === 'bluffs' && r % 3 === 0) d += `<path d="M${X + 6} ${Y + 4.4} Q${X + 11} ${Y + 1.6} ${X + 16} ${Y + 3.6} Q${X + 13} ${Y + 6.4} ${X + 6} ${Y + 4.4}Z" fill="#FFFFFF" opacity=".9"/>`;
    if (!above && zone === 'rapids' && r % 2) d += `<path d="M${X + 4} ${Y + 6} q6 -3 12 0 q-6 3 -12 0Z" fill="#5DA85A" opacity=".8"/>`;

  }
  let d = `<ellipse cx="${X + 16}" cy="${Y + 28.5}" rx="13" ry="3" fill="#000" opacity=".18"/>
    <path d="M${X + 4} ${Y + 27} Q${X + 3} ${Y + 12} ${X + 14} ${Y + 8} Q${X + 26} ${Y + 6} ${X + 29} ${Y + 20} Q${X + 30} ${Y + 28} ${X + 4} ${Y + 27}Z" fill="${rk}" stroke="${TINK}" stroke-width="1.4"/>
    <path d="M${X + 7} ${Y + 18} Q${X + 8} ${Y + 11} ${X + 15} ${Y + 10} Q${X + 21} ${Y + 9.6} ${X + 23} ${Y + 14} Q${X + 15} ${Y + 13} ${X + 7} ${Y + 18}Z" fill="${top}" opacity=".9"/>
    <path d="M${X + 6} ${Y + 25} Q${X + 17} ${Y + 28} ${X + 28} ${Y + 23}" stroke="${deep}" stroke-width="1.6" fill="none" opacity=".7"/><path d="M${X + 19} ${Y + 16} l2 4 l-1 3" stroke="${deep}" stroke-width="1" fill="none"/>`;
  if (zone === 'bluffs' && r % 2) d += `<path d="M${X + 9} ${Y + 12} Q${X + 15} ${Y + 6.6} ${X + 23} ${Y + 10} Q${X + 16} ${Y + 11.6} ${X + 9} ${Y + 12}Z" fill="#FFFFFF"/>`;
  if (zone === 'rapids' && r % 2) d += `<path d="M${X + 8} ${Y + 14} q6 -5 13 -3 q-6 3 -13 3Z" fill="#5DA85A"/>`;
  return { tall: d };
}
/* ---------- trees ---------- */
function treeTile(zone, P, X, Y, r) {
  if (P.tree === 'round') {
    const g1 = r % 2 ? '#3E9650' : '#459B57', g0 = shade(g1, -0.2), g2 = shade(g1, 0.22);
    const blossom = r % 5 === 0;
    return `<ellipse cx="${X + 16}" cy="${Y + 30}" rx="12" ry="2.8" fill="#000" opacity=".18"/><path d="M${X + 13.6} ${Y + 30} L${X + 14.2} ${Y + 17} H${X + 17.8} L${X + 18.4} ${Y + 30}Z" fill="#7A4A23" stroke="#4A2C14" stroke-width="1"/>
      <circle cx="${X + 9}" cy="${Y + 12}" r="8" fill="${g0}" stroke="#1C5428" stroke-width="1.3"/><circle cx="${X + 23}" cy="${Y + 12}" r="8" fill="${g0}" stroke="#1C5428" stroke-width="1.3"/>
      <circle cx="${X + 16}" cy="${Y + 6}" r="10" fill="${g1}" stroke="#1C5428" stroke-width="1.3"/><circle cx="${X + 16}" cy="${Y + 13}" r="8" fill="${g1}"/>
      <circle cx="${X + 12}" cy="${Y + 3}" r="4.2" fill="${g2}" opacity=".85"/><circle cx="${X + 20}" cy="${Y + 9}" r="2.2" fill="${g2}" opacity=".6"/>
      ${blossom ? [[10, 7], [20, 4], [15, 12], [23, 13], [8, 14]].map(([a, b]) => `<circle cx="${X + a}" cy="${Y + b}" r="1.4" fill="#F9B4CC" stroke="#D97099" stroke-width=".4"/>`).join('') : ''}`;
  }
  if (P.tree === 'palm') {
    const frond = (dx, dy, rot, c) => `<g transform="rotate(${rot} ${X + 18} ${Y + 4})"><path d="M${X + 18} ${Y + 4} Q${X + 18 + dx * .5} ${Y + 4 + dy - 4} ${X + 18 + dx} ${Y + 4 + dy}" stroke="${c}" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M${X + 18} ${Y + 4} Q${X + 18 + dx * .5} ${Y + 4 + dy - 4} ${X + 18 + dx} ${Y + 4 + dy}" stroke="${shade(c, 0.3)}" stroke-width="1" fill="none"/></g>`;
    const g = '#3E9650';
    return `<ellipse cx="${X + 16}" cy="${Y + 29.5}" rx="11" ry="2.6" fill="#000" opacity=".18"/>
      <path d="M${X + 15} ${Y + 30} Q${X + 12.6} ${Y + 16} ${X + 18} ${Y + 4}" stroke="#7A4A23" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M${X + 15} ${Y + 30} Q${X + 12.6} ${Y + 16} ${X + 18} ${Y + 4}" stroke="#A8743E" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-dasharray="2.4 1.6"/>
      ${frond(-14, 6, 0, shade(g, -0.15))}${frond(14, 6, 0, shade(g, -0.15))}${frond(-11, -2, -20, g)}${frond(11, -2, 20, g)}${frond(0, -10, 0, g)}${frond(-6, 10, 10, shade(g, 0.1))}
      <circle cx="${X + 16.4}" cy="${Y + 7}" r="2.4" fill="#6B4421" stroke="${TINK}" stroke-width=".6"/><circle cx="${X + 20}" cy="${Y + 7.4}" r="2.4" fill="#7A4A23" stroke="${TINK}" stroke-width=".6"/>`;

/* ---------- shared patterns (one cobblestone pattern instead of thousands of stones) ---------- */
function terrainDefs(P) {

function terrainLight(w, h) {

function ambientHTML(zone) {

/* ---------- town pieces ---------- */
function lampPost(X, Y) {

    <rect x="${X + 12}" y="${Y + 27}" width="8" height="3" rx="1" fill="#3B4252" stroke="${TINK}" stroke-width=".8"/>
    <circle cx="${X + 16}" cy="${Y + 2}" r="7" fill="#FFE9A8" opacity=".35"/><path d="M${X + 11.6} ${Y + 4} L${X + 13} ${Y - 3} H${X + 19} L${X + 20.4} ${Y + 4}Z" fill="#FFE27A" stroke="${TINK}" stroke-width="1"/>
    <path d="M${X + 11} ${Y - 3} H${X + 21} L${X + 16} ${Y - 7}Z" fill="#3B4252" stroke="${TINK}" stroke-width=".8"/>`;

function buildingSVG(b, S) {
  const [x0, y0, x1, y1] = b.rect, X = x0 * S, Y = y0 * S, BW = (x1 - x0 + 1) * S, BH = (y1 - y0 + 1) * S, wallTop = Y + Math.min(BH * 0.38, 40);

  for (let ly = wallTop + 7; ly < Y + BH - 4; ly += 7) d += `<path d="M${X + 3} ${ly} H${X + BW - 3}" stroke="${shade(wall, -0.1)}" stroke-width="1"/>`;
  d += `<rect x="${X + 3}" y="${Y + BH - 7}" width="${BW - 6}" height="6" fill="${shade(wall, -0.22)}"/><rect x="${X + 3}" y="${wallTop + 1}" width="${BW - 6}" height="5" fill="#000" opacity=".12"/>`;
  // windows with frames, shutters, and flower boxes

    if (x === b.door[0]) continue;
    const wx = x * S + 8, wy = Y + BH - 27;
    d += `<rect x="${wx - 3}" y="${wy}" width="3" height="13" fill="${roofLo}" stroke="${TINK}" stroke-width=".6"/><rect x="${wx + 16}" y="${wy}" width="3" height="13" fill="${roofLo}" stroke="${TINK}" stroke-width=".6"/>
      <rect x="${wx}" y="${wy}" width="16" height="13" rx="1.5" fill="#9FD4F2" stroke="${TINK}" stroke-width="1.3"/><path d="M${wx + 8} ${wy}v13M${wx} ${wy + 6.5}h16" stroke="${TINK}" stroke-width="1"/>
      <path d="M${wx + 2} ${wy + 5} l4 -3.4" stroke="#FFFFFF" stroke-width="1.4" opacity=".75"/>
      <rect x="${wx - 1}" y="${wy + 13}" width="18" height="3.2" rx="1" fill="#8C5A2E" stroke="${TINK}" stroke-width=".6"/>${[3, 8, 13].map((fx, i) => `<circle cx="${wx + fx}" cy="${wy + 12.6}" r="1.4" fill="${['#FF7A9C', '#FFD43B', '#FFFFFF'][(x + i) % 3]}"/>`).join('')}`;
  }
  // door with a step and a lamp
  d += `<rect x="${dx + 5}" y="${Y + BH - 2}" width="22" height="4" rx="1" fill="#B8BEC9" stroke="${TINK}" stroke-width=".8"/>
    <path d="M${dx + 7} ${Y + BH - 1} V${Y + BH - 22} Q${dx + 16} ${Y + BH - 30} ${dx + 25} ${Y + BH - 22} V${Y + BH - 1}Z" fill="#7A4A23" stroke="${TINK}" stroke-width="1.6"/>
    <path d="M${dx + 16} ${Y + BH - 26} V${Y + BH - 2}" stroke="#5C3412" stroke-width="1"/><circle cx="${dx + 21}" cy="${Y + BH - 12}" r="1.4" fill="#FFD43B"/><circle cx="${dx + 11}" cy="${Y + BH - 12}" r="1.4" fill="#FFD43B"/>`;
  // roof: overhang, shingle rows, ridge highlight, chimney
  const rl = X - 6, rr = X + BW + 6, rt = Y - 6, rb = wallTop + 6, inset = 18;
  d += `<path d="M${rl} ${rb} L${rl + inset} ${rt} H${rr - inset} L${rr} ${rb}Z" fill="${roof}" stroke="${TINK}" stroke-width="2" stroke-linejoin="round"/>`;
  for (let ry = rt + 6; ry < rb - 1; ry += 6) {
    const k = (ry - rt) / (rb - rt), lx = rl + inset * (1 - k), rx = rr - inset * (1 - k);
    d += `<path d="M${lx + 1} ${ry} H${rx - 1}" stroke="${roofLo}" stroke-width="1.2"/>`;
    for (let sx = lx + ((ry / 6) % 2 ? 4 : 8); sx < rx - 2; sx += 8) d += `<path d="M${sx} ${ry} v-5" stroke="${roofLo}" stroke-width=".8" opacity=".6"/>`;
  }
  d += `<path d="M${rl + inset + 2} ${rt + 2.5} H${rr - inset - 2}" stroke="${roofHi}" stroke-width="2.4" stroke-linecap="round"/><path d="M${rl + 2} ${rb - 1} H${rr - 2}" stroke="#000" stroke-opacity=".25" stroke-width="2"/>`;
  if (b.id === 'lab' || b.id === 'home' || b.id === 'gym') d += `<rect x="${X + BW - 30}" y="${rt - 10}" width="9" height="16" fill="#A04A3A" stroke="${TINK}" stroke-width="1.4"/><rect x="${X + BW - 31.5}" y="${rt - 12}" width="12" height="4" fill="#7E3A2E" stroke="${TINK}" stroke-width="1.2"/>`;
  // sign
  const label = LANG === 'es' && b.labelEs ? b.labelEs : b.label;
  d += `<rect x="${X + BW / 2 - label.length * 3.4 - 7}" y="${wallTop - 3}" width="${label.length * 6.8 + 14}" height="14" rx="3" fill="#FFF8E7" stroke="${TINK}" stroke-width="1.4"/>
    <text x="${X + BW / 2}" y="${wallTop + 7.6}" text-anchor="middle" font-size="8.5" font-weight="700" font-family="Lexend, sans-serif" fill="${TINK}">${label}</text>`;
  return d;
}
