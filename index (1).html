    const res = await askQuestion({ topic, tier, skill: sk ? sk.id : null, seconds: 0, allowStop: true, autoMs: 1300,
      title: sk ? skillName(sk) : L(`Training ${name}`, `Entrenando a ${name}`), sub: L(`${streak >= 3 ? `Streak of ${streak}! Bonus XP is on.` : `Streak: ${streak}.`} This session: +${total} XP.`, `${streak >= 3 ? `¡Racha de ${streak}! Tienes XP extra.` : `Racha: ${streak}.`} En esta sesión: +${total} XP.`),
      onResult: (ok, withHint) => {
        if (!ok) { streak = 0; return ''; }
        if (!withHint) streak++;
        const xp = Math.max(1, Math.round(trainXp(tier, c.lv) * (streak >= 3 && !withHint ? 1.5 : 1) * (withHint ? 0.5 : 1)));
        const ups = addXp(c, xp); total += xp;
        return L(` +${xp} XP for ${name}.${ups.length ? ` ${name} reached level ${c.lv}!` : ''}${evoReady(c, ups)}`, ` +${xp} XP para ${name}.${ups.length ? ` ¡${name} llegó al nivel ${c.lv}!` : ''}${evoReadyEs(c, ups)}`);
      } });
    if (res === 'stop') break;
    asked++; if (res === 'correct') right++; if (res === 'assisted') hinted++;
  }
  ctx.summary = asked ? L(`${right + hinted} of ${asked} right${hinted ? ` (${hinted} with a hint)` : ''}. ${name} earned ${total} XP${c.lv > startLv ? ` and went from level ${startLv} to ${c.lv}` : ''}.`,
                         `${right + hinted} de ${asked} correctas${hinted ? ` (${hinted} con pista)` : ''}. ${name} ganó ${total} XP${c.lv > startLv ? ` y subió del nivel ${startLv} al ${c.lv}` : ''}.`) : '';
  save(); render();
}

</script>
<script>/* ===== trial.js ===== */
/* Numlings: evolution trials */
'use strict';
/* ========================= evolution trials ========================= */
const trialCfg = c => (SP[c.n].stage === 2 ? CONFIG.evolution.final : CONFIG.evolution);
const isFinalTrial = c => SP[c.n].stage === 2;
function trialTopic(c) {
  const z = SP[c.n].zone;
  if (ZONES[z]) return ZONES[z].topic;
  return pick(openZones().map(id => ZONES[id].topic)); // starters: any open zone's skills
}
function trialZone(c) { const z = SP[c.n].zone; return ZONES[z] ? z : (openZones()[0] || 'isles'); }
function trialTrack() {
  const c = byUid(ctx.uid), E = ctx.cfg || trialCfg(c), r = ctx.results || [];
  return `<div class="track" aria-label="${r.filter(x => x).length} right, ${r.filter(x => !x).length} missed">${Array.from({ length: E.questions }, (_, i) =>
    `<span class="slot-q ${i < r.length ? (r[i] ? 'ok' : 'miss') : ''}">${i < r.length ? (r[i] ? '✓' : '✗') : i + 1}</span>`).join('')}
    <span class="need">Need ${E.needed}</span></div>`;
}
function statLine(a, b) {
  const rows = [['HP', 'hp'], ['Attack', 'atk'], ['Defense', 'def'], ['Speed', 'spd']];
  return rows.map(([lab, k]) => `<div class="statrow"><span>${lab}</span><b>${b[k]}</b><span class="gain">+${b[k] - a[k]}</span></div>`).join('');
}
function renderTrial() {
  const c = byUid(ctx.uid), E = ctx.cfg || trialCfg(c), zone = trialZone(c);
  const sp = SP[c.n], fin = ctx.cfg ? ctx.cfg === CONFIG.evolution.final : isFinalTrial(c);
  const right = (ctx.results || []).filter(x => x).length;
  let scene = '', panel = '';
  if (ctx.phase === 'evolving' || ctx.phase === 'passed') {
    const before = SP[ctx.fromN];
    scene = `<div class="stage evo-stage"><div class="rays"></div>
      ${ctx.phase === 'evolving' ? `<div class="foe evo-old">${art(before.n, { shiny: c.shiny })}</div>` : ''}
      <div class="foe evo-new ${ctx.phase === 'passed' ? 'bob' : ''}">${artC(c)}</div></div>`;
    panel = ctx.phase === 'evolving' ? `<p class="result-msg">What’s happening to ${before.name}?</p>` :
      `<p class="result-msg">${before.name} evolved into ${sp.name}!</p>${sp.stage === 3 ? '<p><b>Final form reached.</b> This is the strongest a Numling can become.</p>' : ''}
      <p>You got ${right} of ${E.questions} hard problems right. That’s real mastery.</p>
      <div class="stack" style="gap:6px;margin:10px 0">${statLine(ctx.oldStats, stats(c))}</div>
      <p class="small"><b>New signature move:</b> ${sp.move} (${TYPE_LABEL[sp.type]}). It hits harder than ${before.move}.</p>
      ${ctx.xp ? `<p class="small muted">${sp.name} also earned ${ctx.xp} XP during the trial.</p>` : ''}
      <div class="btn-row"><button class="btn primary" data-act="nav" data-to="team">See your team</button><button class="btn" data-act="species" data-n="${sp.n}">Codex entry</button></div>`;
  } else {
    scene = `<div class="stage duo"><div class="foe bob">${artC(c)}</div><span class="arrow" aria-hidden="true">→</span><div class="foe mystery">${art(sp.evo, { sil: true })}</div></div>`;
    if (ctx.phase === 'failed') {
      const short = E.needed - right;
      panel = `<p class="result-msg">${short === 1 ? `${right} of ${E.needed}. So close!` : `${right} of ${E.needed} needed.`}</p>
        <p>${short === 1 ? 'One more right answer and it would have evolved.' : 'These are the hardest problems in the game. Train on Challenge, then try again.'} You can retry as many times as you like, and every attempt brings new problems.</p>
        ${ctx.xp ? `<p class="small muted">${sp.name} still earned ${ctx.xp} XP from this attempt.</p>` : ''}
        ${trialTrack()}
        <div class="btn-row"><button class="btn primary" data-act="trial-start">Try again</button><button class="btn" data-act="train-this">Train first</button><button class="btn ghost" data-act="nav" data-to="team">Back to team</button></div>`;
    } else if (ctx.phase === 'running') {
      panel = `<p class="result-msg">Trial in progress</p><p>${right} right so far.</p>${trialTrack()}`;
    } else {
      panel = `<p class="result-msg">${sp.name} is ready ${fin ? 'for its final evolution' : 'to evolve'}.</p>
        ${fin ? '<p><b>Final trial.</b> Every problem is from the hardest tier, so this one takes real skill.</p>' : ''}
        <p>Prove you’ve mastered ${ZONES[sp.zone] ? ZONES[sp.zone].name : 'your zone'} skills. You’ll get ${E.questions} hard problems with ${E.seconds} seconds each. Get ${E.needed} right and ${sp.name} evolves. The trial ends after ${E.questions - E.needed + 1} misses.</p>
        <p class="small muted">Retry as many times as you need. Every correct answer earns XP, even if the trial doesn’t pass.</p>
        ${trialTrack()}
        <div class="btn-row"><button class="btn primary" data-act="trial-start">Start the trial</button><button class="btn ghost" data-act="nav" data-to="team">Not yet</button></div>`;
    }
  }
  return `<div class="enc theme-${zone}">
    <div class="scene trial-scene">${sceneSVG(zone)}<span class="scene-tag">${fin ? 'Final evolution trial' : 'Evolution trial'}</span>${scene}</div>
    <div class="panel enc-info"><h2 class="enc-name">${ctx.phase === 'evolving' ? SP[ctx.fromN].name : sp.name}</h2>
      <div class="chips" style="margin:6px 0 4px">${typeChip(sp.type)}<span class="chip" style="--c:var(--none)">Level ${c.lv}</span></div>${panel}</div>
  </div>`;
}
async function runTrial() {
  const c = byUid(ctx.uid); if (!c || !canEvolve(c)) { go('team'); return; }
  const E = trialCfg(c), here = ctx, zone = trialZone(c);
  here.cfg = E; here.results = []; here.xp = 0; here.phase = 'running';
  G.stats.trials[0]++; save(); render();
  const maxMiss = E.questions - E.needed;
  while (here.results.length < E.questions) {
    const right = here.results.filter(x => x).length, miss = here.results.length - right;
    if (right >= E.needed || miss > maxMiss) break;
    const i = here.results.length, tier = E.tiers[i] || 3;
    const res = await askQuestion({ topic: trialTopic(c), tier, seconds: E.seconds, theme: zone, side: true, autoMs: 1100, support: false,
      title: E === CONFIG.evolution.final ? L('Final evolution trial', 'Prueba de evolución final') : L('Evolution trial', 'Prueba de evolución'), headArt: artC(c, { label: false }),
      head: `<span class="pips">${Array.from({ length: E.questions }, (_, k) => `<span class="pip ${k < i ? (here.results[k] ? 'on' : 'off') : ''}"></span>`).join('')}</span>`,
      sub: L(`Problem ${i + 1} of ${E.questions}. ${right} right, ${miss} missed. Need ${E.needed}.`, `Problema ${i + 1} de ${E.questions}. ${right} correctas, ${miss} errores. Necesitas ${E.needed}.`),
      onResult: ok => { if (!ok) return ''; const xp = trainXp(tier, c.lv); addXp(c, xp); here.xp += xp; return ` +${xp} XP.`; } });
    if (ctx !== here) return;
    here.results.push(res === 'correct');
    render(); await sleep(300);
  }
  const passed = here.results.filter(x => x).length >= E.needed;
  if (!passed) { here.phase = 'failed'; save(); render(); return; }
  here.fromN = c.n; here.oldStats = stats(c);
  c.n = SP[c.n].evo; G.seen.add(c.n); G.caught.add(c.n); if (c.shiny) G.shinies.add(c.n); G.stats.trials[1]++; questEvent('evolve'); save();
  here.phase = 'evolving'; render();
  await sleep(matchMedia('(prefers-reduced-motion: reduce)').matches ? 300 : 2400);
  if (ctx !== here) return;
  here.phase = 'passed'; render();
}

</script>
<script>/* ===== savepage.js ===== */
/* Numlings: the Save page and trainer card */
'use strict';
/* ========================= save page ========================= */
function renderSave() {
  const s = G.stats, acc = s.answered ? Math.round(s.correct / s.answered * 100) : 0;
  const since = new Date(G.created).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
  const topicRows = Object.keys(ZONES).map(z => {
    const t = ZONES[z].topic, [a, c] = s.topics[t] || [0, 0], p = a ? Math.round(c / a * 100) : 0;
    return `<div class="topicrow"><span>${ZONES[z].name}</span><span class="statbar"><i style="width:${p}%"></i></span><span>${a ? p + '%' : 'None yet'}</span></div>`;
  }).join('');
  return `<div class="page-head"><h2>Save</h2></div>
  <div class="stack">
    <div class="panel"><div class="card-top"><span class="card-av">${playerAvatar('down')}</span><div><h3>${esc(G.trainer)}${G.title ? `<span class="trainer-title">${esc(tx(titleL(G.title)))}</span>` : ''}</h3>
      <button class="btn small" data-act="open-wardrobe">${tx(L('Wardrobe', 'Ropero'))}</button></div></div><span class="small muted">Trainer since ${since}. ${QUESTS.filter(q => isDone(q.id)).length} of ${QUESTS.length} quests complete.</span>
      <div class="card-stats">
        <div><b>${s.correct}</b>problems solved</div><div><b>${acc}%</b>accuracy</div>
        <div><b>${G.caught.size}/${SPECIES.length}</b>codex caught</div><div><b>${s.won}</b>battles won</div>
        <div><b>${G.trainerWins.size}</b>trainers beaten</div>
        <div><b>${SKILLS.filter(k => skillStatus(k.id).cls === 'mastered').length}/${SKILLS.length}</b>skills mastered</div>
        <div><b>${s.trials[1]}/${s.trials[0]}</b>evolution trials passed</div>
        <div><b>${G.creatures.filter(c => c.shiny).length}</b>shinies caught</div></div>
      <div style="margin-top:14px"><b class="small">Dungeon of Multiplia</b><div class="badges">${['easy', 'hard', 'chaos'].map(d => { const r = G.dungeon[d];
        return `<span class="badge ${r.clears ? 'on' : ''}" style="--c:${DG[d].color}"><span class="crest-wrap">${crestSVG(d, r.clears > 0)}</span>${DG[d].label}<small>${r.clears ? `Fastest ${fmtSec(r.fastest)}, ${(r.avg / 10).toFixed(1)} s per fact` : r.best ? `Best: ${r.best} facts` : 'Not yet'}</small></span>`; }).join('')}</div></div>
      <div style="margin-top:14px"><b class="small">Badges</b><div class="badges">${Object.entries(ZONES).map(([id, z]) => `<span class="badge ${G.badges.has(id) ? 'on' : ''}" style="--c:${z.color}"><i aria-hidden="true">★</i>${z.name}<small>${G.badges.has(id) ? 'Earned' : 'Not yet'}</small></span>`).join('')}</div></div>
      <div style="margin-top:14px"><b class="small">Accuracy by zone</b>${topicRows}</div></div>

    ${CONFIG.turnIn && CONFIG.turnIn.url ? `<div class="panel turnin"><h3>Turn in your progress</h3>
      <p>Your teacher uses this to see which skills you’ve mastered. It copies your save code and opens your class form.</p>
      <div class="btn-row"><button class="btn primary" data-act="turn-in">Turn in my progress</button></div></div>` : ''}

    <div class="panel"><h3>${tx(L('Language', 'Idioma'))}</h3>
      <p class="small muted">${bi(L('Choose English, Spanish, or both. With both, every problem, hint, and explanation shows English with Spanish underneath. You can also switch inside any question.', 'Escoge inglés, español o los dos. Con los dos, cada problema, pista y explicación aparece en inglés con el español abajo. También puedes cambiar dentro de cualquier pregunta.'))}</p>
      ${langSwitch()}</div>

    <div class="panel"><h3>Saving on this device</h3>
      ${storageOK ? `<p>Your game saves automatically in this browser on this device.</p>` : `<p><b>This browser can’t save automatically.</b> Copy your save code below before you close the page, or your progress will be lost.</p>`}
      ${storageOK && !lastSaveOK ? '<p class="banner">The last save didn’t go through. Copy your save code to be safe.</p>' : ''}</div>

    <div class="panel"><h3>Play on another device</h3>
      <p>Copy your save code, then on the other device choose <b>I have a save code</b> and paste it. Your code changes as you play, so copy a new one each time you switch.</p>
      ${ctx.showCode ? `<textarea class="codebox" id="codeOut" readonly aria-label="Your save code">${encodeSave(G)}</textarea>
        <div class="btn-row"><button class="btn primary" data-act="copy-code">Copy code</button></div>`
        : `<div class="btn-row"><button class="btn primary" data-act="show-code">Show my save code</button></div>`}</div>

    <div class="panel"><h3>Load a save code</h3><p class="small muted">This replaces the game on this device with the game in the code.</p>
      <textarea class="codebox" id="codeIn" aria-label="Paste a save code" placeholder="Paste a code that starts with NL1."></textarea>
      <div class="btn-row"><button class="btn" data-act="load-code">Load this code</button></div></div>

    <div><button class="btn danger" data-act="reset">Start over with a new game</button></div>
  </div>`;
}
function promptLoadCode() {
  const ov = openModal(`<h2>Load a save code</h2><p>Paste the code you copied from your other device.</p>
    <textarea class="codebox" id="codeModal" aria-label="Save code" placeholder="Paste a code that starts with NL1."></textarea>
    <p class="q-warn" id="codeErr"></p>
    <div class="btn-row"><button class="btn primary" data-d="load">Load game</button><button class="btn" data-d="close">Cancel</button></div>`);
  setTimeout(() => $('#codeModal', ov).focus(), 30);
  ov.addEventListener('click', e => {
    const b = e.target.closest('[data-d]'); if (!b) return;
    if (b.dataset.d === 'close') { closeModal(ov); return; }
    try { G = decodeSave($('#codeModal', ov).value); W = null; save(); closeModal(ov); enterTown(); toast(`Welcome back, ${G.trainer}!`); }
    catch (err) { $('#codeErr', ov).textContent = err.message; }
  });
}

</script>
<script>/* ===== main.js ===== */
/* Numlings: button actions and startup (loads last) */
'use strict';
/* ========================= actions ========================= */
const ACT = {
  nav: t => (t.dataset.to === 'explore' ? exploreNav() : go(t.dataset.to)),
  lang: t => { const nm = $('#tname'); if (nm) ctx.name = nm.value; setLang(t.dataset.l); render(); },
  'to-town': () => (W && W.zone === 'town' ? go('map') : enterTown()),
  'world-map': () => go('explore'),
  'q-track': t => { G.tracked = t.dataset.q; save(); render(); toast('Tracking this quest on the map.'); },
  'q-cap': t => { G.capColor = t.dataset.c; save(); render(); },
  'q-title': t => { G.title = t.dataset.t; save(); render(); toast(`Your title is now “${G.title}.”`); },
  'to-title': () => go('title'),
  'to-new': async () => {
    if (loadLocal() && !(await confirmBox('Starting a new game will replace the game saved in this browser. Copy your save code first if you want to keep it.', 'Start a new game', true))) return;
    go('newgame', {});
  },
  continue: () => { G = loadLocal(); W = null; if (G) enterTown(); else toast('No saved game found in this browser.'); },
  'load-code-title': () => promptLoadCode(),
  'pick-starter': t => { ctx.name = $('#tname').value; ctx.starter = +t.dataset.n; render(); },
  'start-game': () => {
    const name = $('#tname').value.replace(/[^A-Za-z0-9 ]/g, '').replace(/\s+/g, ' ').trim().slice(0, 16);
    if (!name) { toast('Type a trainer nickname first.'); $('#tname').focus(); return; }
    if (!ctx.starter) { toast('Choose your first Numling.'); return; }
    G = freshState(name);
    G.cap = 0; creatorState(); G.look = { ...ctx.look }; G.outfit = { ...ctx.outfit };
    addToCollection(ctx.starter, 5);
    const starterName = SP[ctx.starter].name;
    save(); enterTown(); toast(tx(L(`${starterName} joined your team!`, `¡${starterName} se unió a tu equipo!`)));
  },
  'enter-zone': t => enterZone(t.dataset.zone),
  'explore-again': () => (W ? go('map') : enterTown()),
  'leave-zone': () => leaveZone(),
  // character creator (new game) and wardrobe
  'c-look': t => { ctx.name = $('#tname').value; creatorState(); ctx.look[t.dataset.k] = t.dataset.k === 'hair' ? t.dataset.v : +t.dataset.v; render(); },
  'c-wear': t => { ctx.name = $('#tname').value; creatorState(); ctx.outfit[t.dataset.k] = t.dataset.v; render(); },
  'w-look': t => { G.look[t.dataset.k] = t.dataset.k === 'hair' ? t.dataset.v : +t.dataset.v; save(); render(); },
  'w-tab': t => { wardrobeSeen(ctx.wtab); ctx.wtab = t.dataset.t; render(); },
  'w-equip': t => {
    const it = OUTFIT[t.dataset.id];
    if (!owns(it)) { toast(tx(unlockText(it)), 3600); return; }
    G.outfit[it.slot] = it.id; if (G.newItems) G.newItems.delete(it.id); save(); render();
  },
  'w-redeem': () => { const r = redeemCode($('#rcode').value); toast(tx(r.msg), 4800); if (r.ok) render(); },
  'open-wardrobe': () => go('wardrobe', { wtab: firstNewTab() }),
  'try-catch': () => tryCatch(),
  'start-battle': () => startBattle({ zone: ctx.zone, foes: [{ n: ctx.wild.n, lv: ctx.wild.battleLv, shiny: ctx.wild.shiny }], wild: ctx.wild }),
  'catch-after': () => { const z = ctx.zone, w = ctx.wild; go('encounter', { zone: z, wild: w, afterBattle: true }); },
  move: t => battleTurn({ move: +t.dataset.i }),
  swap: t => battleTurn({ swap: +t.dataset.i }),
  run: () => {
    const tr = ctx.trainer;
    toast(tr ? `You can battle ${tr.short} again anytime.` : 'You got away safely.');
    W ? go('map') : enterTown();
  },
  detail: t => showDetail(+t.dataset.uid),
  species: t => showSpecies(+t.dataset.n),
  'train-topic': t => { ctx.topic = t.dataset.t; ctx.summary = ''; render(); },
  'train-tier': t => { ctx.tier = +t.dataset.t; ctx.skill = null; ctx.summary = ''; render(); },
  'train-skill': t => { ctx.skill = t.dataset.s || null; ctx.summary = ''; render(); },
  'train-go': () => runTraining(),
  'dungeon-open': () => go('dungeon', { phase: 'lobby', diff: 'easy' }),
  'dg-diff': t => { ctx.diff = t.dataset.d; render(); },
  'dg-start': () => startDungeon(),
  'dg-catch': () => startDgCatch(),
  'dg-letgo': () => { const q = ctx.queue.shift(); ctx.catchMsg = `You let ${SP[q.n].name} go.`; render(); },
  'dg-lobby': () => go('dungeon', { phase: 'lobby', diff: ctx.diff }),
  'dg-quit': async () => { const r = ctx.run; if (!r) return; r.busy = true; cancelAnimationFrame(dgTimer);
    const isCatch = r.mode === 'catch';
    if (await confirmBox(isCatch ? `Stop trying to catch ${SP[r.guard].name}? It will escape.` : 'Leave the dungeon? Your run ends here.', isCatch ? 'Let it escape' : 'Leave', true)) { isCatch ? dgCatchEnd(false) : dgEnd(false, true); }
    else { r.busy = false; dgNext(); } },
  'trial-start': () => { ctx.cfg = null; runTrial(); },
  'train-this': () => go('train', { uid: ctx.uid, tier: 3 }),
  'turn-in': async () => {
    save(); const code = encodeSave(G), url = CONFIG.turnIn.url;
    try { await navigator.clipboard.writeText(code); } catch (e) { /* the form link still carries the code */ }
    const link = url.includes('CODE') ? url.replace('CODE', encodeURIComponent(code)) : url;
    window.open(link, '_blank', 'noopener');
    toast(url.includes('CODE') ? 'Your code is filled in. Press Submit on the form.' : 'Code copied. Paste it into the form, then press Submit.', 4500);
  },
  'show-code': () => { ctx.showCode = true; render(); setTimeout(() => $('#codeOut')?.select(), 30); },
  'copy-code': async () => {
    const box = $('#codeOut'); box.select();
    try { await navigator.clipboard.writeText(box.value); toast('Save code copied.'); }
    catch (e) { try { document.execCommand('copy'); toast('Save code copied.'); } catch (e2) { toast('Select the code and copy it yourself.'); } }
  },
  'load-code': async () => {
    const v = $('#codeIn').value; if (!v.trim()) { toast('Paste a save code first.'); return; }
    let st; try { st = decodeSave(v); } catch (err) { toast(err.message, 4000); return; }
    if (!(await confirmBox(`Load ${esc(st.trainer)}’s game? It will replace the game on this device.`, 'Load game'))) return;
    G = st; W = null; save(); enterTown(); toast(`Welcome back, ${G.trainer}!`);
  },
  reset: async () => {
    if (!(await confirmBox('Start over? Your current game will be erased from this browser. Copy your save code first if you might want it back.', 'Erase and start over', true))) return;
    try { localStorage.removeItem(STORE_KEY); } catch (e) {}
    G = null; W = null; go('newgame', {});
  },
};
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t || t.disabled || !$('#app').contains(t) && !$('#nav').contains(t)) return;
  const f = ACT[t.dataset.act]; if (f) f(t, e);
});
document.addEventListener('change', e => {
  if (e.target.dataset.change === 'train-uid') { ctx.uid = +e.target.value; ctx.summary = ''; render(); }
});

/* ========================= boot ========================= */
buildSprites();
G = loadLocal();
go('title');

</script>
