    <path d="M40 219 H360" stroke="#8C6A3E" stroke-width="2.5"/><path d="M360 219 l-8 -5 v10z M40 219 l8 -5 v10z" fill="#8C6A3E"/>
    ${ticks}
    <g fill="#F4A6A0" stroke="#C0706A" stroke-width="1"><path d="M352 186 q6 -10 12 0z"/><path d="M28 196 q5 -8 10 0z"/></g></svg>`;
}
function catchRing(c) {
  const R = 46, C = 2 * Math.PI * R, seg = C / c.need, gap = c.need > 1 ? 7 : 0;
  return `<svg class="ring" viewBox="0 0 100 100" aria-hidden="true"><g>${Array.from({ length: c.need }, (_, i) =>
    `<circle cx="50" cy="50" r="${R}" fill="none" stroke="${i < c.got ? '#FFD43B' : 'rgba(255,255,255,.55)'}" stroke-width="5" stroke-linecap="round"
      stroke-dasharray="${seg - gap} ${C}" stroke-dashoffset="${-i * seg}" transform="rotate(-90 50 50)"/>`).join('')}</g></svg>`;
}

/* ========================= encounter / catching ========================= */
function catchPlan(r, shiny = false) {
  const n = RARITY[r].tiers.length, s = CONFIG.catchSeconds[r];
  const misses = CONFIG.catchMissesAllowed + (shiny ? CONFIG.encounters.shinyExtraMiss : 0);
  const time = s >= 120 && s % 60 === 0 ? L(s / 60 + ' minutes', s / 60 + ' minutos') : L(s + ' seconds', s + ' segundos');
  return bi(L(`Solve ${n} problem${n > 1 ? 's' : ''}. ${s ? `You get ${time.en} for each one.` : 'No timer.'} ${misses + 1} misses and it runs away.`,
              `Resuelve ${n} problema${n > 1 ? 's' : ''}. ${s ? `Tienes ${time.es} para cada uno.` : 'Sin tiempo límite.'} Con ${misses + 1} errores se escapa.`));
}
function matchupText(myType, foeType) {
  const m = typeMult(myType, foeType), t = typeMult(foeType, myType);
  if (m > 1) return bi(L('You have the type advantage.', 'Tienes la ventaja de tipo.'));
  if (t > 1) return bi(L('It has the type advantage. Consider switching your lead in Team.', 'Tiene la ventaja de tipo. Considera cambiar a tu líder en Equipo.'));
  return bi(L('Even matchup.', 'Combate parejo.'));
}
const zoneBack = () => tx(W ? L(`Back to ${mapName(W.zone)}`, `Volver a ${mapName(W.zone)}`) : L('Back to zones', 'Volver a las zonas'));
function renderEncounter() {
  const z = ZONES[ctx.zone], w = ctx.wild, s = SP[w.n], ld = lead();
  const enter = ctx.fresh; ctx.fresh = false;
  const owned = G.caught.has(w.n) && ctx.result !== 'caught';
  const full = G.creatures.length >= CONFIG.boxLimit;
  const foeCls = ctx.result === 'caught' ? 'captured' : ctx.result === 'fled' ? 'flee' : 'bob';
  let status = '', actions = '';
  const T = (en, es) => bi(L(en, es)), B = k => t(k);
  if (ctx.result === 'caught') {
    status = `<p class="result-msg">${T(`${w.shiny ? 'A shiny ' : ''}${s.name} joined your collection!`, `¡${s.name}${w.shiny ? ' brillante' : ''} se unió a tu colección!`)}</p>${w.shiny ? `<p>${T('<b>✦ That’s a shiny.</b> It’s marked in your Codex and keeps its colors when it evolves.', '<b>✦ Es brillante.</b> Queda marcado en tu Códex y conserva sus colores cuando evoluciona.')}</p>` : ''}<p>${bi(ctx.joined)}</p>`;
    actions = `<button class="btn primary" data-act="explore-again">${B('keepExploring')}</button><button class="btn" data-act="nav" data-to="team">${B('seeTeam')}</button>`;
  } else if (ctx.result === 'fled') {
    status = `<p class="result-msg">${T(`${s.name} ran off.`, `${s.name} se escapó.`)}</p><p class="muted">${T('No worries. Another one could show up anytime.', 'No te preocupes. Otro puede aparecer en cualquier momento.')}</p>`;
    actions = `<button class="btn primary" data-act="explore-again">${B('keepExploring')}</button>`;
  } else {
    if (ctx.afterBattle) status = `<p class="result-msg">${T(`You won! ${s.name} is still hanging around.`, `¡Ganaste! ${s.name} sigue por aquí.`)}</p>`;
    if (full) status += `<p class="banner">${T(`Your collection is full (${CONFIG.boxLimit}). Release a Numling in Team to make room.`, `Tu colección está llena (${CONFIG.boxLimit}). Libera un Numling en Equipo para hacer espacio.`)}</p>`;
    actions = ctx.catching ? '' : `<button class="btn primary" data-act="try-catch" ${full ? 'disabled' : ''}>${B('catchIt')}</button>
      ${ctx.afterBattle ? '' : `<button class="btn" data-act="start-battle">${B('battle')}</button>`}
      <button class="btn" data-act="explore-again">${ctx.afterBattle ? B('keepExploring') : B('walkAway')}</button>`;
  }
  const card = ctx.result === 'caught' ? `<div class="dexcard"><span class="dexno">No. ${s.n}</span><div class="art-wrap">${artC(w)}</div><b>${w.shiny ? '✦ ' : ''}${s.name}</b>${stars(s.r)}<span class="stamp">${tx(L('Caught', 'Atrapado'))}</span></div>` : '';
  const misses = ctx.catching ? CONFIG.catchMissesAllowed + 1 - ctx.catching.misses : 0;
  return `<div class="enc theme-${ctx.zone}">
    <div class="scene scene-${ctx.zone}${enter ? ' enter' : ''}${s.r >= 3 ? ' shine r' + s.r : ''}${w.shiny ? ' shiny-scene' : ''}">
      ${sceneSVG(ctx.zone)}
      <span class="scene-tag">${tx(L(`${w.shiny && enter ? '✦ A shiny appeared! ' : ''}Spotted at (${num(w.spot[0])}, ${num(w.spot[1])})`, `${w.shiny && enter ? '✦ ¡Apareció uno brillante! ' : ''}Visto en (${num(w.spot[0])}, ${num(w.spot[1])})`))}</span>
      ${ctx.catching ? `<span class="scene-tag right">${tx(L(`${ctx.catching.got} of ${ctx.catching.need} solved. ${misses} ${misses === 1 ? 'miss' : 'misses'} left.`, `${ctx.catching.got} de ${ctx.catching.need} resueltos. Te ${misses === 1 ? 'queda' : 'quedan'} ${misses} ${misses === 1 ? 'error' : 'errores'}.`))}</span>` : ''}
      <div class="stage"><div class="plat"></div><div class="foe ${foeCls}">${artC(w)}</div>${ctx.catching ? catchRing(ctx.catching) : ''}</div>
      ${card}
    </div>
    <div class="panel enc-info">
      <h2 class="enc-name">${w.shiny ? '<span class="shiny-star" aria-hidden="true">✦</span>' : ''}${s.name}</h2>
      <div class="chips" style="margin-top:6px">${typeChip(s.type)}${w.shiny ? shinyChip : ''}<span class="chip" style="--c:var(--none)">${tx(L(`Catch level ${w.lv}`, `Nivel de captura ${w.lv}`))}</span>${rarityTag(s.r)}${owned ? `<span class="small muted">${tx(L('Already in your codex', 'Ya está en tu códex'))}</span>` : ''}</div>
      ${ctx.result || ctx.catching ? '' : `<ul class="facts">
        ${w.shiny ? `<li><b>${tx(L('Shiny!', '¡Brillante!'))}</b><span>${T(`A rare recolor. Only about 1 in ${Math.round(1 / CONFIG.encounters.shinyChance)} wild Numlings is shiny. You get ${CONFIG.encounters.shinyExtraMiss} extra miss to catch it.`, `Un color raro. Solo 1 de cada ${Math.round(1 / CONFIG.encounters.shinyChance)} Numlings salvajes es brillante. Tienes ${CONFIG.encounters.shinyExtraMiss} error extra para atraparlo.`)}</span></li>` : ''}
        <li><b>${tx(L('To catch', 'Para atraparlo'))}</b><span>${catchPlan(s.r, w.shiny)} ${T(`It joins your team at level ${w.lv}.`, `Se une a tu equipo en el nivel ${w.lv}.`)}</span></li>
        ${ctx.afterBattle ? '' : `<li><b>${tx(L('In battle', 'En combate'))}</b><span>${w.battleLv > w.lv ? T(`It powers up to level ${w.battleLv} to match your team.`, `Sube al nivel ${w.battleLv} para igualar a tu equipo.`) : T(`It fights at level ${w.lv}.`, `Combate en el nivel ${w.lv}.`)}</span></li>`}
        <li><b>${tx(L('Your lead', 'Tu líder'))}</b><span>${T(`${SP[ld.n].name} (${TYPE_LABEL[SP[ld.n].type]}), level ${ld.lv}.`, `${SP[ld.n].name} (${TYPE_LABEL[SP[ld.n].type]}), nivel ${ld.lv}.`)} ${matchupText(SP[ld.n].type, s.type)}</span></li></ul>`}
      ${ctx.catching ? `<p class="note">${T(`Each correct answer tightens the ring. Fill it to catch ${s.name}!`, `Cada respuesta correcta cierra el anillo. ¡Llénalo para atrapar a ${s.name}!`)}</p>` : ''}
      ${status}
      <div class="btn-row">${actions}</div>
    </div>
  </div>`;
}
async function tryCatch() {
  const w = ctx.wild, s = SP[w.n], tiers = RARITY[s.r].tiers, topic = ZONES[ctx.zone].topic;
  const allowed = CONFIG.catchMissesAllowed + (w.shiny ? CONFIG.encounters.shinyExtraMiss : 0), here = ctx;
  here.catching = { got: 0, need: tiers.length, misses: 0 }; render();
  while (here.catching.got < tiers.length && here.catching.misses <= allowed) {
    const c = here.catching, left = allowed - c.misses;
    const pips = `<span class="pips" aria-label="${c.got} of ${tiers.length} solved">${tiers.map((_, i) => `<span class="pip ${i < c.got ? 'on' : ''}"></span>`).join('')}</span>`;
    const res = await askQuestion({ topic, tier: tiers[c.got], seconds: CONFIG.catchSeconds[s.r], autoMs: 1000, theme: ctx.zone, side: true,
      title: L(`Catch ${w.shiny ? 'shiny ' : ''}${s.name}`, `Atrapa a ${s.name}${w.shiny ? ' brillante' : ''}`), head: pips, headArt: artC(w, { label: false }),
      sub: L(`Problem ${c.got + 1} of ${tiers.length}. ${left === 0 ? 'One more miss and it runs away.' : `It runs away after ${left + 1} misses.`}`,
             `Problema ${c.got + 1} de ${tiers.length}. ${left === 0 ? 'Un error más y se escapa.' : `Se escapa después de ${left + 1} errores.`}`) });
    if (solved(res)) c.got++; else c.misses++;
    if (ctx !== here) return;
    render();
    await sleep(350);
  }
  const success = here.catching.got >= tiers.length;
  delete here.catching;
  if (success) {
    const c = addToCollection(w.n, w.lv, !!w.shiny);
    G.stats.caught++; questEvent('catch', { zone: here.zone, n: w.n }); if (typeof earnCoins === 'function') earnCoins(3);
    here.result = 'caught';
    here.joined = G.party.includes(c.uid) ? L('It’s on your team now.', 'Ya está en tu equipo.') : L('Your team is full, so it went to your collection. Swap it in from Team anytime.', 'Tu equipo está lleno, así que se fue a tu colección. Cámbialo desde Equipo cuando quieras.');
  } else here.result = 'fled';
  save(); render();
}

// Every backdrop gets the same finishing light: sun rays, haze along the horizon, and a soft vignette.
const SCENE_LIGHT = { meadows: ['#FFF0B8', '#FFF1CC'], isles: ['#FFF4C4', '#BFE6FF'], rapids: ['#FFF0B8', '#CFEBC8'], bluffs: ['#FFFFFF', '#D8E6F2'], dungeon: ['#B9A8FF', '#3B2F66'] };
function sceneSVG(zone) {
  const svg = sceneBase(zone), [sun, haze] = SCENE_LIGHT[zone] || SCENE_LIGHT.isles, id = 'sl' + zone;
  const light = `<defs><radialGradient id="${id}v" cx="50%" cy="45%" r="75%"><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#0B1630" stop-opacity=".28"/></radialGradient>
      <linearGradient id="${id}h" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${haze}" stop-opacity="0"/><stop offset=".5" stop-color="${haze}" stop-opacity=".45"/><stop offset="1" stop-color="${haze}" stop-opacity="0"/></linearGradient></defs>
    <g opacity=".22" fill="${sun}">${[[-30, 260, 40], [40, 300, 26], [110, 340, 34]].map(([a, b, w]) => `<path d="M${a} -10 L${a + w} -10 L${b + w * 1.6} 250 L${b} 250Z"/>`).join('')}</g>
    <rect x="0" y="118" width="400" height="44" fill="url(#${id}h)"/>
    <rect width="400" height="240" fill="url(#${id}v)"/>`;
  return svg.replace(/<\/svg>\s*$/, light + '</svg>');
}

</script>
<script>/* ===== battle.js ===== */
/* Numlings: battles against wild Numlings, trainers, and Champions */
'use strict';
/* ========================= battle =========================
   Opponent levels scale with the team's best Numling (see CONFIG.scaling and TRAINERS). */
const MOVE_BUMP = { name: 'Bump', type: 'none', power: 45 };
const movesOf = c => [MOVE_BUMP, { name: SP[c.n].move, type: SP[c.n].type, power: SP[c.n].stage === 3 ? 95 : SP[c.n].stage === 2 ? 80 : 65 }];
function fighter(c) { const st = stats(c); return { c, st, hp: st.hp, max: st.hp }; }
// Battle questions follow the student's own skill level in this zone (not their Numlings' levels).
// Champions ask one tier above what the student is working on.
function battleQ(topic, champ) {
  const tier = adaptiveTier(topic, champ ? 1 : 0);
  return { tier, seconds: CONFIG.battleSeconds[tier] };
}
const foeNameL = (b, f = b.foe) => (b.trainer ? L(`${b.trainer.short}’s ${SP[f.c.n].name}`, `${SP[f.c.n].name} de ${b.trainer.short}`)
  : L(`${f.c.shiny ? 'Shiny wild' : 'Wild'} ${SP[f.c.n].name}`, `${SP[f.c.n].name} ${f.c.shiny ? 'brillante ' : ''}salvaje`));
const foeName = (b, f = b.foe) => tx(foeNameL(b, f));
function startBattle({ zone, foes, wild = null, trainer = null }) {
  const team = G.party.map(byUid).map(fighter);
  const fs = foes.map(f => fighter({ n: f.n, lv: f.lv, shiny: !!f.shiny }));
  const b = { team, ai: 0, foes: fs, fi: 0, foe: fs[0], trainer, used: new Set([team[0].c.uid]),
    log: trainer ? L(`${trainer.name} sends out ${SP[fs[0].c.n].name}!`, `¡${trainer.nameEs || trainer.name} envía a ${SP[fs[0].c.n].name}!`) : L(`A wild ${SP[fs[0].c.n].name} wants to battle!`, `¡Un ${SP[fs[0].c.n].name} salvaje quiere combatir!`),
    busy: false, over: null, anim: null, dmg: null, rewards: [] };
  ctx = { zone, wild, trainer, battle: b };
  screen = 'battle'; render(); window.scrollTo(0, 0);
}
function hpCard(b, f, foe) {
  const pct = Math.round(f.hp / f.max * 100);
  const dots = foe && b.trainer ? `<span class="teamdots" aria-label="${b.foes.filter(x => x.hp > 0).length} of ${b.foes.length} left">${b.foes.map(x => `<i class="${x.hp > 0 ? 'on' : ''}"></i>`).join('')}</span>` : '';
  return `<div class="hpcard"><div class="nm"><span>${foe ? foeName(b, f) : SP[f.c.n].name}</span><span class="small">Lv ${f.c.lv}</span></div>
    <div class="chips">${typeChip(SP[f.c.n].type)}${dots}</div>
    <div class="hpbar ${pct <= 25 ? 'low' : pct <= 55 ? 'mid' : ''}" role="progressbar" aria-label="HP" aria-valuemin="0" aria-valuemax="${f.max}" aria-valuenow="${f.hp}"><i style="width:${pct}%"></i></div>
    <div class="hpnum">${f.hp} / ${f.max} HP</div></div>`;
}
function renderBattle() {
  const b = ctx.battle, me = b.team[b.ai], foe = b.foe, tr = b.trainer;
  const dmg = (who) => b.dmg && b.dmg.who === who ? `<span class="dmg ${b.dmg.crit ? 'crit' : ''}">${MINUS}${b.dmg.n}</span>` : '';
  const cls = (who) => [b.anim === 'me' && who === 'me' ? 'lunge-me' : '', b.anim === 'foe' && who === 'foe' ? 'lunge-foe' : '',
    b.anim === 'foe' && who === 'me' ? 'hit' : '', b.anim === 'me' && who === 'foe' ? 'hit' : ''].join(' ');
  let controls;
  if (b.over === 'won') {
    const more = tr ? `<button class="btn primary" data-act="explore-again">${zoneBack()}</button>`
      : `<button class="btn primary" data-act="catch-after">${tx(L(`Try to catch ${SP[foe.c.n].name}`, `Intenta atrapar a ${SP[foe.c.n].name}`))}</button><button class="btn" data-act="explore-again">${t('keepExploring')}</button>`;
    controls = `<div class="panel"><p class="result-msg">${t('youWon')}</p>${b.rewards.map(r => `<p>${bi(r)}</p>`).join('')}<div class="btn-row">${more}</div></div>`;
  } else if (b.over === 'lost') {
    controls = `<div class="panel"><p class="result-msg">${bi(tr ? L(`${tr.short} wins this time.`, `${tr.short} gana esta vez.`) : L('Your team needs a rest.', 'Tu equipo necesita descansar.'))}</p>
      <p>${bi(L(`Everyone is healed and ready to go again. ${tr ? `${tr.short} will be right where you left them.` : ''} Training is a good way to get stronger.`, `Todos están curados y listos otra vez. ${tr ? `${tr.short} te estará esperando en el mismo lugar.` : ''} Entrenar es una buena forma de hacerte más fuerte.`))}</p>
      <div class="btn-row"><button class="btn primary" data-act="nav" data-to="train">${t('trainTeam')}</button><button class="btn" data-act="explore-again">${zoneBack()}</button></div></div>`;
  } else {
    const dis = b.busy ? 'disabled' : '';
    const score = m => m.power * typeMult(m.type, SP[foe.c.n].type) * (m.type === SP[me.c.n].type ? 1.2 : 1);
    const best = score(movesOf(me.c)[1]) >= score(movesOf(me.c)[0]) ? 1 : 0;
    const bench = b.team.map((f, i) => i === b.ai || f.hp <= 0 ? '' :
      `<button class="btn" data-act="swap" data-i="${i}" ${dis}><span class="mini">${artC(f.c, { label: false })}</span>${tx(L(`Switch to ${SP[f.c.n].name}`, `Cambiar a ${SP[f.c.n].name}`))}</button>`).join('');
    controls = `<div class="moves">${movesOf(me.c).map((m, i) => {
      const eff = typeMult(m.type, SP[foe.c.n].type);
      return `<button class="btn move ${i === best ? 'primary' : ''}" data-act="move" data-i="${i}" ${dis}>${m.name}<small>${tx(L(`${TYPE_LABEL[m.type]} move${eff > 1 ? ', strong against this foe' : eff < 1 ? ', weak against this foe' : ''}`, `Movimiento ${TYPE_LABEL[m.type]}${eff > 1 ? ', fuerte contra este rival' : eff < 1 ? ', débil contra este rival' : ''}`))}</small></button>`;
    }).join('')}</div>
    <div class="bench">${bench}<button class="btn ghost" data-act="run" ${dis}>${tr ? t('giveUp') : t('runAway')}</button></div>`;
  }
  const banner = tr ? `<div class="vs-banner${tr.champion ? ' champ' : ''}"><span class="trainer-face">${npcAvatar(tr.id, tr.cap, tr.shirt, 'down')}</span><span><b>${tx(L(tr.name, tr.nameEs || tr.name))}</b><span class="small">${tr.champion ? tx(L(`${ZONES[ctx.zone].name} Champion`, `Campeón de ${ZONES[ctx.zone].name}`)) : tx(L('Trainer battle', 'Combate de entrenador'))}</span></span></div>` : '';
  return `${banner}<div class="arena theme-${ctx.zone}">${sceneSVG(ctx.zone)}
    <div class="side foe">${hpCard(b, foe, true)}<div class="art-wrap plat-wrap ${cls('foe')} ${foe.hp <= 0 ? 'faint' : 'bob'}">${artC(foe.c, { faceLeft: true })}${dmg('foe')}</div></div>
    <div class="side me"><div class="art-wrap plat-wrap ${cls('me')} ${me.hp <= 0 ? 'faint' : 'bob'}">${artC(me.c, { flip: true })}${dmg('me')}</div>${hpCard(b, me, false)}</div>
  </div>
  <p class="log" aria-live="polite">${bi(b.log)}</p>
  ${controls}`;
}
function damage(att, def, move, crit, guard) {
  const ld = att.c.lv;
  const base = Math.floor(((2 * ld / 5 + 2) * move.power * att.st.atk / def.st.def) / 50) + 2;
  const stab = move.type === SP[att.c.n].type ? 1.2 : 1;
  const eff = typeMult(move.type, SP[def.c.n].type);
  const n = Math.max(1, Math.round(base * stab * eff * (crit ? 1.8 : 1) * (guard ? 0.4 : 1) * (0.9 + Math.random() * 0.2)));
  return { n, eff };
}
const effL = e => (e > 1 ? L(' It’s a strong hit!', ' ¡Es un golpe fuerte!') : e < 1 ? L(' It’s a weak hit.', ' Es un golpe débil.') : L('', ''));
async function show(b, log, anim = null, dmg = null, wait = 750) {
  b.log = log; b.anim = anim; b.dmg = dmg; render();
  await sleep(wait);
  b.anim = null; b.dmg = null;
}
async function playerAttack(b, move) {
  const me = b.team[b.ai], foe = b.foe, name = SP[me.c.n].name;
  b.log = L(`${name} gets ready to use ${move.name}…`, `${name} se prepara para usar ${move.name}…`); render();
  const q = battleQ(ZONES[ctx.zone].topic, b.trainer && b.trainer.champion);
  const res = await askQuestion({ topic: ZONES[ctx.zone].topic, tier: q.tier, seconds: q.seconds, allowSkip: true, autoMs: 800, theme: ctx.zone, low: true, battle: true,
    title: UI.critTitle, sub: L(`Answer correctly and ${name}’s ${move.name} becomes a critical hit.`, `Responde bien y ${move.name} de ${name} será un golpe crítico.`) });
  const crit = solved(res);
  const d = damage(me, foe, move, crit, false);
  foe.hp = Math.max(0, foe.hp - d.n);
  await show(b, L(`${name} used ${move.name}.${crit ? ' Critical hit!' : ''}${effL(d.eff).en}`, `${name} usó ${move.name}.${crit ? ' ¡Golpe crítico!' : ''}${effL(d.eff).es}`), 'me', { who: 'foe', n: d.n, crit });
}
async function foeAttack(b) {
  const me = b.team[b.ai], foe = b.foe, fnL = foeNameL(b), fname = fnL.en;
  const ms = movesOf(foe.c), sig = ms[1];
  const move = typeMult(sig.type, SP[me.c.n].type) < 1 && Math.random() < 0.6 ? ms[0] : sig;
  b.log = L(`${fnL.en} is about to use ${move.name}!`, `¡${fnL.es} va a usar ${move.name}!`); render();
  const q = battleQ(ZONES[ctx.zone].topic, b.trainer && b.trainer.champion);
  const res = await askQuestion({ topic: ZONES[ctx.zone].topic, tier: q.tier, seconds: q.seconds, allowSkip: true, autoMs: 800, theme: ctx.zone, low: true, battle: true,
    title: UI.guardTitle, sub: L(`Answer correctly to block most of the damage from ${move.name}.`, `Responde bien para bloquear casi todo el daño de ${move.name}.`) });
  const guard = solved(res);
  const d = damage(foe, me, move, false, guard);
  me.hp = Math.max(0, me.hp - d.n);
  await show(b, L(`${fnL.en} used ${move.name}.${guard ? ' Guarded! Most of the damage was blocked.' : ''}${effL(d.eff).en}`, `${fnL.es} usó ${move.name}.${guard ? ' ¡Defendido! Bloqueaste casi todo el daño.' : ''}${effL(d.eff).es}`), 'foe', { who: 'me', n: d.n, crit: false });
}
// returns 'over' when the battle ended, 'switched' when a new Numling came in (the turn ends), or false
async function checkFaints(b) {
  if (b.foe.hp <= 0) {
    if (b.fi < b.foes.length - 1) {
      { const f0 = foeNameL(b); await show(b, L(`${f0.en} is worn out.`, `${f0.es} está agotado.`), null, null, 900); }
      b.fi++; b.foe = b.foes[b.fi];
      await show(b, L(`${b.trainer.short} sends out ${SP[b.foe.c.n].name}!`, `¡${b.trainer.short} envía a ${SP[b.foe.c.n].name}!`), null, null, 900);
      return 'switched';
    }
    await winBattle(b); return 'over';
  }

    await show(b, `${SP[me.c.n].name} is worn out.`, null, null, 900);
    b.ai = next; b.used.add(b.team[next].c.uid);
    await show(b, `Go, ${SP[b.team[next].c.n].name}!`, null, null, 700);

}
async function winBattle(b) {
  const tr = b.trainer, first = tr && !G.trainerWins.has(tr.id);
  let amount = b.foes.reduce((sum, f) => sum + 6 + f.c.lv * 4 + RARITY[SP[f.c.n].r].xp, 0);
  const coins = typeof earnCoins === 'function' ? earnCoins(tr ? 10 + Math.round(b.foes.length * 3) + (tr.champion ? 25 : 0) : 2) : 0;
  if (first) amount = Math.round(amount * 1.5);
  b.rewards = [];
  if (tr) b.rewards.push(L(`${tr.name}: “${tr.beat}”`, `${tr.nameEs || tr.name}: “${tr.beatEs || tr.beat}”`));
  if (coins) b.rewards.push(L(`🪙 You earned ${coins} coins.`, `🪙 Ganaste ${coins} monedas.`));
  for (const uid of b.used) {
    const c = byUid(uid); if (!c) continue;
    const ups = addXp(c, amount);
    b.rewards.push(L(`${SP[c.n].name} earned ${amount} XP${first ? ' (first-win bonus included)' : ''}.${ups.length ? ` It reached level ${c.lv}!` : ''}${evoReady(c, ups)}`,
                     `${SP[c.n].name} ganó ${amount} XP${first ? ' (incluye el bono por primera victoria)' : ''}.${ups.length ? ` ¡Llegó al nivel ${c.lv}!` : ''}${evoReadyEs(c, ups)}`));
  }
  if (tr) {
    G.trainerWins.add(tr.id);
    if (tr.champion && !G.badges.has(ctx.zone)) { G.badges.add(ctx.zone); b.rewards.push(L(`<b>You earned the ${ZONES[ctx.zone].name} Badge!</b> It’s on your trainer card in Save.`, `<b>¡Ganaste la insignia de ${ZONES[ctx.zone].name}!</b> Está en tu tarjeta de entrenador en Guardar.`)); }
    else if (!tr.champion && first) {
      const left = TRAINERS[ctx.zone].filter(t => !G.trainerWins.has(t.id)).length;
      b.rewards.push(left ? L(`${left} more trainer${left > 1 ? 's' : ''} to beat before the Champion will battle you.`, `Te ${left > 1 ? 'faltan' : 'falta'} ${left} entrenador${left > 1 ? 'es' : ''} por vencer antes de que el Campeón combata contigo.`)
        : L(`You’ve beaten every trainer here. The ${ZONES[ctx.zone].name} Champion is waiting!`, `Venciste a todos los entrenadores de aquí. ¡El Campeón de ${ZONES[ctx.zone].name} te espera!`));
    }
  }
  G.stats.won++; questEvent('battle', { zone: ctx.zone, trainer: tr ? tr.id : null, champion: !!(tr && tr.champion) }); save();
  { const f0 = foeNameL(b); b.log = L(`${f0.en} is worn out.`, `${f0.es} está agotado.`); }
  b.over = 'won'; b.busy = false; render();
}
async function battleTurn(action) {
  const b = ctx.battle; if (!b || b.busy || b.over) return;
  b.busy = true; render();
  if (action.swap != null) {
    b.ai = action.swap; b.used.add(b.team[b.ai].c.uid);
    await show(b, `Go, ${SP[b.team[b.ai].c.n].name}!`, null, null, 700);
    await foeAttack(b);
    if ((await checkFaints(b)) === 'over') return;
  } else {
    const me = b.team[b.ai], foe = b.foe;
    const move = movesOf(me.c)[action.move];
    const meFirst = me.st.spd > foe.st.spd || (me.st.spd === foe.st.spd && Math.random() < 0.5);
    for (const side of meFirst ? ['me', 'foe'] : ['foe', 'me']) {
      if (side === 'me') await playerAttack(b, move); else await foeAttack(b);
      const r = await checkFaints(b);
      if (r === 'over') return;
      if (r === 'switched') break;
    }
  }
  b.busy = false; b.log = L(`What will ${SP[b.team[b.ai].c.n].name} do?`, `¿Qué hará ${SP[b.team[b.ai].c.n].name}?`); render();
}

<script>/* ===== pvp.js ===== */
/* Numlings: live battles between classmates (the Battle Arena).
   One student hosts and gets a four-letter code; a classmate joins with it. A free public service (PeerJS) only
   introduces the two Chromebooks; after that, battle messages go straight between them and nothing is stored.
   Each round both students pick a move and answer a problem at their own level: a correct answer is a strong hit,
   a miss is a glancing hit. The host's device works out the damage and sends the result to both screens, so both
   always see the same battle. Everything received from the other device is checked before it's used. */
'use strict';
const PVP_LIB = 'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js';
const PVP_PREFIX = 'nlpvp-';
const PVP_CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
let PVP = null;   // { stage, role, code, peer, conn, opp, setup, b, msg }

/* ---------- connecting ---------- */
function pvpLoadLib() {
  return new Promise((resolve, reject) => {
    if (window.Peer) return resolve();
    const s = document.createElement('script'); s.src = PVP_LIB;
    const timer = setTimeout(() => reject(new Error('timeout')), 12000);
    s.onload = () => { clearTimeout(timer); resolve(); };
    s.onerror = () => { clearTimeout(timer); reject(new Error('blocked')); };
    document.head.appendChild(s);
  });
}
function pvpFresh() { return { stage: 'lobby', role: null, code: '', peer: null, conn: null, opp: null, setup: null, b: null, msg: null, topic: 'mixed', even: CONFIG.pvp.evenLevels }; }
function pvpSet(patch) { Object.assign(PVP, patch); if (screen === 'arena') render(); }
function pvpFail(en, es) { pvpSet({ stage: 'error', msg: L(en, es) }); }
async function pvpStart(asHost, code = '') {
  pvpLeave(true);
  PVP = pvpFresh();
  pvpSet({ stage: 'connecting', role: asHost ? 'host' : 'guest', code: asHost ? Array.from({ length: 4 }, () => PVP_CODE_CHARS[Math.floor(Math.random() * 32)]).join('') : code });
  try { await pvpLoadLib(); } catch (e) {
    return pvpFail('Couldn’t load the battle tools. The network may be blocking cdn.jsdelivr.net.', 'No se pudieron cargar las herramientas de combate. La red puede estar bloqueando cdn.jsdelivr.net.');
  }
  const peer = new Peer(asHost ? PVP_PREFIX + PVP.code.toLowerCase() : undefined, { debug: 0 });
  PVP.peer = peer;
  const openTimer = setTimeout(() => pvpFail('The battle service didn’t answer. Try again in a moment.', 'El servicio de combate no respondió. Inténtalo de nuevo en un momento.'), 12000);
  peer.on('open', () => {
    clearTimeout(openTimer);
    if (asHost) pvpSet({ stage: 'waiting' });
    else pvpWire(peer.connect(PVP_PREFIX + PVP.code.toLowerCase(), { reliable: true }));
  });
  peer.on('connection', c => { if (PVP && !PVP.conn && PVP.role === 'host') pvpWire(c); else c.close(); });
  peer.on('error', err => {
    clearTimeout(openTimer);
    if (err.type === 'unavailable-id' && asHost) return pvpStart(true);   // that code is in use: pick another
    if (err.type === 'peer-unavailable') return pvpFail(`No one is hosting with code ${PVP.code}. Check the code with your classmate.`, `Nadie está usando el código ${PVP.code}. Revisa el código con tu compañero.`);
    pvpFail('The connection didn’t work. Both of you can try again.', 'La conexión no funcionó. Pueden intentarlo de nuevo.');
  });
}
function pvpWire(conn) {
  PVP.conn = conn;
  const timer = setTimeout(() => { if (!conn.open) pvpFail('Couldn’t reach your classmate’s Chromebook. Try again.', 'No se pudo conectar con la Chromebook de tu compañero. Inténtalo de nuevo.'); }, 20000);
  conn.on('open', () => { clearTimeout(timer); pvpSend({ t: 'hello', v: 1, ...pvpProfile() }); if (PVP.stage !== 'ready') pvpSet({ stage: 'hello' }); });
  conn.on('data', d => { try { pvpOnData(d); } catch (e) { console.error(e); } });
  conn.on('close', () => {
    if (!PVP || PVP.conn !== conn) return;
    if (PVP.stage === 'over') { PVP.oppLeft = true; render(); return; }
    pvpFail('Your classmate left the arena. No win or loss was counted.', 'Tu compañero salió de la arena. No se contó victoria ni derrota.');
  });
}
const pvpSend = m => { if (PVP && PVP.conn && PVP.conn.open) PVP.conn.send(m); };
function pvpLeave(quiet = false) {
  if (!PVP) return;
  try { if (PVP.stage === 'battle') pvpSend({ t: 'forfeit' }); pvpSend({ t: 'bye' }); } catch (e) {}
  try { PVP.conn && PVP.conn.close(); PVP.peer && PVP.peer.destroy(); } catch (e) {}
  PVP = quiet ? PVP : null;
}

/* ---------- what each side shares, and checking what comes in ---------- */
function pvpProfile() {
  const team = G.party.map(uid => G.creatures.find(c => c.uid === uid)).filter(Boolean).slice(0, CONFIG.partySize).map(c => ({ n: c.n, lv: c.lv, shiny: !!c.shiny }));
  return { name: G.trainer, title: G.title || '', look: G.look, outfit: G.outfit, team };
}
function pvpClean(d) {
  const int = (v, lo, hi) => Number.isInteger(v) && v >= lo && v <= hi;
  const name = typeof d.name === 'string' ? d.name.replace(/[^\p{L}\p{N} ]/gu, '').slice(0, 16).trim() || 'Trainer' : 'Trainer';
  const team = (Array.isArray(d.team) ? d.team : []).slice(0, CONFIG.partySize)
    .filter(c => c && int(c.n, 1, MAX_DEX) && SP[c.n] && int(c.lv, 1, 100)).map((c, i) => ({ uid: 9000 + i, n: c.n, lv: c.lv, shiny: c.shiny === true, xp: 0 }));
  const lk = d.look || {}, of = d.outfit || {};
  const look = { skin: int(lk.skin, 0, SKIN_TONES.length - 1) ? lk.skin : 2, hair: HAIR_STYLES.some(h => h.id === lk.hair) ? lk.hair : 'short', hairColor: int(lk.hairColor, 0, HAIR_COLORS.length - 1) ? lk.hairColor : 1 };
  const outfit = {}; for (const k of ['top', 'bottom', 'shoes', 'hat', 'acc']) outfit[k] = typeof of[k] === 'string' && OUTFIT[of[k]] && OUTFIT[of[k]].slot === k ? of[k] : DEFAULT_OUTFIT[k];
  const title = typeof d.title === 'string' && TITLE_ES[d.title] !== undefined ? d.title : '';
  return team.length ? { name, title, look, outfit, team } : null;
}

/* ---------- setting up a battle (the host decides, both build the same teams) ---------- */
function pvpOpenTopics() { return Object.keys(ZONES).filter(z => CONFIG.zones[z]).map(z => ZONES[z].topic); }
function pvpBegin() {
  const topTop = t => Math.max(...t.map(c => c.lv));
  const level = PVP.even ? Math.max(5, Math.round((topTop(pvpProfile().team) + topTop(PVP.opp.team)) / 2)) : 0;
  const setup = { t: 'setup', topic: PVP.topic, even: PVP.even, level, seed: Math.floor(Math.random() * 1e9) };
  pvpSend(setup); pvpBuild(setup);
}
function pvpBuild(setup) {
  const lv = c => (setup.level ? { ...c, lv: setup.level } : { ...c });
  const mine = pvpProfile().team.map((c, i) => ({ uid: 8000 + i, xp: 0, ...c })).map(lv).map(fighter);
  const theirs = PVP.opp.team.map(lv).map(fighter);
  const host = PVP.role === 'host';
  PVP.setup = setup;
  PVP.b = { team: mine, ai: 0, foes: theirs, fi: 0, foe: theirs[0], trainer: { short: PVP.opp.name, name: PVP.opp.name }, round: 1, mine: null, theirs: null,
    log: L(`${PVP.opp.name} sends out ${SP[theirs[0].c.n].name}!`, `¡${PVP.opp.name} envía a ${SP[theirs[0].c.n].name}!`), busy: false, waiting: false, over: null, side: host ? 'h' : 'g' };
  pvpSet({ stage: 'battle' });
}
function pvpZone() {
  const z = Object.keys(ZONES).find(k => ZONES[k].topic === (PVP.setup && PVP.setup.topic));
  return z || 'isles';
}

/* ---------- a round ---------- */
async function pvpChoose(i) {
  const b = PVP.b; if (!b || b.busy || b.waiting || b.over) return;
  b.busy = true; render();
  const topics = pvpOpenTopics(), topic = PVP.setup.topic === 'mixed' || !topics.includes(PVP.setup.topic) ? pick(topics) : PVP.setup.topic;
  const move = movesOf(b.team[b.ai].c)[i];
  const res = await askQuestion({ topic, tier: adaptiveTier(topic, 0), seconds: CONFIG.pvp.seconds, support: false, battle: true, theme: pvpZone(), autoMs: 900,
    title: L(`Power up ${move.name}`, `Potencia ${move.name}`), sub: L('Answer correctly for a strong hit. A miss is only a glancing hit.', 'Responde bien para un golpe fuerte. Un error solo da un golpe débil.') });
  if (!PVP || !PVP.b || PVP.b !== b) return;
  b.mine = { r: b.round, move: i, ok: solved(res) };
  b.busy = false; b.waiting = true;
  pvpSend({ t: 'act', r: b.round, move: i, ok: b.mine.ok });
  b.log = L(`Waiting for ${PVP.opp.name} to answer…`, `Esperando a que ${PVP.opp.name} responda…`);
  render();
  if (PVP.role === 'host') pvpTryResolve();
}
// host only: when both moves are in, work out the round and send it to both screens
function pvpTryResolve() {
  const b = PVP.b; if (!b || !b.mine || !b.theirs || b.mine.r !== b.round || b.theirs.r !== b.round) return;
  const before = { h: b.team.map(f => f.hp), g: b.foes.map(f => f.hp) };   // work it out, then put the bars back so both screens animate the same way
  const H = { f: b.team, a: b.ai, act: b.mine }, Gst = { f: b.foes, a: b.fi, act: b.theirs };
  const sides = { h: H, g: Gst };
  const order = ['h', 'g'].sort((x, y) => (sides[y].f[sides[y].a].st.spd - sides[x].f[sides[x].a].st.spd) || (Math.random() - 0.5));
  const ev = [];
  for (const s of order) {
    const me = sides[s], them = sides[s === 'h' ? 'g' : 'h'], att = me.f[me.a], def = them.f[them.a];
    if (att.hp <= 0 || def.hp <= 0) continue;
    const move = movesOf(att.c)[me.act.move] || movesOf(att.c)[0];
    const d = damage(att, def, move, me.act.ok, false);
    const n = me.act.ok ? d.n : Math.max(1, Math.round(d.n * 0.5));   // a miss lands at half of a normal hit
    def.hp = Math.max(0, def.hp - n);
    ev.push({ s, move: me.act.move, ok: me.act.ok, n, eff: d.eff, ko: def.hp === 0 });
  }
  const next = f => f.findIndex(x => x.hp > 0);
  const newH = H.f[H.a].hp <= 0 ? Math.max(0, next(H.f)) : H.a, newG = Gst.f[Gst.a].hp <= 0 ? Math.max(0, next(Gst.f)) : Gst.a;
  const hOut = H.f.every(x => x.hp <= 0), gOut = Gst.f.every(x => x.hp <= 0);
  const over = hOut && gOut ? 'draw' : hOut ? 'g' : gOut ? 'h' : null;
  const msg = { t: 'res', r: b.round, ev, hp: { h: H.f.map(x => x.hp), g: Gst.f.map(x => x.hp) }, a: { h: newH, g: newG }, over };
  b.team.forEach((f, i) => (f.hp = before.h[i])); b.foes.forEach((f, i) => (f.hp = before.g[i]));
  pvpSend(msg); pvpPlay(msg);
}
// both screens: animate a resolved round
async function pvpPlay(m) {
  const b = PVP.b; if (!b || m.r !== b.round) return;
  b.busy = true; b.waiting = false;
  const mineSide = b.side, them = PVP.opp.name;
  const cur = { me: b.team[b.ai], foe: b.foes[b.fi] };
  for (const e of m.ev) {
    const isMe = e.s === mineSide, att = isMe ? cur.me : cur.foe, mv = movesOf(att.c)[e.move] || movesOf(att.c)[0];
    const who = isMe ? L(SP[att.c.n].name, SP[att.c.n].name) : L(`${them}’s ${SP[att.c.n].name}`, `${SP[att.c.n].name} de ${them}`);
    const ans = e.ok ? L(' Correct answer: a strong hit!', ' ¡Respuesta correcta: un golpe fuerte!') : L(' Missed the problem: just a glancing hit.', ' Falló el problema: solo un golpe débil.');
    { const tgt = isMe ? cur.foe : cur.me; tgt.hp = Math.max(0, tgt.hp - e.n); }
    await show(b, L(`${who.en} used ${mv.name}.${ans.en}${effL(e.eff).en}`, `${who.es} usó ${mv.name}.${ans.es}${effL(e.eff).es}`), isMe ? 'me' : 'foe', { who: isMe ? 'foe' : 'me', n: e.n, crit: e.ok }, 1100);
    if (e.ko) { const ko = isMe ? cur.foe : cur.me; await show(b, L(`${SP[ko.c.n].name} is worn out.`, `${SP[ko.c.n].name} está agotado.`), null, null, 800); }
  }

  const newA = m.a[mineSide], newF = m.a[mineSide === 'h' ? 'g' : 'h'];
  if (!m.over) {
    if (newF !== b.fi) { b.fi = newF; b.foe = b.foes[b.fi]; await show(b, L(`${them} sends out ${SP[b.foe.c.n].name}!`, `¡${them} envía a ${SP[b.foe.c.n].name}!`), null, null, 900); }
    if (newA !== b.ai) { b.ai = newA; await show(b, L(`Go, ${SP[b.team[b.ai].c.n].name}!`, `¡Adelante, ${SP[b.team[b.ai].c.n].name}!`), null, null, 900); }
  }
  b.foe = b.foes[b.fi];
  b.round++; b.mine = null; b.theirs = null; b.busy = false;
  if (m.over) return pvpFinish(m.over === 'draw' ? 'draw' : m.over === mineSide ? 'won' : 'lost');
  b.log = L(`What will ${SP[b.team[b.ai].c.n].name} do?`, `¿Qué hará ${SP[b.team[b.ai].c.n].name}?`);
  render();
}
function pvpFinish(result) {
  const b = PVP.b; b.over = result;
  const ld = lead(), lvl = PVP.setup.level || ld.lv, xp = result === 'won' ? 40 + 2 * lvl : 20 + lvl;
  const ups = ld ? addXp(ld, xp) : [];
  G.pvp = G.pvp || { w: 0, l: 0 };
  const coins = typeof earnCoins === 'function' ? earnCoins(result === 'won' ? 15 : 5) : 0;
  if (result === 'won') { G.pvp.w++; questEvent('battle', { zone: 'arena' }); }
  else if (result === 'lost') G.pvp.l++;
  b.reward = L(`🪙 +${coins} coins. ${SP[ld.n].name} earned ${xp} XP.${ups.length ? ` It reached level ${ld.lv}!` : ''}${evoReady(ld, ups)}`, `🪙 +${coins} monedas. ${SP[ld.n].name} ganó ${xp} XP.${ups.length ? ` ¡Llegó al nivel ${ld.lv}!` : ''}${evoReadyEs(ld, ups)}`);
  save();
  pvpSet({ stage: 'over' });
}
function pvpOnData(d) {
  if (!PVP || !d || typeof d !== 'object' || typeof d.t !== 'string') return;
  if (d.t === 'hello') {
    const opp = pvpClean(d); if (!opp) return pvpFail('Your classmate needs at least one Numling on their team.', 'Tu compañero necesita al menos un Numling en su equipo.');
    pvpSet({ opp, stage: 'ready' }); return;
  }
  if (d.t === 'setup' && PVP.role === 'guest' && PVP.opp) {
    const topics = pvpOpenTopics();
    const setup = { t: 'setup', topic: topics.includes(d.topic) ? d.topic : 'mixed', even: d.even === true, level: Number.isInteger(d.level) && d.level >= 0 && d.level <= 100 ? d.level : 0 };
    pvpBuild(setup); return;
  }
  const b = PVP.b;
  if (d.t === 'act' && b && !b.over && Number.isInteger(d.r) && d.r === b.round && Number.isInteger(d.move) && d.move >= 0 && d.move <= 1) {
    b.theirs = { r: d.r, move: d.move, ok: d.ok === true };
    if (PVP.role === 'host') pvpTryResolve(); return;
  }
  if (d.t === 'res' && PVP.role === 'guest' && b && Number.isInteger(d.r) && Array.isArray(d.ev) && d.hp && d.a) {
    const okHp = (arr, team) => Array.isArray(arr) && arr.length === team.length && arr.every((v, i) => Number.isInteger(v) && v >= 0 && v <= team[i].max);
    // the host's 'h' side is the guest's opponent
    if (!okHp(d.hp.g, b.team) || !okHp(d.hp.h, b.foes)) return;
    const ev = d.ev.slice(0, 2).filter(e => e && (e.s === 'h' || e.s === 'g') && Number.isInteger(e.n) && e.n >= 0 && e.n < 10000).map(e => ({ s: e.s, move: e.move === 1 ? 1 : 0, ok: e.ok === true, n: e.n, eff: [0.67, 1, 1.5].includes(e.eff) ? e.eff : 1, ko: e.ko === true }));
    const clampA = (v, team) => (Number.isInteger(v) && v >= 0 && v < team.length ? v : 0);
    pvpPlay({ r: d.r, ev, hp: { g: d.hp.g, h: d.hp.h }, a: { g: clampA(d.a.g, b.team), h: clampA(d.a.h, b.foes) }, over: ['h', 'g', 'draw', null].includes(d.over) ? d.over : null });
    return;
  }
  if (d.t === 'forfeit' && b && !b.over) { b.log = L(`${PVP.opp.name} gave up.`, `${PVP.opp.name} se rindió.`); pvpFinish('won'); return; }
  if (d.t === 'bye') { if (PVP.stage === 'over') { PVP.oppLeft = true; render(); } else pvpFail('Your classmate left the arena.', 'Tu compañero salió de la arena.'); }
}

/* ---------- the Arena screen ---------- */
function pvpTrainerCard(p, me) {
  return `<div class="pvp-card${me ? ' me' : ''}"><span class="pvp-av">${avatarSVG(p.look, p.outfit, me ? 'right' : 'left')}</span>
    <div><b>${esc(p.name)}</b>${p.title ? `<span class="trainer-title">${esc(tx(titleL(p.title)))}</span>` : ''}
    <div class="pvp-team">${p.team.map(c => `<span class="mini">${artC(c, { label: false })}</span><small>Lv ${c.lv}</small>`).join('')}</div></div></div>`;
}
function renderArena() {
  if (!PVP) PVP = pvpFresh();
  const T = (en, es) => bi(L(en, es)), p = PVP;
  const head = `<button class="btn ghost back" data-act="pvp-leave">${tx(L('Leave the arena', 'Salir de la arena'))}</button>
    <div class="page-head"><h2>${tx(L('Battle Arena', 'Arena de combate'))}</h2></div>`;
  if (!CONFIG.pvp.enabled) return head + `<div class="panel"><p>${T('The arena is closed right now. Your teacher can open it.', 'La arena está cerrada por ahora. Tu maestro puede abrirla.')}</p></div>`;
  if (!pvpProfile().team.length) return head + `<div class="panel"><p>${T('Add a Numling to your team first.', 'Primero agrega un Numling a tu equipo.')}</p></div>`;
  if (p.stage === 'lobby' || p.stage === 'error') return head + `
    ${p.stage === 'error' ? `<div class="panel pvp-error"><b>${T('Something went wrong.', 'Algo salió mal.')}</b><p>${bi(p.msg)}</p></div>` : ''}
    <div class="panel"><h3>${T('Battle a classmate', 'Combate con un compañero')}</h3>
      <p>${T('One of you taps <b>Host</b> and shares the code. The other types it and taps <b>Join</b>. Each round, you both pick a move and answer a problem. Correct answers hit hard!', 'Uno toca <b>Ser anfitrión</b> y comparte el código. El otro lo escribe y toca <b>Unirse</b>. En cada ronda, los dos escogen un movimiento y responden un problema. ¡Las respuestas correctas pegan fuerte!')}</p>
      <div class="pvp-lobby"><button class="btn primary" data-act="pvp-host">${tx(L('Host', 'Ser anfitrión'))}</button>
        <span class="muted">${tx(L('or', 'o'))}</span>
        <input id="pvpCode" class="text-in pvp-code-in" maxlength="4" autocomplete="off" autocapitalize="characters" placeholder="CODE" aria-label="${tx(L('Code from the host', 'Código del anfitrión'))}">
        <button class="btn" data-act="pvp-join">${tx(L('Join', 'Unirse'))}</button></div>
      <p class="small muted">${T(`Your record: ${(G.pvp || {}).w || 0} wins, ${(G.pvp || {}).l || 0} losses.`, `Tu récord: ${(G.pvp || {}).w || 0} victorias, ${(G.pvp || {}).l || 0} derrotas.`)}</p></div>`;
  if (p.stage === 'connecting' || p.stage === 'waiting' || p.stage === 'hello') return head + `<div class="panel pvp-wait">
      ${p.role === 'host' && p.stage === 'waiting' ? `<p>${T('Your code. Tell your classmate to type it:', 'Tu código. Dile a tu compañero que lo escriba:')}</p><div class="pvp-code">${p.code}</div><p class="muted">${T('Waiting for your classmate to join…', 'Esperando a que tu compañero se una…')}</p>`
        : `<p class="muted">${T('Connecting…', 'Conectando…')}</p>`}
      <div class="btn-row"><button class="btn ghost" data-act="pvp-cancel">${tx(L('Cancel', 'Cancelar'))}</button></div></div>`;
  if (p.stage === 'ready') {
    const topics = pvpOpenTopics();
    return head + `<div class="panel"><div class="pvp-vs">${pvpTrainerCard(pvpProfile(), true)}<span class="pvp-vs-badge">VS</span>${pvpTrainerCard(p.opp, false)}</div>
      ${p.role === 'host' ? `<h3>${T('Battle settings', 'Opciones del combate')}</h3>
        <b class="small">${tx(L('Math', 'Matemáticas'))}</b><div class="choice-row">${['mixed', ...topics].map(tp => `<button class="choice" data-act="pvp-topic" data-t="${tp}" aria-pressed="${p.topic === tp}">${tp === 'mixed' ? tx(L('Mixed', 'Mezcla')) : tx(topicL(tp))}</button>`).join('')}</div>
        <b class="small">${tx(L('Levels', 'Niveles'))}</b><div class="choice-row"><button class="choice" data-act="pvp-even" data-v="1" aria-pressed="${p.even}">${tx(L('Even levels', 'Niveles iguales'))}<small>${tx(L('Fair for everyone', 'Justo para todos'))}</small></button>
          <button class="choice" data-act="pvp-even" data-v="0" aria-pressed="${!p.even}">${tx(L('True levels', 'Niveles reales'))}<small>${tx(L('Use your real levels', 'Usa tus niveles reales'))}</small></button></div>
        <div class="btn-row"><button class="btn primary" data-act="pvp-begin">${t('battleBang')}</button></div>`
        : `<p class="muted">${T(`Waiting for ${esc(p.opp.name)} to start the battle…`, `Esperando a que ${esc(p.opp.name)} empiece el combate…`)}</p>`}</div>`;
  }
  // battle and results
  const b = p.b, me = b.team[b.ai], foe = b.foes[b.fi]; b.foe = foe;
  const dmg = who => (b.dmg && b.dmg.who === who ? `<span class="dmg ${b.dmg.crit ? 'crit' : ''}">${MINUS}${b.dmg.n}</span>` : '');
  const cls = who => [b.anim === 'me' && who === 'me' ? 'lunge-me' : '', b.anim === 'foe' && who === 'foe' ? 'lunge-foe' : '', b.anim === 'foe' && who === 'me' ? 'hit' : '', b.anim === 'me' && who === 'foe' ? 'hit' : ''].join(' ');
  let controls;
  if (p.stage === 'over') {
    const msg = b.over === 'won' ? t('youWon') : b.over === 'draw' ? tx(L('It’s a draw!', '¡Es un empate!')) : tx(L(`${p.opp.name} wins this time.`, `${p.opp.name} gana esta vez.`));
    controls = `<div class="panel"><p class="result-msg">${esc(msg)}</p><p>${bi(b.reward)}</p>
      ${p.oppLeft ? `<p class="muted">${T('Your classmate left the arena.', 'Tu compañero salió de la arena.')}</p>` : ''}
      <div class="btn-row">${!p.oppLeft ? (p.role === 'host' ? `<button class="btn primary" data-act="pvp-rematch">${tx(L('Rematch', 'Revancha'))}</button>` : `<span class="muted">${T('The host can start a rematch.', 'El anfitrión puede empezar una revancha.')}</span>`) : ''}
      <button class="btn" data-act="pvp-leave">${tx(L('Leave the arena', 'Salir de la arena'))}</button></div></div>`;
  } else {
    const dis = b.busy || b.waiting ? 'disabled' : '';
    controls = `<div class="moves">${movesOf(me.c).map((m, i) => { const eff = typeMult(m.type, SP[foe.c.n].type);
      return `<button class="btn move" data-act="pvp-move" data-i="${i}" ${dis}>${m.name}<small>${tx(L(`${TYPE_LABEL[m.type]} move${eff > 1 ? ', strong against this foe' : eff < 1 ? ', weak against this foe' : ''}`, `Movimiento ${TYPE_LABEL[m.type]}${eff > 1 ? ', fuerte contra este rival' : eff < 1 ? ', débil contra este rival' : ''}`))}</small></button>`; }).join('')}</div>
      <div class="bench">${b.waiting ? `<span class="pvp-waiting">${T(`Waiting for ${esc(p.opp.name)}…`, `Esperando a ${esc(p.opp.name)}…`)}</span>` : ''}<button class="btn ghost" data-act="pvp-forfeit" ${b.busy ? 'disabled' : ''}>${t('giveUp')}</button></div>`;
  }
  const zone = pvpZone();
  return `<div class="vs-banner pvp-banner"><span class="trainer-face">${avatarSVG(G.look, G.outfit, 'right')}</span><span><b>${esc(G.trainer)}</b><span class="small">${tx(L('Live battle', 'Combate en vivo'))}</span></span>
      <span class="pvp-vs-badge small">VS</span><span><b>${esc(p.opp.name)}</b><span class="small">${tx(L('Round', 'Ronda'))} ${b.round}</span></span><span class="trainer-face">${avatarSVG(p.opp.look, p.opp.outfit, 'left')}</span></div>
    <div class="arena theme-${zone}">${sceneSVG(zone)}
      <div class="side foe">${hpCard(b, foe, true)}<div class="art-wrap plat-wrap ${cls('foe')} ${foe.hp <= 0 ? 'faint' : 'bob'}">${artC(foe.c, { faceLeft: true })}${dmg('foe')}</div></div>
      <div class="side me"><div class="art-wrap plat-wrap ${cls('me')} ${me.hp <= 0 ? 'faint' : 'bob'}">${artC(me.c, { flip: true })}${dmg('me')}</div>${hpCard(b, me, false)}</div>
    </div>
    <p class="log" aria-live="polite">${bi(b.log)}</p>${controls}`;
}

</script>
<script>/* ===== team.js ===== */
/* Numlings: team, collection, codex, and training */
'use strict';
/* ========================= team ========================= */
function renderTeam() {
  const party = G.party.map(byUid);
  const slots = [];
  for (let i = 0; i < CONFIG.partySize; i++) {
    const c = party[i];
    slots.push(c ? `<button class="slot" data-act="detail" data-uid="${c.uid}">${i === 0 ? '<span class="lead-tag">Lead</span>' : ''}
      <div class="art-wrap">${artC(c)}</div><b>${c.shiny ? '✦ ' : ''}${SP[c.n].name}</b><div class="small muted">Level ${c.lv}</div>${canEvolve(c) ? '<span class="evo-tag">Ready to evolve</span>' : ''}</button>`
      : `<div class="slot empty">Open spot. Pick a Numling below to add it.</div>`);
  }
  const sorted = [...G.creatures].sort((a, b) => b.lv - a.lv || a.n - b.n);
  return `${storageBanner()}<div class="page-head"><h2>Your team</h2><button class="btn" data-act="open-arena">⚔ ${tx(L('Battle a classmate', 'Combate con un compañero'))}</button></div>
  <p class="muted">Your lead battles first. Up to ${CONFIG.partySize} Numlings can be on your team.</p>
  <div class="party" style="margin-top:12px">${slots.join('')}</div>
  <div class="section"><h3>Collection (${G.creatures.length} of ${CONFIG.boxLimit})</h3>
  <div class="tile-grid">${sorted.map(c => `<button class="tile ${G.party.includes(c.uid) ? 'in-party' : ''}" data-act="detail" data-uid="${c.uid}">
    <div class="art-wrap">${artC(c)}</div>${c.shiny ? '✦ ' : ''}${SP[c.n].name}<span class="lv">Level ${c.lv}${G.party.includes(c.uid) ? ', on team' : ''}</span>${canEvolve(c) ? '<span class="evo-tag">Ready to evolve</span>' : ''}</button>`).join('')}</div></div>`;
}
function statRows(st) {
  const rows = [['HP', st.hp], ['Attack', st.atk], ['Defense', st.def], ['Speed', st.spd]];
  const top = Math.max(...rows.map(r => r[1]));
  return rows.map(([k, v]) => `<div class="statrow"><span>${k}</span><b>${v}</b><span class="statbar"><i style="width:${Math.round(v / top * 100)}%"></i></span></div>`).join('');
}
function showDetail(uid) {
  const c = byUid(uid); if (!c) return;
  const s = SP[c.n], st = stats(c), inParty = G.party.includes(uid), isLead = G.party[0] === uid;
  const partyFull = G.party.length >= CONFIG.partySize;
  const ov = openModal(`<div class="detail-top"><div class="bob">${artC(c)}</div>
      <div><h2>${s.name}</h2><div class="chips" style="margin:6px 0">${typeChip(s.type)}${c.shiny ? shinyChip : ''}${rarityTag(s.r)}</div>
      <b>Level ${c.lv}</b>${c.lv < 50 ? `<div class="xpbar" role="progressbar" aria-label="XP" aria-valuemin="0" aria-valuemax="${xpNext(c.lv)}" aria-valuenow="${c.xp}"><i style="width:${Math.round(c.xp / xpNext(c.lv) * 100)}%"></i></div><span class="small muted">${c.xp} of ${xpNext(c.lv)} XP to level ${c.lv + 1}</span>` : '<span class="small muted">Max level</span>'}</div></div>
    <p class="note">${s.note}</p>
    <div class="stack" style="gap:6px">${statRows(st)}</div>
    <p class="small" style="margin-top:12px"><b>Moves:</b> Bump (Normal) and ${s.move} (${TYPE_LABEL[s.type]})</p>
    ${s.evo ? `<p class="small evo-line">${canEvolve(c) ? `<b>Ready to evolve!</b> Pass the evolution trial to transform ${s.name}.` : `<b>Evolves at level ${s.evoLv}</b> after passing ${s.stage === 2 ? 'the final evolution trial' : 'an evolution trial'}. ${s.evoLv - c.lv} level${s.evoLv - c.lv === 1 ? '' : 's'} to go.`}</p>` : s.evolved ? `<p class="small evo-line">${s.stage === 3 ? '<b>Final form.</b> ' : ''}Evolved from ${SP[s.from].name}.</p>` : `<p class="small evo-line">${s.name} doesn’t evolve. It’s already one of a kind.</p>`}
    <div class="btn-row">
      ${canEvolve(c) ? `<button class="btn primary" data-d="evolve">${s.stage === 2 ? 'Start final evolution trial' : 'Start evolution trial'}</button>` : ''}
      ${inParty && !isLead ? '<button class="btn primary" data-d="lead">Make lead</button>' : ''}
      ${!inParty ? `<button class="btn primary" data-d="add" ${partyFull ? 'disabled' : ''}>${partyFull ? 'Team is full' : 'Add to team'}</button>` : ''}
      ${inParty && G.party.length > 1 ? '<button class="btn" data-d="remove">Remove from team</button>' : ''}
      <button class="btn" data-d="train">Train</button>
      ${G.creatures.length > 1 && !(inParty && G.party.length === 1) ? '<button class="btn danger" data-d="release">Release</button>' : ''}
      <button class="btn ghost" data-d="close">Close</button>
    </div>`);
  ov.addEventListener('click', async e => {
    const b = e.target.closest('[data-d]'); if (!b || b.disabled) return;
    const a = b.dataset.d;
    if (a === 'close') { closeModal(ov); return; }
    if (a === 'lead') { G.party = [uid, ...G.party.filter(u => u !== uid)]; toast(`${s.name} is your lead now.`); }
    if (a === 'add') { G.party.push(uid); toast(tx(L(`${s.name} joined your team.`, `${s.name} se unió a tu equipo.`))); }
    if (a === 'remove') G.party = G.party.filter(u => u !== uid);
    if (a === 'train') { closeModal(ov); go('train', { uid }); return; }
    if (a === 'evolve') { closeModal(ov); go('trial', { uid, phase: 'intro' }); return; }
    if (a === 'release') {
      closeModal(ov);
      if (!(await confirmBox(`Release ${s.name} (level ${c.lv})? This can’t be undone.`, 'Release', true))) { showDetail(uid); return; }
      G.creatures = G.creatures.filter(x => x.uid !== uid); G.party = G.party.filter(u => u !== uid);
      save(); render(); toast(`${s.name} was released.`); return;
    }
    save(); closeModal(ov); render();
  });
}

/* ========================= codex ========================= */
function renderCodex() {
  const groups = [['starter', 'Starters'], ...Object.entries(ZONES).map(([id, z]) => [id, z.name]), ['stage2', 'Evolved forms'], ['stage3', 'Final forms'], ['dungeon', 'Dungeon']];
  const cyc = TYPES.map(t => typeChip(t)).join(' <span aria-hidden="true">→</span> ') + ' <span aria-hidden="true">→</span> ' + typeChip('blaze');
  return `<div class="page-head"><h2>Codex</h2><span class="muted">${G.caught.size} of ${SPECIES.length} caught, ${G.seen.size} seen, ${G.shinies.size} shiny</span></div>
  <div class="panel"><b>Type matchups.</b> Each type is strong against the next one.
    <div class="cycle" style="margin-top:8px" aria-label="Blaze beats Grove, Grove beats Volt, Volt beats Tide, Tide beats Blaze">${cyc}</div></div>
  ${groups.map(([id, label]) => `<div class="section"><h3>${label}</h3><div class="tile-grid">${(id === 'stage2' ? SPECIES.filter(s => s.stage === 2) : id === 'stage3' ? SPECIES.filter(s => s.stage === 3) : BASE_SPECIES.filter(s => s.zone === id)).map(s => {
    const caught = G.caught.has(s.n), seen = G.seen.has(s.n);
    if (caught) return `<button class="tile${G.shinies.has(s.n) ? ' has-shiny' : ''}" data-act="species" data-n="${s.n}">${G.shinies.has(s.n) ? '<span class="shiny-badge" aria-label="Shiny found">✦</span>' : ''}<span class="dexno">No. ${s.n}</span><div class="art-wrap">${art(s.n)}</div>${s.name}${stars(s.r)}</button>`;
    return `<div class="tile locked"><span class="dexno">No. ${s.n}</span><div class="art-wrap">${art(s.n, { sil: true, faint: !seen })}</div>${seen ? s.name : '???'}${seen ? stars(s.r) : ''}</div>`;
  }).join('')}</div></div>`).join('')}`;
}
function showSpecies(n) {
  const s = SP[n];
  const where = s.evolved ? `${s.stage === 3 ? 'Final form. ' : ''}Evolves from ${SP[s.from].name} at level ${SP[s.from].evoLv} by passing ${s.stage === 3 ? 'the final evolution trial' : 'an evolution trial'}. Never found in the wild.`
    : (s.zone === 'starter' ? 'A starter Numling.' : s.zone === 'dungeon' ? (s.n === 68 ? 'Joins your team the first time you clear the Dungeon of Multiplia on Chaos. Never found in the wild.' : `Lives in the Dungeon of Multiplia and blocks the exit after a clear${s.n === CONFIG.dungeons.multiplia.rare ? '. The rare one: it appears after about 1 clear in 10' : ''}. Perfect runs can summon a shiny.`) : `Found in ${ZONES[s.zone].name}. ${catchPlan(s.r)}`) +
      (s.evo ? ` Evolves at level ${s.evoLv} into ${G.caught.has(s.evo) ? SP[s.evo].name : 'a form you haven’t discovered yet'}.` : '');
  const nextLine = s.evolved && s.evo ? ` At level ${s.evoLv} it can reach its final form, ${G.caught.has(s.evo) ? SP[s.evo].name : 'a form you haven’t discovered yet'}.` : '';
  const sh = G.shinies.has(n);
  const ov = openModal(`<div class="detail-top"><div class="bob">${art(n)}</div><div><span class="dexno">No. ${n}</span><h2>${s.name}</h2>
    <div class="chips" style="margin-top:6px">${typeChip(s.type)}${rarityTag(s.r)}</div></div></div>
    <p class="note">${s.note}</p><p class="small">${where}${nextLine}${s.r === 5 && CONFIG.encounters.legendaryNeedsBadge && ZONES[s.zone] ? ` Appears only after you earn the ${ZONES[s.zone].name} Badge.` : ''}</p>
    <div class="shiny-row">${sh ? `<div class="mini-shiny">${art(n, { shiny: true })}</div><p class="small"><b>✦ Shiny found!</b> You’ve caught the shiny version of ${s.name}.</p>` : `<div class="mini-shiny">${art(n, { sil: true })}</div><p class="small muted">Shiny version not found yet. Shinies are rare recolors of wild Numlings.</p>`}</div><p class="small"><b>Signature move:</b> ${s.move}</p>
    <div class="btn-row"><button class="btn" data-d="close">Close</button></div>`);
  ov.addEventListener('click', e => { if (e.target.closest('[data-d]')) closeModal(ov); });
}

/* ========================= training ========================= */
const TRAIN_TIERS = { 1: { label: 'Warm-up', es: 'Calentamiento', xp: 5 }, 2: { label: 'Standard', es: 'Estándar', xp: 9 }, 3: { label: 'Challenge', es: 'Reto', xp: 14 } };
const tierL = n => L(TRAIN_TIERS[n].label, TRAIN_TIERS[n].es);
const STATUS_ES = { new: 'Sin intentar', start: 'Empezando', mastered: 'Dominado', practicing: 'Practicando', learning: 'Aprendiendo' };
const statusL = st => L(st.label, STATUS_ES[st.cls]);
const TOPIC_ES = { rational: 'Destrezas de Integer Isles', proportion: 'Destrezas de Ratio Rapids', equations: 'Destrezas de Balance Bluffs', circles: 'Destrezas de Pi Meadows' };
const topicL = tp => L(TOPIC_LABEL[tp], TOPIC_ES[tp] || TOPIC_LABEL[tp]);
// Training XP grows with level so higher levels stay reachable: +5% per level. Answers that needed a hint earn half.
const trainXp = (tier, lv) => Math.round(TRAIN_TIERS[tier].xp * (1 + lv / 20));
const STATUS_ORDER = { learning: 0, start: 1, practicing: 2, new: 3, mastered: 4 };
function skillRows(topic) {
  return skillsFor(topic).map(sk => {
    const st = skillStatus(sk.id), k = G.skills[sk.id], focus = (CONFIG.focusSkills || []).includes(sk.id);
    return `<button class="skill-row ${ctx.skill === sk.id ? 'sel' : ''}" data-act="train-skill" data-s="${sk.id}" aria-pressed="${ctx.skill === sk.id}">
      <span class="skill-name">${bi(skillName(sk))}${focus ? ` <span class="focus-tag">${tx(L('Class focus', 'Enfoque de la clase'))}</span>` : ''}<small>TEKS ${sk.teks}. ${tx([null, L('Warm-up', 'Calentamiento'), L('On level', 'A nivel'), L('Challenge', 'Reto')][sk.tier])}.</small></span>
      <span class="skill-bar"><i class="${st.cls}" style="width:${Math.round(st.m * 100)}%"></i></span>
      <span class="skill-status ${st.cls}">${tx(statusL(st))}${k ? `<small>${tx(L(`${k.c + k.h} of ${k.a} right${k.h ? `, ${k.h} with a hint` : ''}`, `${k.c + k.h} de ${k.a} correctas${k.h ? `, ${k.h} con pista` : ''}`))}</small>` : ''}</span></button>`;
  }).join('');
}
function renderTrain() {
  if (!ctx.uid || !byUid(ctx.uid)) ctx.uid = G.party[0];
  const topics = openZones().map(z => ZONES[z].topic);
  if (!ctx.topic || (ctx.topic !== 'mixed' && !topics.includes(ctx.topic))) ctx.topic = topics[0];
  if (ctx.tier == null) ctx.tier = 0; // 0 = adaptive
  if (ctx.skill && (!SKILL[ctx.skill] || (ctx.topic !== 'mixed' && SKILL[ctx.skill].topic !== ctx.topic))) ctx.skill = null;
  const c = byUid(ctx.uid), s = SP[c.n];
  const opts = [...G.creatures].sort((a, b) => (G.party.includes(b.uid) - G.party.includes(a.uid)) || b.lv - a.lv)
    .map(x => `<option value="${x.uid}" ${x.uid === c.uid ? 'selected' : ''}>${SP[x.n].name}, Lv ${x.lv}${G.party.includes(x.uid) ? ', team' : ''}</option>`).join('');
  const showTopics = ctx.topic === 'mixed' ? topics : [ctx.topic];
  const wt = ctx.topic === 'mixed' ? null : workingTier(ctx.topic);
  const T = (en, es) => bi(L(en, es));
  return `<div class="page-head"><h2>${tx(L('Training', 'Entrenamiento'))}</h2></div>
  <p class="muted">${T('Every correct answer gives XP. Harder problems give more, and 3 in a row starts a streak bonus. Stuck? Tap Hint. Hinted answers earn half XP.', 'Cada respuesta correcta da XP. Los problemas más difíciles dan más, y 3 seguidas activan un bono de racha. ¿Atorado? Toca Pista. Las respuestas con pista ganan la mitad de XP.')}</p>
  ${ctx.summary ? `<div class="panel" style="margin:14px 0;border-color:var(--good)"><b>${tx(L('Session done.', 'Sesión terminada.'))}</b> ${bi(ctx.summary)}</div>` : ''}
  <div class="stack" style="margin-top:14px">
    <div class="panel" style="display:grid;grid-template-columns:110px 1fr;gap:14px;align-items:center">
      <div class="bob">${artC(c)}</div>
      <div class="field" style="max-width:none"><label for="tsel">${tx(L('Numling to train', 'Numling para entrenar'))}</label>
        <select id="tsel" class="text-in" data-change="train-uid">${opts}</select>
        ${c.lv < 50 ? `<div class="xpbar"><i style="width:${Math.round(c.xp / xpNext(c.lv) * 100)}%"></i></div><span class="small muted">${tx(L(`Level ${c.lv}: ${c.xp} of ${xpNext(c.lv)} XP to level ${c.lv + 1}`, `Nivel ${c.lv}: ${c.xp} de ${xpNext(c.lv)} XP para el nivel ${c.lv + 1}`))}</span>` : `<span class="small muted">${tx(L('Max level', 'Nivel máximo'))}</span>`}</div>
    </div>
    <div><h3 style="margin-bottom:8px">${tx(L('Zone skills', 'Destrezas por zona'))}</h3><div class="choice-row">
      ${topics.map(tp => `<button class="choice" data-act="train-topic" data-t="${tp}" aria-pressed="${ctx.topic === tp}">${tx(topicL(tp))}</button>`).join('')}
      ${topics.length > 1 ? `<button class="choice" data-act="train-topic" data-t="mixed" aria-pressed="${ctx.topic === 'mixed'}">${tx(L('Mixed', 'Mezcla'))}</button>` : ''}</div></div>
    <div><h3 style="margin-bottom:8px">${tx(L('Difficulty', 'Dificultad'))}</h3><div class="choice-row">
      <button class="choice" data-act="train-tier" data-t="0" aria-pressed="${ctx.tier === 0 && !ctx.skill}">${tx(L('Just right', 'A tu medida'))}<small>${tx(L(`Adapts to you${wt ? `, now ${TRAIN_TIERS[wt].label.toLowerCase()}` : ''}`, `Se adapta a ti${wt ? `, ahora ${TRAIN_TIERS[wt].es.toLowerCase()}` : ''}`))}</small></button>
      ${[1, 2, 3].map(n => `<button class="choice" data-act="train-tier" data-t="${n}" aria-pressed="${ctx.tier === n && !ctx.skill}">${tx(tierL(n))}<small>${tx(L(`+${trainXp(n, c.lv)} XP each`, `+${trainXp(n, c.lv)} XP cada una`))}</small></button>`).join('')}</div></div>
    <div><button class="btn primary" data-act="train-go">${ctx.skill ? esc(tx(L(`Practice ${SKILL[ctx.skill].label.toLowerCase()}`, `Practicar: ${SKILL[ctx.skill].es.toLowerCase()}`))) : esc(tx(L(`Start training ${s.name}`, `Entrenar a ${s.name}`)))}</button>
      ${ctx.skill ? `<button class="btn ghost" data-act="train-skill" data-s="">${tx(L('Clear skill choice', 'Quitar la destreza'))}</button>` : ''}</div>
    <div class="panel"><h3>${tx(L('Your skills', 'Tus destrezas'))}</h3><p class="small muted">${T('Tap a skill to practice just that one.', 'Toca una destreza para practicar solo esa.')}</p>
      ${showTopics.map(tp => `<div class="skill-group"><b class="small">${tx(topicL(tp))}</b>${skillRows(tp)}</div>`).join('')}</div>
  </div>`;
}
async function runTraining() {
  const c = byUid(ctx.uid), name = SP[c.n].name, topics = openZones().map(z => ZONES[z].topic);
  let streak = 0, total = 0, right = 0, hinted = 0, asked = 0; const startLv = c.lv;
  for (;;) {
    const sk = ctx.skill ? SKILL[ctx.skill] : null;
    const topic = sk ? sk.topic : ctx.topic === 'mixed' ? pick(topics) : ctx.topic;
    const tier = sk ? sk.tier : ctx.tier || adaptiveTier(topic);
    const res = await askQuestion({ topic, tier, skill: sk ? sk.id : null, seconds: 0, allowStop: true, autoMs: 1300,
      title: sk ? skillName(sk) : L(`Training ${name}`, `Entrenando a ${name}`), sub: L(`${streak >= 3 ? `Streak of ${streak}! Bonus XP is on.` : `Streak: ${streak}.`} This session: +${total} XP.`, `${streak >= 3 ? `¡Racha de ${streak}! Tienes XP extra.` : `Racha: ${streak}.`} En esta sesión: +${total} XP.`),
      onResult: (ok, withHint) => {
        if (!ok) { streak = 0; return ''; }
        if (!withHint) streak++;
        const xp = Math.max(1, Math.round(trainXp(tier, c.lv) * (streak >= 3 && !withHint ? 1.5 : 1) * (withHint ? 0.5 : 1)));
        const ups = addXp(c, xp); total += xp;
        return L(` +${xp} XP for ${name}.${ups.length ? ` ${name} reached level ${c.lv}!` : ''}${evoReady(c, ups)}`, ` +${xp} XP para ${name}.${ups.length ? ` ¡${name} llegó al nivel ${c.lv}!` : ''}${evoReadyEs(c, ups)}`);
      } });
    if (res === 'stop') break;
    asked++; if (res === 'correct') right++; if (res === 'assisted') hinted++;
  }
  ctx.summary = asked ? L(`${right + hinted} of ${asked} right${hinted ? ` (${hinted} with a hint)` : ''}. ${name} earned ${total} XP${c.lv > startLv ? ` and went from level ${startLv} to ${c.lv}` : ''}.`,
                         `${right + hinted} de ${asked} correctas${hinted ? ` (${hinted} con pista)` : ''}. ${name} ganó ${total} XP${c.lv > startLv ? ` y subió del nivel ${startLv} al ${c.lv}` : ''}.`) : '';
  save(); render();
}

</script>
<script>/* ===== trial.js ===== */
/* Numlings: evolution trials */
'use strict';
/* ========================= evolution trials ========================= */
const trialCfg = c => (SP[c.n].stage === 2 ? CONFIG.evolution.final : CONFIG.evolution);
const isFinalTrial = c => SP[c.n].stage === 2;
function trialTopic(c) {
  const z = SP[c.n].zone;
  if (ZONES[z]) return ZONES[z].topic;
  return pick(openZones().map(id => ZONES[id].topic)); // starters: any open zone's skills
}
function trialZone(c) { const z = SP[c.n].zone; return ZONES[z] ? z : (openZones()[0] || 'isles'); }
function trialTrack() {
  const c = byUid(ctx.uid), E = ctx.cfg || trialCfg(c), r = ctx.results || [];
  return `<div class="track" aria-label="${r.filter(x => x).length} right, ${r.filter(x => !x).length} missed">${Array.from({ length: E.questions }, (_, i) =>
    `<span class="slot-q ${i < r.length ? (r[i] ? 'ok' : 'miss') : ''}">${i < r.length ? (r[i] ? '✓' : '✗') : i + 1}</span>`).join('')}
    <span class="need">Need ${E.needed}</span></div>`;
}
function statLine(a, b) {
  const rows = [['HP', 'hp'], ['Attack', 'atk'], ['Defense', 'def'], ['Speed', 'spd']];
  return rows.map(([lab, k]) => `<div class="statrow"><span>${lab}</span><b>${b[k]}</b><span class="gain">+${b[k] - a[k]}</span></div>`).join('');
}
function renderTrial() {
  const c = byUid(ctx.uid), E = ctx.cfg || trialCfg(c), zone = trialZone(c);
  const sp = SP[c.n], fin = ctx.cfg ? ctx.cfg === CONFIG.evolution.final : isFinalTrial(c);
  const right = (ctx.results || []).filter(x => x).length;
  let scene = '', panel = '';
  if (ctx.phase === 'evolving' || ctx.phase === 'passed') {
    const before = SP[ctx.fromN];
    scene = `<div class="stage evo-stage"><div class="rays"></div>
      ${ctx.phase === 'evolving' ? `<div class="foe evo-old">${art(before.n, { shiny: c.shiny })}</div>` : ''}
      <div class="foe evo-new ${ctx.phase === 'passed' ? 'bob' : ''}">${artC(c)}</div></div>`;
    panel = ctx.phase === 'evolving' ? `<p class="result-msg">What’s happening to ${before.name}?</p>` :
      `<p class="result-msg">${before.name} evolved into ${sp.name}!</p>${sp.stage === 3 ? '<p><b>Final form reached.</b> This is the strongest a Numling can become.</p>' : ''}
      <p>You got ${right} of ${E.questions} hard problems right. That’s real mastery.</p>
      <div class="stack" style="gap:6px;margin:10px 0">${statLine(ctx.oldStats, stats(c))}</div>
      <p class="small"><b>New signature move:</b> ${sp.move} (${TYPE_LABEL[sp.type]}). It hits harder than ${before.move}.</p>
      ${ctx.xp ? `<p class="small muted">${sp.name} also earned ${ctx.xp} XP during the trial.</p>` : ''}
      <div class="btn-row"><button class="btn primary" data-act="nav" data-to="team">See your team</button><button class="btn" data-act="species" data-n="${sp.n}">Codex entry</button></div>`;
  } else {
    scene = `<div class="stage duo"><div class="foe bob">${artC(c)}</div><span class="arrow" aria-hidden="true">→</span><div class="foe mystery">${art(sp.evo, { sil: true })}</div></div>`;
    if (ctx.phase === 'failed') {
      const short = E.needed - right;
      panel = `<p class="result-msg">${short === 1 ? `${right} of ${E.needed}. So close!` : `${right} of ${E.needed} needed.`}</p>
        <p>${short === 1 ? 'One more right answer and it would have evolved.' : 'These are the hardest problems in the game. Train on Challenge, then try again.'} You can retry as many times as you like, and every attempt brings new problems.</p>
        ${ctx.xp ? `<p class="small muted">${sp.name} still earned ${ctx.xp} XP from this attempt.</p>` : ''}
        ${trialTrack()}
        <div class="btn-row"><button class="btn primary" data-act="trial-start">Try again</button><button class="btn" data-act="train-this">Train first</button><button class="btn ghost" data-act="nav" data-to="team">Back to team</button></div>`;
    } else if (ctx.phase === 'running') {
      panel = `<p class="result-msg">Trial in progress</p><p>${right} right so far.</p>${trialTrack()}`;
    } else {
      panel = `<p class="result-msg">${sp.name} is ready ${fin ? 'for its final evolution' : 'to evolve'}.</p>
        ${fin ? '<p><b>Final trial.</b> Every problem is from the hardest tier, so this one takes real skill.</p>' : ''}
        <p>Prove you’ve mastered ${ZONES[sp.zone] ? ZONES[sp.zone].name : 'your zone'} skills. You’ll get ${E.questions} hard problems with ${E.seconds} seconds each. Get ${E.needed} right and ${sp.name} evolves. The trial ends after ${E.questions - E.needed + 1} misses.</p>
        <p class="small muted">Retry as many times as you need. Every correct answer earns XP, even if the trial doesn’t pass.</p>
        ${trialTrack()}
        <div class="btn-row"><button class="btn primary" data-act="trial-start">Start the trial</button><button class="btn ghost" data-act="nav" data-to="team">Not yet</button></div>`;
    }
  }
  return `<div class="enc theme-${zone}">
    <div class="scene trial-scene">${sceneSVG(zone)}<span class="scene-tag">${fin ? 'Final evolution trial' : 'Evolution trial'}</span>${scene}</div>
    <div class="panel enc-info"><h2 class="enc-name">${ctx.phase === 'evolving' ? SP[ctx.fromN].name : sp.name}</h2>
      <div class="chips" style="margin:6px 0 4px">${typeChip(sp.type)}<span class="chip" style="--c:var(--none)">Level ${c.lv}</span></div>${panel}</div>
  </div>`;
}
async function runTrial() {
  const c = byUid(ctx.uid); if (!c || !canEvolve(c)) { go('team'); return; }
  const E = trialCfg(c), here = ctx, zone = trialZone(c);
  here.cfg = E; here.results = []; here.xp = 0; here.phase = 'running';
  G.stats.trials[0]++; save(); render();
  const maxMiss = E.questions - E.needed;
  while (here.results.length < E.questions) {
    const right = here.results.filter(x => x).length, miss = here.results.length - right;
    if (right >= E.needed || miss > maxMiss) break;
    const i = here.results.length, tier = E.tiers[i] || 3;
    const res = await askQuestion({ topic: trialTopic(c), tier, seconds: E.seconds, theme: zone, side: true, autoMs: 1100, support: false,
      title: E === CONFIG.evolution.final ? L('Final evolution trial', 'Prueba de evolución final') : L('Evolution trial', 'Prueba de evolución'), headArt: artC(c, { label: false }),
      head: `<span class="pips">${Array.from({ length: E.questions }, (_, k) => `<span class="pip ${k < i ? (here.results[k] ? 'on' : 'off') : ''}"></span>`).join('')}</span>`,
      sub: L(`Problem ${i + 1} of ${E.questions}. ${right} right, ${miss} missed. Need ${E.needed}.`, `Problema ${i + 1} de ${E.questions}. ${right} correctas, ${miss} errores. Necesitas ${E.needed}.`),
      onResult: ok => { if (!ok) return ''; const xp = trainXp(tier, c.lv); addXp(c, xp); here.xp += xp; return ` +${xp} XP.`; } });
    if (ctx !== here) return;
    here.results.push(res === 'correct');
    render(); await sleep(300);
  }
  const passed = here.results.filter(x => x).length >= E.needed;
  if (!passed) { here.phase = 'failed'; save(); render(); return; }
  here.fromN = c.n; here.oldStats = stats(c);
  c.n = SP[c.n].evo; G.seen.add(c.n); G.caught.add(c.n); if (c.shiny) G.shinies.add(c.n); G.stats.trials[1]++; questEvent('evolve'); save();
  here.phase = 'evolving'; render();
  await sleep(matchMedia('(prefers-reduced-motion: reduce)').matches ? 300 : 2400);
  if (ctx !== here) return;
  here.phase = 'passed'; render();
}

</script>
<script>/* ===== savepage.js ===== */

      <div style="margin-top:14px"><b class="small">Dungeon of Multiplia</b><div class="badges">${['easy', 'hard', 'chaos'].map(d => { const r = G.dungeon[d];
        return `<span class="badge ${r.clears ? 'on' : ''}" style="--c:${DG[d].color}"><span class="crest-wrap">${crestSVG(d, r.clears > 0)}</span>${DG[d].label}<small>${r.clears ? `Fastest ${fmtSec(r.fastest)}, ${(r.avg / 10).toFixed(1)} s per fact` : r.best ? `Best: ${r.best} facts` : 'Not yet'}</small></span>`; }).join('')}</div></div>

      ${langSwitch()}</div>

      ${storageOK && !lastSaveOK ? '<p class="banner">The last save didn’t go through. Copy your save code to be safe.</p>' : ''}</div>

<script>/* ===== main.js ===== */

  'hm-chore': t => homeChore(t.dataset.c),
  'hm-pet': t => homePet(t.dataset.uid),
  'hm-noop': () => toast(tx(L('Welcome home!', '¡Bienvenido a casa!'))),
  'hm-expand': () => homeExpand(),
  // live battles
  'open-arena': () => go('arena'),
  'pvp-host': () => pvpStart(true),
  'pvp-join': () => { const c = ($('#pvpCode').value || '').trim().toUpperCase(); if (/^[A-Z0-9]{4}$/.test(c)) pvpStart(false, c); else { toast(tx(L('Type the 4-letter code first.', 'Primero escribe el código de 4 letras.'))); $('#pvpCode').focus(); } },
  'pvp-cancel': () => { pvpLeave(); PVP = null; render(); },
  'pvp-leave': () => { pvpLeave(); PVP = null; exploreNav(); },
  'pvp-topic': t => { PVP.topic = t.dataset.t; render(); },
  'pvp-even': t => { PVP.even = t.dataset.v === '1'; render(); },
  'pvp-begin': () => pvpBegin(),
  'pvp-rematch': () => pvpBegin(),
  'pvp-move': t => pvpChoose(+t.dataset.i),
  'pvp-forfeit': async () => { if (await confirmBox(tx(L('Give up this battle? It counts as a loss.', '¿Rendirte en este combate? Cuenta como derrota.')), tx(L('Give up', 'Rendirse')), true)) { pvpSend({ t: 'forfeit' }); PVP.b.log = L('You gave up.', 'Te rendiste.'); pvpFinish('lost'); } },
  'open-wardrobe': () => go('wardrobe', { wtab: firstNewTab() }),
  'try-catch': () => tryCatch(),
  'start-battle': () => startBattle({ zone: ctx.zone, foes: [{ n: ctx.wild.n, lv: ctx.wild.battleLv, shiny: ctx.wild.shiny }], wild: ctx.wild }),
  'catch-after': () => { const z = ctx.zone, w = ctx.wild; go('encounter', { zone: z, wild: w, afterBattle: true }); },
  move: t => battleTurn({ move: +t.dataset.i }),
  swap: t => battleTurn({ swap: +t.dataset.i }),
  run: () => {
    const tr = ctx.trainer;
    toast(tr ? `You can battle ${tr.short} again anytime.` : 'You got away safely.');
    W ? go('map') : enterTown();
  },
  detail: t => showDetail(+t.dataset.uid),
  species: t => showSpecies(+t.dataset.n),
  'train-topic': t => { ctx.topic = t.dataset.t; ctx.summary = ''; render(); },
  'train-tier': t => { ctx.tier = +t.dataset.t; ctx.skill = null; ctx.summary = ''; render(); },
  'train-skill': t => { ctx.skill = t.dataset.s || null; ctx.summary = ''; render(); },
  'train-go': () => runTraining(),
  'dungeon-open': () => go('dungeon', { phase: 'lobby', diff: 'easy' }),
  'dg-diff': t => { ctx.diff = t.dataset.d; render(); },
  'dg-start': () => startDungeon(),
  'dg-catch': () => startDgCatch(),
  'dg-letgo': () => { const q = ctx.queue.shift(); ctx.catchMsg = `You let ${SP[q.n].name} go.`; render(); },
  'dg-lobby': () => go('dungeon', { phase: 'lobby', diff: ctx.diff }),
  'dg-quit': async () => { const r = ctx.run; if (!r) return; r.busy = true; cancelAnimationFrame(dgTimer);
    const isCatch = r.mode === 'catch';
    if (await confirmBox(isCatch ? `Stop trying to catch ${SP[r.guard].name}? It will escape.` : 'Leave the dungeon? Your run ends here.', isCatch ? 'Let it escape' : 'Leave', true)) { isCatch ? dgCatchEnd(false) : dgEnd(false, true); }
    else { r.busy = false; dgNext(); } },
  'trial-start': () => { ctx.cfg = null; runTrial(); },
  'train-this': () => go('train', { uid: ctx.uid, tier: 3 }),
  'turn-in': async () => {
    save(); const code = encodeSave(G), url = CONFIG.turnIn.url;
    try { await navigator.clipboard.writeText(code); } catch (e) { /* the form link still carries the code */ }
    const link = url.includes('CODE') ? url.replace('CODE', encodeURIComponent(code)) : url;
    window.open(link, '_blank', 'noopener');
    toast(url.includes('CODE') ? 'Your code is filled in. Press Submit on the form.' : 'Code copied. Paste it into the form, then press Submit.', 4500);
  },
  'show-code': () => { ctx.showCode = true; render(); setTimeout(() => $('#codeOut')?.select(), 30); },
  'copy-code': async () => {
    const box = $('#codeOut'); box.select();
    try { await navigator.clipboard.writeText(box.value); toast('Save code copied.'); }
    catch (e) { try { document.execCommand('copy'); toast('Save code copied.'); } catch (e2) { toast('Select the code and copy it yourself.'); } }
  },
  'load-code': async () => {
    const v = $('#codeIn').value; if (!v.trim()) { toast('Paste a save code first.'); return; }
    let st; try { st = decodeSave(v); } catch (err) { toast(err.message, 4000); return; }
    if (!(await confirmBox(`Load ${esc(st.trainer)}’s game? It will replace the game on this device.`, 'Load game'))) return;
    G = st; W = null; save(); enterTown(); toast(`Welcome back, ${G.trainer}!`);
  },
  reset: async () => {
    if (!(await confirmBox('Start over? Your current game will be erased from this browser. Copy your save code first if you might want it back.', 'Erase and start over', true))) return;
    try { localStorage.removeItem(STORE_KEY); } catch (e) {}
    G = null; W = null; go('newgame', {});
  },
};
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t || t.disabled || !$('#app').contains(t) && !$('#nav').contains(t)) return;
  const f = ACT[t.dataset.act]; if (f) f(t, e);
});
document.addEventListener('change', e => {
  if (e.target.dataset.change === 'train-uid') { ctx.uid = +e.target.value; ctx.summary = ''; render(); }
});

/* ========================= boot ========================= */
buildSprites();
G = loadLocal();
go('title');

</script>

</body>
</html>
